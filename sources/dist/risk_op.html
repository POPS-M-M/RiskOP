    '<p>Depuis l\'écran d\'accueil, <b>Combat arcade</b> ouvre un mode d\'action en temps réel, séparé du jeu de stratégie : un équipage de trois (<b>Luffy, Zoro, Sanji</b>) prend d\'assaut la base de Shells Town : quatre vagues de Marines, puis le capitaine <b>Morgan</b> en deux phases.</p>'
    +'<p><b>Commandes</b> : clic droit ou flèches pour se déplacer, clic gauche pour attaquer (enchaînement de 3 coups), <b>Q, W, E, R</b> pour les compétences (A et Z marchent aussi sur un clavier AZERTY), <b>Espace</b> pour esquiver, <b>1, 2, 3</b> ou <b>Tab</b> pour changer de personnage, <b>F</b> et <b>G</b> pour les assistances, <b>T</b> pour l\'attaque combinée. Au tactile : touchez le sol ou un ennemi, et utilisez les boutons du bas.</p>'
    +'<p><b>Règles</b> : les zones rouges annoncent les attaques. Esquiver un coup au bon moment donne une esquive parfaite. Les coups enchaînés font monter un compteur de combo (dégâts +1 % par coup, 30 % au plus) qui retombe à zéro si vous êtes touché. L\'équipage gagne des niveaux pendant la mission ; les ultimes (Gear 5, Ashura, Diable Jambe) se débloquent au niveau 3. Chaque personnage a son passif et son rôle ; un personnage au repos récupère ses PV et peut intervenir en assistance ; la jauge de duo, remplie par les coups portés et les esquives parfaites, permet une attaque combinée. Les synergies dépendent de qui est dans l\'équipe. Si le personnage actif tombe, le suivant entre en scène ; les K.O. se relèvent entre deux vagues. La fin de mission donne un rang C, B, A ou S.</p>'
    +'<p>C\'est la première étape d\'une refonte en plusieurs phases : trois personnages et une seule mission pour l\'instant. Les personnages sont des pions (couleur et initiale), pas des dessins. Tous les chiffres sont mes choix d\'équilibrage.</p>')
  +sec('Mode Campagne',
    '<p>Depuis l\'écran d\'accueil, <b>Campagne</b> propose trois chapitres en solo : '+CAMPS.map(c=>'<b>'+c.n+'</b> ('+DIFF[c.dk].n.toLowerCase()+')').join(', ')+'. Chaque chapitre a sa carte fixe, un temps maximum et des objectifs.</p>'
    +'<p><b>Objectifs principaux</b> : il faut tous les remplir avant la fin du temps imparti ; le chapitre s\'achève aussitôt, par une victoire. Toute victoire de la partie (dernier camp en mer, projet achevé, domination…) vaut aussi réussite, même sans les objectifs. Temps écoulé ou camp tombé : échec. <b>Étoiles</b> : 1 pour la réussite, +1 par objectif bonus rempli (dont un objectif de rapidité), 3 au maximum. Le chapitre suivant se débloque dès une étoile.</p>'
    +'<p><b>Acquis de départ et héritage</b> : les chapitres II et III démarrent avec des Berrys et des technologies de base, plus 40 ฿ par étoile déjà gagnée dans les chapitres précédents. Les durées sont données au rythme Standard et s\'adaptent au rythme choisi.</p>'
    +'<p>Seuls les noms de chapitres reprennent les sagas de l\'œuvre ; difficulté, seuils, durées et acquis de départ sont mes choix d\'équilibrage. Le mode Campagne est solo uniquement ; votre progression et le journal de campagne sont stockés dans ce navigateur.</p>')
  +sec('Rythme de la partie',
    '<p>Le <b>Rythme</b> (menu de départ) étire toute la partie, un peu comme les vitesses de partie et les longueurs d\'âge de Civilization VII, mais sur un facteur unique : il divise les revenus (Berrys, Savoir, Volonté, Influence), les recrues naturelles et l\'avancée de la jauge d\'âge, et il allonge d\'autant les minuteurs (Buster Call, trêves, ambassades, projets de victoire). Les coûts et la vitesse des armées ne changent pas. Rythme actuel : <b>×'+PK+'</b>, soit une partie entre IA d\'environ '+fmtDur(PACE_MIN()*PK*60)+'. Choix : '+PACES.map(z=>'<b>'+z.n+'</b> ×'+z.k).join(', ')+'.</p>'
    +'<p>Civilization VII compte plus d\'une centaine de tours par âge (les sources divergent : 75 à 125 tours à vitesse standard selon le wiki, 150 à 200 selon le journal de développement de lancement). Ici, en tours simultanés, un tour dure '+TURN_LEN+' s de jeu : au rythme Standard, un âge fait environ '+Math.round(AGES[0].eff*PK/TURN_LEN)+' tours.</p>')
  +sec('Voies d\'Héritage',
    '<p>Quatre voies par âge : '+PATHS.map(P=>'<b>'+P.ic+' '+P.n+'</b> ('+P.m+')').join(', ')+'. Chacune a <b>3 jalons</b> (seuils croissants d\'âge en âge), qui rapportent des Berrys, un peu de progression d\'âge et des <b>points d\'Héritage</b> : 1 point de la voie par jalon, un point d\'Attribut au 2e, un point joker au 3e.</p>'
    +'<p>Les 3 jalons d\'une voie ouvrent une option d\'<b>Âge d\'or</b> pour l\'âge suivant (un seul choix) ; zéro jalon ouvre une option d\'<b>Âge sombre</b> (un bonus payé d\'un malus). Les voies repartent de zéro à chaque âge.</p>')
  +sec('Crise',
    '<p>Aux âges I et II, une crise éclate à '+CRI_AT[0]+' % de la jauge ('+AGES[0].cr+', puis '+AGES[1].cr+'). Trois emplacements de <b>politiques de crise</b> s\'ouvrent à '+CRI_AT.join(' %, ')+' % : chaque camp adopte l\'un de deux inconvénients (délai de 30 s, puis choix au hasard). Quand la jauge est pleine, un événement frappe tous les camps : leurs 3 plus grosses garnisons hors capitale perdent '+Math.round(CRI_EVENT[0].loss*100)+' % (âge I) ou '+Math.round(CRI_EVENT[1].loss*100)+' % (âge II) de leurs troupes ; la Marine y perd moitié moins. La crise donne aussi un point d\'Attribut. Il n\'y en a pas au Nouveau Monde.</p>')
  +sec('Transition d\'âge',
    '<p>Le jeu s\'arrête pour tous. Chaque joueur choisit : <b>1.</b> son <b>camp</b> pour l\'âge suivant (changement de civilisation ; en cas de conflit, le meilleur score l\'emporte ; il n\'y a pas de chaîne de déblocage comme dans Civilization VII) ; <b>2.</b> ses <b>options d\'Héritage</b> : Âge d\'or, Âge sombre, ou options ordinaires payées en points. Les options durent un âge. Un point d\'Attribut est offert. Temps limité à 90 s ; l\'IA décide tout de suite.</p>')
  +sec('Influence, îles indépendantes, soutien de guerre',
    '<p><b>⚜ Influence</b> : une ressource qui s\'accumule (0,22/s, plus le commerce et les Attributs). Elle paie les accords diplomatiques (paix '+DEAL_COST.peace+', commerce '+DEAL_COST.trade+', alliance '+DEAL_COST.alliance+') et les <b>ambassades</b> : une île neutre qui touche vos terres (hors légendes, Fruits et Poneglyphes) peut rejoindre votre camp sans combat, pour 8 + 0,9 par soldat de garnison (une ambassade toutes les '+fmtDur(25*PK)+'). C\'est l\'équivalent des puissances indépendantes de Civilization VII.</p>'
    +'<p><b>Soutien de guerre</b> : 50 au départ. Déclarer la guerre à un camp qui ne vous est pas hostile vous fait perdre 12 points et lui en donne 12 ; une conquête vous en rapporte 3 et lui en retire 3 ; la paix le ramène vers 50. Sous 35, la <b>lassitude de guerre</b> réduit votre attaque et vos Berrys (jusqu\'à −20 % et −10 %). L\'Influence achète du soutien (+12 pour '+WS_COST+' ⚜).</p>')
  +sec('Attributs, Maîtrise, villages',
    '<p><b>Attributs</b> (6 familles, 5 rangs) : le dirigeant progresse toute la partie avec les points gagnés à chaque âge, à la crise et aux 2es jalons. <b>Maîtrise</b> : une technologie découverte peut être approfondie (coût ×1,5) pour +50 % de ses effets.</p>'
    +'<p><b>Villages</b> : un territoire sans ville est un village. Pour '+SPEC_COST+' ฿ il peut se <b>spécialiser</b> (Berrys, Savoir, Volonté ou Recrues), définitivement, mais ne deviendra plus une ville. La capitale est la première ville, comme dans Civilization VII.</p>')
  +sec('Victoires du Nouveau Monde',
    '<p>À l\'âge III, accomplir une voie d\'Héritage (3 jalons) débloque son <b>projet</b> : '+PROJ.map(P=>'<b>'+P.ic+' '+P.n+'</b> (voie '+PATHS[P.pi].n+' ; condition : '+P.reqT+')').join(' ; ')+'. Il coûte des ressources, dure '+fmtDur(PROJ_LEN*PK)+' (−6 % par point d\'Héritage de la voie, jusqu\'à −50 %), et s\'effondre si vous perdez votre capitale. <b>Le premier projet achevé gagne.</b> Si aucun ne l\'est quand l\'âge III arrive à 100 %, le meilleur <b>score</b> l\'emporte. Dernier camp en vie et alliance générale restent des fins possibles ; la domination à 55 % et les 4 Poneglyphes de l\'ancienne version n\'existent plus (les Poneglyphes servent à l\'Expédition à Laugh Tale).</p>')
  +sec('Ce qui n\'est pas repris de Civilization VII',
    '<p>Commandants et armées empilées, sièges par quartier, ressources à assigner, célébrations et bonheur, événements narratifs, légendes et mementos hors partie, tables de diplomatie détaillées, et l\'arbre de technologies qui se réinitialise. Les âges sont aussi bien plus courts que dans Civilization VII.</p>')
  +sec('Tours simultanés',
    '<p>Chaque tour a deux temps. <b>Phase d\'ordres</b> : le temps est arrêté, tout le monde joue en même temps. Achetez, construisez, étudiez, négociez, et ordonnez des mouvements de troupes (glissez d\'un de vos territoires vers un voisin, ou cliquez-le puis cliquez la cible). Un mouvement n\'est qu\'un <i>ordre</i> : il apparaît en flèche pointillée et part à la fin de la phase. Vous pouvez l\'annuler.</p>'
    +'<p>Cliquez <b>Fin de tour</b> quand vous êtes prêt ; la résolution démarre quand tous les joueurs humains le sont (ou quand le minuteur choisi par l\'hôte tombe). <b>Résolution</b> : '+TURN_LEN+' secondes de jeu où armées, combats, revenus et IA avancent ; vous ne pouvez plus donner d\'ordres (sauf répondre aux propositions de traité). Les armées en route continuent au tour suivant.</p>'
    +'<p>Les revenus s\'affichent par tour. Les ordres de plusieurs joueurs partent « en même temps », mais leur ordre d\'exécution tourne d\'un tour à l\'autre pour ne favoriser personne. <b>L\'IA joue pendant la résolution</b>, comme en temps réel : elle ne planifie pas avec vous.</p>')
  +sec('Régions et zoom',
    '<p>La carte est un monde de One Piece simplifié, identique à chaque partie : la <b>Red Line</b> le traverse au milieu, la <b>Grand Line</b> le coupe en deux (Paradise à droite, le Nouveau Monde à gauche), et les quatre Blues occupent les coins (East et North Blue en haut, South et West Blue en bas). Les îles sont reliées par des <b>routes maritimes</b> (pointillés blancs) : on ne peut envoyer des troupes, rallier ou convertir qu\'entre îles reliées. Les pointillés orange sont des traversées de la Calm Belt, la seule liaison directe entre une Blue et la Grand Line, avec Reverse Mountain pour East et North Blue. La carte compte '+regs.length+' régions. <b>Tenir toutes les îles d\'une région</b> donne son bonus tant que vous les gardez. Le bonus indiqué est celui d\'une région de 8 îles ; il est proportionnel à la taille réelle de la région (de ×0,5 à ×1,4), visible dans l\'onglet Armée :</p><ul>'+REGIONS.map(R=>'<li><b>'+R.n+'</b> : '+fxText(R.fx)+'. <i>'+R.w+'</i></li>').join('')+'</ul>'
    +'<p>Chaque camp part de sa capitale : la Marine à New Marineford, les Pirates à Foosha, les Révolutionnaires à Baltigo, les Chasseurs de prime à Whisky Peak. Les grandes lignes (la Red Line, Paradise entre East et South Blue, le Nouveau Monde entre North et West Blue) suivent l\'œuvre ; la place exacte des îles est une interprétation, et plusieurs îles mineures sont placées à titre indicatif. Le numéro de carte ne change que la garnison de départ des îles et l\'emplacement des Fruits du Démon. L\'IA cherche à compléter les régions.</p>'
    +'<p><b>Zoom</b> : molette de la souris, pincement à deux doigts, ou boutons + / − sur la carte ; ⌂ revient à la vue d\'ensemble. Pour déplacer la carte, glissez depuis la mer ou depuis un territoire qui n\'est pas à vous (depuis un de vos territoires, un glissement envoie des troupes).</p>')
  +sec('Lire l\'écran',
    '<p><b>En haut</b> : vos ressources avec leur revenu (par tour ou par seconde), le nombre de territoires et sa progression vers la victoire, vos troupes et vos Poneglyphes. Passez la souris sur une icône pour son nom. <b>Dessous</b> : le tableau des camps, avec territoires, troupes, et votre relation avec chacun.</p>'
    +'<p><b>Sur la carte</b> : en haut à gauche le journal des événements, en bas à gauche la mini-carte (cliquez ou glissez pour déplacer la vue), au centre la fiche du territoire sélectionné, en bas à droite le bouton <b>Fin de tour</b> (touche Entrée). <b>À droite</b> : votre panneau privé, avec six onglets ; ▤ le masque pour agrandir la carte. Sur téléphone il passe sous la carte.</p>')
  +sec('Carte et territoires',
    '<p>Chaque île est un territoire. Les territoires voisins se touchent sur la carte, et on ne peut envoyer des troupes que vers un voisin.</p>'
    +'<ul><li><b>Plage</b> : la plus riche en Berrys, défense ×'+TYPES.plaine.def+'.</li><li><b>Jungle</b> : un peu de Volonté, défense ×'+TYPES.foret.def+'.</li><li><b>Volcan</b> : le plus riche en Savoir, défense ×'+TYPES.montagne.def+'.</li></ul>'
    +'<p>Chaque territoire produit des pirates tout seul (+0,05 par seconde, +0,15 de plus sur la capitale) jusqu\'à une garnison de 30. Votre capitale est plus riche et mieux défendue (×1,25).</p>')
  +sec('Envoyer des troupes et combattre',
    '<ul><li>Glissez d\'un de vos territoires vers un voisin, ou sélectionnez-le puis cliquez sur le voisin. Les boutons 25 / 50 / 75 / 100 % choisissent la part de la garnison envoyée (il en reste toujours au moins une).</li>'
    +'<li>L\'armée voyage, puis combat à l\'arrivée. Elle va à la vitesse de son unité la plus lente.</li>'
    +'<li>On compare la force d\'attaque à la force de défense, chacune avec ±10 % de hasard. Le plus fort gagne ; il garde la fraction de troupes (écart ÷ sa force) qui a survécu. Le perdant, s\'il défendait, voit sa garnison réduite d\'autant.</li>'
    +'<li>Pour attaquer un autre camp, il faut d\'abord lui <b>déclarer la guerre</b> (onglet Diplo). Un territoire neutre s\'attaque librement.</li>'
    +'<li>Défense : terrain × bonus de technologies × fortifications (ville ×1,15, Fortin ×1,35, capitale ×1,25).</li>'
    +'<li><b>Ordres tactiques</b> (onglet Armée ; la branche <b>Mer</b> des technologies les améliore : Log Pose de précision pour le Repli, Ports fortifiés et Flotte pour Fortifier) : la <b>posture</b> choisie au départ, modifiable pendant le trajet — <b>offensive</b> (attaque ×1,15 mais 15 % de survivants en moins après une victoire), <b>prudente</b> (attaque ×0,95, 10 % de survivants en plus, et l’armée rentre sans combattre si son attaque tombe sous 80 % de la défense à l’arrivée), <b>équilibrée</b> (rien de changé). Le <b>Repli</b> fait demi-tour à une armée en mer (10 % de pertes ; elle met autant de temps à revenir qu’elle en avait mis). <b>Fortifier</b> (fiche de l’île, coût selon la garnison) donne ×1,25 en défense pendant 90 s, perdu si l’île est conquise. L’IA utilise les mêmes ordres. Les chiffres sont des choix d’équilibrage.</li>'
    +'<li>Conquérir une ville la réduit d\'un niveau, détruit environ 40 % de ses bâtiments et annule sa construction en cours. Les lieux légendaires sont conservés par le vainqueur.</li></ul>')
  +sec('Les cinq unités et leurs contres',
    '<div class="tw"><table><tr><th>Unité</th><th>Attaque</th><th>Défense</th><th>Vitesse</th><th>Coût</th><th>Technologie</th></tr>'+ur+'</table></div>'
    +'<ul><li><b>Sabreurs</b> gagnent jusqu\'à +80 % de force contre les Mangeurs de Fruit (le Haki de l\'Armement atteint même les Logia).</li><li><b>Mangeurs de Fruit</b> jusqu\'à +60 % contre les Tireurs.</li><li><b>Tireurs</b> jusqu\'à +50 % contre les Sabreurs.</li><li><b>Canons</b> annulent jusqu\'à 75 % du bonus de fortification de la cible.</li></ul>'
    +'<p>Le bonus dépend de la part de l\'unité contrée dans l\'armée adverse : mélangez vos unités. Hors pirates, chaque unité coûte '+UPKEEP+' ฿ par seconde d\'entretien.</p>')
  +sec('Les quatre camps',
    '<p>En solo, choisissez votre camp au menu ; les trois autres sont tenus par l\'IA. En ligne, le siège de chaque joueur détermine son camp (hôte : '+CREWS[0].n+', puis '+CREWS[1].n+', '+CREWS[2].n+', '+CREWS[3].n+').</p><ul>'
    +CREWS.map(c=>'<li><b>'+c.ic+' '+c.n+'</b> : '+c.t+' <i>'+c.w+'</i></li>').join('')+'</ul>')
  +sec('Îles célèbres',
    '<p>Certaines îles de la carte (✦) donnent un bonus à qui les tient. Elles sont toujours présentes, à la place que leur donne la carte fixe.</p><ul>'
    +Object.keys(ISLE_FX).map(n=>'<li><b>'+n+'</b> : '+fxText(ISLE_FX[n].fx)+'. <i>'+ISLE_FX[n].w+'</i></li>').join('')+'</ul>')
  +sec('Ressources',
    '<ul><li><span class="k">Berrys (฿)</span> : recruter, fonder, construire. Départ : 20.</li><li><span class="k">Savoir</span> : acheter des technologies.</li><li><span class="k">Volonté</span> : choisir une Voie, l\'éveiller, rallier des territoires.</li></ul>'
    +'<p>Chaque territoire rapporte selon son type, davantage s\'il porte une ville. Les technologies, bâtiments, lieux légendaires, fruits et la Voie ajoutent des pourcentages. Chaque partenaire commercial donne +10 % de Berrys (maximum +20 %).</p>')
  +sec('Villes, bâtiments et lieux légendaires',
    '<ul><li>Fonder une ville : '+CITY_COST+' ฿ et '+CITY_UNITS+' pirates de la garnison.</li><li>Niveau 2 : '+CITY_UP+' ฿, niveau 3 : '+(CITY_UP*2)+' ฿. Chaque niveau augmente les revenus de la ville de 35 %.</li><li>Emplacements : 2 + niveau (+1 sur la capitale). Une seule construction à la fois.</li></ul>'
    +'<p class="k">Bâtiments</p><ul>'+bl+'</ul><p class="k">Lieux légendaires</p><ul>'+wl+'</ul>')
  +sec('Technologies',
    '<p>'+TECHS.length+' technologies, 3 ères ('+ERAS.join(', ')+') et '+BRANCHES.length+' branches ('+BRANCHES.join(', ')+'). Chacune exige des prérequis et coûte du Savoir. Elles débloquent unités, bâtiments et lieux légendaires, et donnent des bonus permanents. Vos technologies sont privées : les autres joueurs ne les voient pas.</p>')
  +sec('Voie (Haki) et ralliement',
    '<p>Une seule Voie par camp, achetée avec '+FOUND_COST+' Volonté :</p><ul>'+rl+'</ul>'
    +'<p><b>Éveil</b> ('+FERV_COST+' Volonté) double le bonus de la Voie.</p>'
    +'<p><b>Ralliement</b> : convertit un territoire voisin du vôtre sans combat, pour '+CONV_NEUTRAL+' Volonté (neutre) ou '+CONV_ENEMY+' (ennemi en guerre avec vous, garnison de '+CONV_MAX_UNITS+' au plus). Une capitale ne peut pas être ralliée. Le territoire garde la moitié de sa garnison.</p>'
    +'<p>Les Dojos de Haki produisent de la Volonté et exigent d\'avoir choisi une Voie. Haki des Rois : Ralliement 30 % moins cher.</p>')
  +sec('Diplomatie',
    '<ul><li>Tout le monde est en <b>paix</b> au départ : personne ne peut attaquer personne sans déclaration de guerre.</li>'
    +'<li><b>Guerre</b> : impossible pendant une trêve, ni contre un allié (rompez d\'abord l\'alliance). Les alliés de la cible rejoignent la guerre contre vous.</li>'
    +'<li><b>Paix</b> : possible seulement en guerre ; 60 s de trêve ensuite. Les armées en route lors d\'un traité rentrent chez elles.</li>'
    +'<li><b>Alliance</b> : possible seulement en paix. Les alliés ne s\'attaquent pas et gagnent ensemble. Rompre une alliance donne 30 s de trêve.</li>'
    +'<li><b>Commerce</b> : demande la technologie Commerce.</li>'
    +'<li><b>Ultimatum</b> (en paix) : vous exigez '+ULT_BASE+' ฿ (à l\u2019échelle du rythme). S\u2019il cède, l\u2019argent change de mains (son opinion de vous −15, votre réputation −4) ; s\u2019il refuse, <b>la guerre est déclarée</b> (sauf trêve). Un joueur humain a 45 s pour répondre : refuser déclenche la guerre, laisser expirer l\u2019annule. L\u2019IA cède seulement si vous avez au moins 1,6 fois sa force et si elle a l\u2019argent.</li>'
    +'<li><b>Vassalité</b> (en paix ou en guerre) : l\u2019autre camp devient votre vassal, passe en paix avec vous et vous verse '+Math.round(TRIB*100)+' % de ses Berrys bruts. Un camp a au plus un suzerain, et un suzerain ne peut pas être vassal. Elle prend fin si le vassal vous déclare la guerre (rébellion), si vous le libérez, ou si l\u2019un de vous est éliminé. L\u2019IA accepte seulement si elle est écrasée (2,2 fois sa force en guerre, 3 fois en paix) ; une IA vassale se rebelle quand sa force remonte à 90 % de la vôtre. Un vassal ne compte pas comme allié pour la victoire commune ; mais si tous les autres camps encore en vie sont vassaux du même suzerain pendant 30 s de rythme, ce suzerain gagne (le temps d’une rébellion).</li>'
    +'<li>Offrir 25 ฿ améliore l\'opinion de l\'autre camp de 10 points. L\'IA accepte ou refuse les traités selon son opinion de vous et le rapport de force.</li></ul>')
  +sec('Fruits du Démon, Poneglyphes, primes et Marine',
    '<p>À chaque partie, 3 îles tirées au hasard (selon le numéro de carte) portent un Fruit du Démon. Quatre îles fixes portent un Poneglyphe de Route : Zou, Whole Cake et Wano, où l\'œuvre en montre un, et Fish-Man, où le quatrième est supposé (son emplacement réel n\'est pas connu). Ces îles sont mieux gardées au départ. Tant que vous tenez l\'île d\'un fruit, vous gagnez son bonus :</p><ul>'+fl+'</ul>'
    +'<p>Tenir 2 Poneglyphes de Route est une condition du projet « Expédition à Laugh Tale » (âge Nouveau Monde).</p>'
    +'<p><b>Prime</b> : 1 000 000 ฿ par territoire, +1 000 000 par niveau de ville, +1 000 000 pour la capitale, +3 000 000 par fruit ou Poneglyphe tenu.</p>'
    +'<p><b>Marine</b> : à partir d\'environ 2 min 30, si une prime dépasse nettement les autres (au moins ×1,3 la deuxième), le Journal publie l\'avis de recherche, la Marine prévient 15 s à l\'avance, puis lance un Buster Call sur le plus gros territoire non capitale de ce camp : −30 % de troupes. Cela peut se répéter toutes les 110 s.</p>')

/* ================= Multijoueur : un hôte fait tourner la partie, les autres envoient des commandes ================= */
/* Principe : chaque joueur ne reçoit que SA vue (techs, ressources, composition des armées des autres masquées).
   Les messages de la room sont lus par tout le monde : chaque vue est donc chiffrée (ECDH P-256 + AES-GCM)
   avec une clé partagée entre l'hôte et ce joueur seulement. L'hôte, lui, voit tout : il fait tourner la simulation. */
const NET={pace:pacePick,api:null,why:'',room:null,state:'off',host:false,phase:'lobby',seats:[null,null,null,null],keys:[null,null,null,null],
  priv:null,pub:'',myPeer:'',name:'',code:'',diff:'normal',seedIn:'',hp:null,unsub:[],
  last:[0,0,0,0],urgent:[0,0,0,0],busy:[false,false,false,false],seq:[0,0,0,0],
  done:[new Set(),new Set(),new Set(),new Set()],ack:[[],[],[],[]],res:[[],[],[],[]],
  hostKey:null,hostKeyPub:'',cmdN:0,pending:new Map(),pushAt:0,asm:null,lastId:-1,lastView:null,worldOK:false,
  hostGoneAt:0,lobbyKey:'',sp:1,mode:'turn',plan:90,shown:new Set(),endShown:false,seatsKey:''};
const PACE_MIN=()=>AGES.reduce((a,x)=>a+x.eff,0)/60;
const fmtDur=sec=>{sec=Math.round(sec);if(sec<90)return sec+' s';const m=Math.round(sec/60);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'');};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName=(s,fb,mx)=>String(s==null?'':s).replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,mx||14)||fb;
const enc8=new TextEncoder(),dec8=new TextDecoder();
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function genKeys(){
  const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  return {priv:kp.privateKey,pub:b64(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)))};
}
async function deriveKey(priv,pubB64){
  const pk=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);
  return crypto.subtle.deriveKey({name:'ECDH',public:pk},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function pack(key,obj){
  let bytes=enc8.encode(JSON.stringify(obj)),flag=0;
  if(typeof CompressionStream==='function'){
    try{bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());flag=1;}catch(_){}
  }
  const plain=new Uint8Array(bytes.length+1);plain[0]=flag;plain.set(bytes,1);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);
  return b64(out);
}
async function unpack(key,str){
  const all=unb64(str);
  const data=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:all.subarray(0,12)},key,all.subarray(12)));
  let body=data.subarray(1);
  if(data[0]===1)body=new Uint8Array(await new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(dec8.decode(body));
}

/* ---- hôte : envoi des vues et réception des commandes ---- */
async function sendSnap(s){
  const st=NET.seats[s];
  if(!st||st.gone||!NET.keys[s]||NET.busy[s]||!NET.room)return;
  NET.busy[s]=true;
  try{
    const str=await pack(NET.keys[s],buildView(s));
    const id=++NET.seq[s],CH=3000,n=Math.ceil(str.length/CH);
    for(let i=0;i<n;i++)NET.room.emit('snap',{t:st.peer,id,i,n,d:str.slice(i*CH,(i+1)*CH)}).catch(()=>{});
  }catch(_){}
  NET.busy[s]=false;
}
function netTick(){
  if(!NET.host||NET.phase!=='play'||!NET.room)return;
  const now=performance.now(),gap=over?1000:400;
  for(let s=1;s<4;s++){
    const st=NET.seats[s];if(!st||st.gone)continue;
    if(now-NET.last[s]>=gap||(NET.urgent[s]&&now-NET.last[s]>=120)){NET.last[s]=now;NET.urgent[s]=0;sendSnap(s);}
  }
}
async function onCmd(msg){
  if(!NET.host||msg.sameTab||NET.phase!=='play')return;
  const s=NET.seats.findIndex((x,i)=>i>0&&x&&x.peer===msg.peer);
  if(s<1||!NET.keys[s]||!msg.data||typeof msg.data.d!=='string')return;
  let o;
  try{o=await unpack(NET.keys[s],msg.data.d);}catch(_){return;}
  if(!o||!Number.isInteger(o.n)||o.n<1)return;
  const done=NET.done[s];
  if(!done.has(o.n)){
    done.add(o.n);if(done.size>200)done.delete(done.values().next().value);
    let err='Camp éliminé ou remplacé par l\'IA.';
    if(players[s]&&players[s].human&&players[s].alive&&!over)err=exec(s,o.c);
    if(err){NET.res[s].push([o.n,err]);if(NET.res[s].length>10)NET.res[s].shift();}
  }
  NET.ack[s].push(o.n);if(NET.ack[s].length>60)NET.ack[s].shift();
  NET.urgent[s]=1;
}

/* ---- client : réception des vues et envoi des commandes ---- */
async function onSnap(msg){
  if(NET.host||msg.sameTab||!NET.hostKey||!NET.hp||msg.peer!==NET.hp.peer)return;
  const d=msg.data;
  if(!d||d.t!==NET.myPeer||!Number.isInteger(d.id)||d.id<NET.lastId||typeof d.d!=='string'||!Number.isInteger(d.n)||!Number.isInteger(d.i)||d.n<1||d.n>12||d.i<0||d.i>=d.n)return;
  let a=NET.asm;
  if(!a||a.id!==d.id){if(a&&d.id<a.id)return;a={id:d.id,n:d.n,p:[],c:0};NET.asm=a;}
  if(a.p[d.i]===undefined){a.p[d.i]=d.d;a.c++;}
  if(a.c<a.n)return;
  NET.asm=null;
  try{const v=await unpack(NET.hostKey,a.p.join(''));if(a.id<NET.lastId)return;NET.lastId=a.id;applyView(v);}catch(_){}
}
function netSend(c){
  if(!NET.hostKey||!NET.room)return;
  const n=++NET.cmdN;NET.pending.set(n,{c,tries:0,at:0});
  pushCmds();
}
async function pushCmds(){
  if(!NET.room||!NET.hostKey)return;
  const now=performance.now();
  for(const [n,o] of NET.pending){
    if(now-o.at<500)continue;
    if(o.tries>=8){NET.pending.delete(n);continue;}
    o.at=now;o.tries++;
    try{const d=await pack(NET.hostKey,{n,c:o.c});NET.room.emit('cmd',{d}).catch(e=>{if(e&&e.code==='not_permitted'&&!NET.permWarn){NET.permWarn=1;toast('Vos ordres ne partent pas : votre accès à la page est en lecture seule. L’hôte doit vous donner le droit d’interagir (Partager).');}});}catch(_){}
  }
}

   Ajoutée par-dessus le moteur existant (cartes, combats, diplomatie, âges) sans en changer les règles :

const RK={adv:false,notif:'all',unread:0,rec:[],mv:[],lastAtk:{},phKey:'',phase0:'',expl:false,mini:{x:null,y:null,hide:false},lastPh:null,lastLogH:'',logT:0,bellT:0};
const rkLS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(_){}return null;};
RK.adv=rkLS('rk-adv')==='1';

/* ---------- économie : décomposition exacte des Berrys (mêmes formules que income()) ---------- */
function rkEco(p){
  const Z=1/PK,m=p.mod,tb=Math.min(.2,tradePartners(p.id)*.1);
  const L={isl:0,spec:0,city:0,cap:0,bld:0},per=[];
  for(const t of terrs){
    if(t.owner!==p.id)continue;
    const y=TYPES[t.type];let g=y.g,spec=0,city=0,cap=0,bld=0;
    if(t.spec==='g'&&!t.city){const g2=g*1.8+.18;spec=g2-g;g=g2;}
    if(t.city){city+=.25;g+=.25;}
    if(t.capital){cap=.8;g+=.8;}
    if(t.city){const lm=1+.35*(t.city.lvl-1);city+=g*(lm-1);g*=lm;for(const b of t.city.b){const bi=BLD_INCOME[b];if(bi&&bi.g){bld+=bi.g;g+=bi.g;}}}
    L.isl+=y.g;L.spec+=spec;L.city+=city;L.cap+=cap;L.bld+=bld;per.push({t,g});
  }
  const gross=L.isl+L.spec+L.city+L.cap+L.bld,mult=(1+m.gold+tb)*p.inc,bonus=gross*(mult-1);
  let up=0;
  for(const t of terrs)if(t.owner===p.id)for(const k of UK)if(k!=='guerrier')up+=t.u[k]*UPKEEP;
  for(const a of armies)if(a.owner===p.id)for(const k of UK)if(k!=='guerrier')up+=a.u[k]*UPKEEP;
  let g2=gross*mult,tout=0,tin=0;
  if(vas[p.id]>=0&&players[vas[p.id]]&&players[vas[p.id]].alive){tout=g2*TRIB;g2-=tout;}
  for(const q of players)if(q.alive&&q.id!==p.id&&vas[q.id]===p.id)tin+=TRIB*goldGross(q);
  return {isl:L.isl*Z,spec:L.spec*Z,city:L.city*Z,cap:L.cap*Z,bld:L.bld*Z,bonus:bonus*Z,tin:tin*Z,tout:tout*Z,up:up*Z,net:(g2+tin-up)*Z,
    gross:gross*mult*Z,per:per.map(o=>({t:o.t,g:o.g*mult*Z})).sort((a,b)=>b.g-a.g),mult};
}
const ecoRow=(l,v,cls,tip)=>'<div class="er '+(cls||'')+'"'+(tip?' title="'+esc(tip)+'"':'')+'><span>'+l+'</span><b>'+(Math.abs(v*TLEN())<.005?'0':sgn(v*TLEN(),2))+'</b></div>';
function rkBuys(p){
  /* ce qu'on peut acheter bientôt, avec le nombre de tours d'épargne nécessaires */
  const E=rkEco(p),net=E.net*TLEN(),o=[];
  const cap=terrs.find(t=>t.owner===p.id&&t.capital)||terrs.find(t=>t.owner===p.id);
  const eta=c=>p.gold>=c?'maintenant':net>0.01?'dans ≈ '+Math.ceil((c-p.gold)/net)+' '+TUN()+(Math.ceil((c-p.gold)/net)>1&&TM.on?'s':''):'jamais à ce rythme';
  if(cap)o.push(['Lot de Pirates (+'+UNITS.guerrier.batch+' troupes)',recruitCost(p,cap,'guerrier'),'Plus de force pour attaquer ou défendre']);
  const free=terrs.find(t=>t.owner===p.id&&!t.city&&!t.spec&&!t.capital&&t.u.guerrier>=CITY_UNITS+1);
  if(free)o.push(['Fonder une ville à '+free.name,CITY_COST,'Revenu plus élevé, bâtiments, +1 emplacement']);
  for(const t of terrs){
    if(t.owner!==p.id||!t.city)continue;
    const id=['marche','caserne','muraille'].find(i=>buildReason(p,t,i,true)==='');
    if(id){o.push([BUILDINGS[id].n+' à '+t.name,BUILDINGS[id].cost,id==='marche'?'+'+sgn(BLD_INCOME.marche.g*E.mult/PK*TLEN(),2).replace('+','')+' ฿/'+TUN():BUILDINGS[id].d]);break;}
  }
  return o.map(x=>({n:x[0],c:x[1],why:x[2],eta:eta(x[1])}));
}

function rkPreview(b){
  const p=players[ME],el=document.getElementById('bprev');if(!el||!p)return;
  if(!b){RK.prevTxt=el.textContent='';return;}
  const a=b.dataset.act,v=b.dataset.v,t=ui.sel>=0?terrs[ui.sel]:null,E=rkEco(p),Z=TLEN()/PK;let c=0,s='',d=0;
  try{

    else if(a==='tech'){const T=TECH[v];if(T){s='Technologie '+T.n+' : −'+T.cost+' savoir (reste '+Math.floor(p.sci-T.cost)+')';RK.prevTxt=el.textContent=p.sci<T.cost?s+' · savoir insuffisant':s;return;}}
    else if(a==='fort'){const tt=terrs[+v];c=fortCost(tt,p);s='Fortifier';}

    else{RK.prevTxt=el.textContent='';return;}
  }catch(_){RK.prevTxt=el.textContent='';return;}
  const after=p.gold-c,net=E.net*TLEN()+d;
  RK.prevTxt=el.textContent=s+' : −'+c+' ฿ → solde '+Math.floor(after)+' ฿'+(after<0?' (insuffisant)':'')+' · revenu net '+sgn(net,2)+' ฿/'+TUN()+(Math.abs(d)>.005?' ('+sgn(d,2)+')':'');
}

  }).join('');
  const wait=players.filter(p=>p.human&&p.alive&&!TM.ready[p.id]).map(p=>p.id===ME?'vous':cname(p));
  let state,sub,bar='';
  if(res){

function rkMove(a){
  const f=terrs[a.from],t=terrs[a.to],P=players[a.owner];if(!f||!t||!P)return;
  const tgt=t.owner>=0?players[t.owner]:null;
  if(a.owner===ME||(tgt&&tgt.id===a.owner))return;  /* vos ordres et les renforts internes ne sont pas annoncés */
  if(!tgt){
    if(!started)return;
    const n0=Math.floor(sumU(a.u));

    if(RK.mv.length>8)RK.mv.shift();RK.phKey='';return;
  }
  const n=Math.floor(sumU(a.u));

  const col=P.color;
  const txt=CREWS[P.crew||0].ic+' <b>'+esc(cname(P))+'</b> '+(toMe?'<b style="color:var(--bad)">attaque votre île '+esc(t.name)+'</b>':'attaque '+esc(t.name)+(tgt?' ('+esc(cname(tgt))+')':' (neutre)'))+' · '+n+' troupes';
  RK.mv.push({id:a.id,w:performance.now(),txt:txt,col:col,to:t.id,me:toMe});

  RK.phKey='';

}
function launch(pid,from,to,pct,st){

}
/* l'IA joue à chaque tour : décisions prises au début de la résolution, en même temps que les ordres des joueurs */
function rkAiReact(p){
  for(const a of armies){
    if(a.owner===p.id||a.rt)continue;
    const t=terrs[a.to];if(!t||t.owner!==p.id||!isWar(a.owner,p.id))continue;
    const A=attTotal(a.owner,a.u,t,false,a.from),D=defTotal(t,a.u,false);
    if(A<D*.85)continue;
    let best=null;for(const n of t.nb){const o=terrs[n];if(o.owner===p.id&&n!==a.from&&(!best||tr(o)>tr(best)))best=o;}
    if(best&&tr(best)>=6)launch(p.id,best.id,t.id,.6);
  }
}
function rkAiTurn(){
  if(TU.on&&TU.freeze)return;
  for(const p of players){
    if(!p.alive||p.human)continue;
    try{rkAiReact(p);aiThink(p);}catch(_){}
  }
}

function rkBossGold(b,p){
  const base=Math.max(10,Math.round(b.rew.gold*PK/6));
  if(!p)return base;
  return Math.max(base,Math.round(rkEco(p).net*TURN_LEN*10));
}
function rkBossSim(i,A){
  const b=BOSSES[i],st=BS[i];let hp=st.hp,S=A;
  for(let r=0;r<8&&S>0&&hp>0.01;r++){const ph=b.ph[bossPhaseIdx(b,hp)];hp-=Math.min(hp,S/8);if(hp>0.01)S-=b.pw*ph.dm/8+S*ph.bn;}
  return hp<=0.01;
}
function rkBossNeed(i){let lo=5,hi=6000;if(!rkBossSim(i,hi))return Infinity;while(hi-lo>1){const m=(lo+hi)>>1;if(rkBossSim(i,m))hi=m;else lo=m;}return hi;}

/* ---------- conseils : toujours savoir pourquoi on agit ---------- */
function rkAdvice(){
  const p=players[ME];if(!p||!p.x||!p.alive)return [];
  const out=[],mine=terrs.filter(t=>t.owner===ME);
  const E=rkEco(p),net=E.net*TLEN();
  /* 1. attaque en cours contre vous */
  const inc=armies.filter(a=>!a.rt&&a.owner!==ME&&terrs[a.to].owner===ME&&isWar(a.owner,ME));
  if(inc.length){const a=inc[0],t=terrs[a.to];out.push({ic:'⚠',t:'<b>'+esc(cname(players[a.owner]))+'</b> attaque <b>'+esc(t.name)+'</b> ('+Math.floor(sumU(a.u))+' troupes contre '+Math.floor(tr(t))+'). Renforcez-la ou fortifiez-la.',to:t.id,l:'Voir'});}
  /* 2. conquête facile */
  let best=null,bs=0;
  for(const t of mine){
    for(const n of t.nb){
      const x=terrs[n];if(x.owner===ME||bossAlive(x))continue;if(x.owner>=0&&!isWar(ME,x.owner))continue;
      const A=attTotal(ME,scaleU(t.u,.75),x,false,t.id),D=defTotal(x,scaleU(t.u,.75),false);
      const r=A/(D+.5);if(r>=1.4&&r*(x.owner<0?1.2:1)>bs){bs=r*(x.owner<0?1.2:1);best={f:t,x:x,r:r};}
    }
  }
  if(best)out.push({ic:'⚔',t:'<b>'+esc(best.x.name)+'</b> ('+(best.x.owner<0?'neutre':esc(cname(players[best.x.owner])))+', '+Math.floor(tr(best.x))+' défenseurs) est à votre portée depuis <b>'+esc(best.f.name)+'</b> : '+(best.r>=2.2?'victoire très probable':'victoire probable')+' avec 75 % de la garnison.',to:best.x.id,l:'Voir'});
  /* 3. Berrys inutilisés */
  if(p.gold>=45&&!inc.length){const cap=mine.find(t=>t.capital)||mine[0];out.push({ic:'฿',t:'<b>'+Math.floor(p.gold)+' ฿</b> dorment : recrutez, fondez une ville ou construisez (onglet Économie).',to:cap?cap.id:-1,l:'Voir'});}
  /* 4. économie négative */
  if(net<-.05)out.push({ic:'⚠',t:'Économie négative ('+sgn(net,1)+' ฿/'+TUN()+') : l’entretien des unités dépasse vos revenus.',tab:'eco',l:'Détail'});
  /* 5. savoir */
  const tech=TECHS.find(t=>!p.techs[t.id]&&t.era<=AG.n+1&&t.req.every(r=>p.techs[r])&&p.sci>=t.cost);
  if(tech)out.push({ic:'◈',t:'Vous pouvez découvrir <b>'+esc(tech.n)+'</b> ('+tech.cost+' savoir).',tab:'tech',l:'Techno'});
  /* 6. boss atteignable */
  for(const t of terrs){if(!bossAlive(t))continue;const nb=t.nb.some(n=>terrs[n].owner===ME);if(!nb)continue;const need=rkBossNeed(t.boss);let bestA=0;for(const n of t.nb){const o=terrs[n];if(o.owner===ME)bestA=Math.max(bestA,attTotal(ME,o.u,t,true,o.id,undefined,0));}
    if(bestA>=need*1.15){out.push({ic:'☠',t:'Boss <b>'+esc(BOSSES[t.boss].n)+'</b> à portée : récompense +'+rkBossGold(BOSSES[t.boss],p)+' ฿ et trophée permanent (facultatif).',to:t.id,l:'Voir'});break;}}
  /* 7. personnage recrutable */
  if(!out.some(o=>o.ic==='♛')){const c=LEGENDS.findIndex((L,i)=>!hireReason(p,i));if(c>=0)out.push({ic:'♛',t:'<b>'+esc(LEGENDS[c].s)+'</b> peut rejoindre votre état-major ('+recCost(p,c)+' ฿) : '+esc(rkChUse(c)),tab:'leg',l:'Équipe'});}
  if(!out.length){out.push({ic:'➤',t:'Étendez-vous : sélectionnez une île à vous puis une île voisine pour envoyer des troupes.'});}
  return out.slice(0,3);
}

/* ─────────── module : 16-multijoueur-factions.js ─────────── */
/* ================= Multijoueur : choix de la faction dans la salle d'attente =================
   Chaque joueur choisit sa faction (Marine, Pirates, Révolutionnaires, Chasseurs de prime).
   - Le client annonce son souhait dans sa présence ({crew}) ; l'hôte arbitre (premier arrivé, premier servi)
     et publie la répartition finale ({crews}) : c'est elle qui sert à lancer la partie.
   - Les places tenues par l'IA reçoivent les factions restantes.
   Le siège (couleur, ordre de jeu) ne change pas : seule la faction associée au siège est choisie. */
NET.crews=[0,1,2,3];NET.myCrew=crewPick;
const mpValid=c=>Number.isInteger(c)&&c>=0&&c<4;
/* hôte : calcule la répartition à partir des souhaits */
function mpAssignCrews(ps){
  const want=[0,1,2,3].map(s=>{
    const st=NET.seats[s];if(!st)return -1;
    if(s===0)return NET.myCrew;
    const p=ps.find(x=>x.peer===st.peer),c=p&&p.presence?p.presence.crew:-1;
    return mpValid(c)?c:-1;
  });
  const out=[-1,-1,-1,-1],taken=new Set();
  for(let s=0;s<4;s++)if(want[s]>=0&&!taken.has(want[s])){out[s]=want[s];taken.add(want[s]);}
  for(let s=0;s<4;s++)if(out[s]<0){const c=[0,1,2,3].find(x=>!taken.has(x));out[s]=c;taken.add(c);}
  NET.crews=out;
}
function mpCrewsNow(){if(NET.host)return NET.crews;const c=NET.hp&&NET.hp.presence&&NET.hp.presence.crews;return Array.isArray(c)&&c.length===4&&c.every(mpValid)?c:[0,1,2,3];}
function mpMySeat(seats){if(NET.host)return 0;return seats.findIndex(x=>x&&x[0]===NET.myPeer);}
function mpCrewOf(i){return mpCrewsNow()[i];}
function mpPicker(seats){
  const crews=mpCrewsNow(),me=mpMySeat(seats),mine=me>=0?crews[me]:crewPick;
  const takenBy={};seats.forEach((x,s)=>{if(x&&s!==me)takenBy[crews[s]]=cleanName(x[1],'Joueur');});
  const wantLost=me>=0&&crewPick!==mine&&!NET.host;
  return '<h3 style="margin:12px 0 6px">Votre faction</h3><div class="crews mpcrews" role="radiogroup" aria-label="Votre faction">'
    +CREWS.map((c,i)=>{const tk=takenBy[i],on=i===mine;
      return '<button type="button" role="radio" aria-checked="'+on+'" class="crew'+(on?' on':'')+'" data-mpcrew="'+i+'"'+(tk?' disabled':'')+'><b>'+c.ic+' '+c.n+'</b><small>'+(tk?'Prise par '+esc(tk):esc(c.t))+'</small></button>';}).join('')+'</div>'
    +(wantLost?'<p class="note" style="margin:0 0 8px">La faction demandée est déjà prise : l’hôte vous a attribué '+CREWS[mine].n+'.</p>':'');
}

/* ─────────── module : 17-multijoueur-web.js ─────────── */
/* ================= Multijoueur hors claude.ai : salle pair-à-pair (PeerJS / WebRTC) =================
   Utilisé seulement quand la page n'est PAS ouverte dans claude.ai (pas de window.claude), par exemple
   quand le fichier index.html est hébergé sur GitHub Pages. Fournit la même interface que la salle de claude.ai :
   join(nom) → {emit, on, presence, peers, onPeers, connected, onConnection, leave}.
   Topologie en étoile : le premier navigateur qui ouvre une salle prend l'identifiant public « riskop-v1-<nom> »
   et relaie présences et messages ; les suivants s'y connectent. Mise en relation : serveur public gratuit de PeerJS
   (0.peerjs.com), relais TURN de PeerJS si une connexion directe est impossible. Les ordres de jeu restent chiffrés
   de bout en bout par la couche réseau du jeu (ECDH + AES-GCM). */
const PEER_CDN='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';
function rkLoadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src=PEER_CDN;s.onload=()=>window.Peer?res():rej(new Error('peerjs'));s.onerror=()=>rej(new Error('peerjs'));document.head.appendChild(s);});}
async function rkPeerRoom(){
  try{await rkLoadPeer();}catch(_){NET.why='Le module réseau (PeerJS) n’a pas pu être chargé : vérifiez la connexion internet, puis rechargez la page.';return null;}
  return {join:rkPeerJoin};
}
function rkPeerJoin(name){
  const HUB='riskop-v1-'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
  return new Promise((resolve,reject)=>{
    const R={hs:{},ph:[],cc:[],mine:{},peers:new Map(),snap:Object.freeze([]),hub:false,conns:new Map(),toHub:null,me:null,ok:false,done:false};
    let peer=null;
    const fail=code=>{if(!R.ok&&!R.done){R.done=true;try{peer&&peer.destroy();}catch(_){}reject({code,message:'Connexion à la salle impossible ('+code+').'});}};
    const small=p=>{try{return p&&typeof p==='object'&&!Array.isArray(p)&&JSON.stringify(p).length<=8192?p:{};}catch(_){return {};}};
    const entry=(id,p)=>({peer:id,presence:p,updatedAt:Date.now()});
    const snapshot=()=>{R.snap=Object.freeze([...R.peers.values()].map(x=>Object.freeze({peer:x.peer,presence:x.presence||{},updatedAt:x.updatedAt,isMe:x.peer===R.me,sameTab:x.peer===R.me,kind:'viewer',guest:false,by:null})));
      const s=R.snap;setTimeout(()=>R.ph.slice().forEach(f=>{try{f({peers:s});}catch(_){}}),0);};
    const deliver=(topic,data,from)=>{(R.hs[topic]||[]).slice().forEach(f=>{try{f({topic,data,peer:from,isMe:from===R.me,sameTab:from===R.me,kind:'viewer',guest:false,by:null});}catch(_){}});};
    const conn=v=>R.cc.slice().forEach(f=>{try{f(v);}catch(_){}});
    const hubPeers=()=>{const list=[...R.peers.values()];for(const c of R.conns.values())if(c.open)try{c.send({t:'peers',list});}catch(_){}snapshot();};
    const api={name,
      emit:async(topic,data)=>{
        if(R.hub){deliver(topic,data,R.me);for(const c of R.conns.values())if(c.open)try{c.send({t:'ev',topic,data,peer:R.me});}catch(_){}}
        else if(R.toHub&&R.toHub.open){try{R.toHub.send({t:'ev',topic,data});}catch(_){}deliver(topic,data,R.me);}
      },
      on:(topic,f)=>{(R.hs[topic]=R.hs[topic]||[]).push(f);return ()=>{R.hs[topic]=(R.hs[topic]||[]).filter(x=>x!==f);};},
      presence:async patch=>{
        for(const k in patch){if(patch[k]===null)delete R.mine[k];else R.mine[k]=patch[k];}R.mine={...R.mine};
        if(R.me)R.peers.set(R.me,entry(R.me,R.mine));
        if(R.hub)hubPeers();else{snapshot();if(R.toHub&&R.toHub.open)try{R.toHub.send({t:'pres',p:R.mine});}catch(_){}}
      },
      peers:()=>R.snap,
      onPeers:f=>{R.ph.push(f);setTimeout(()=>f({peers:R.snap}),0);return ()=>{R.ph=R.ph.filter(x=>x!==f);};},
      connected:()=>R.hub||!!(R.toHub&&R.toHub.open),
      onConnection:f=>{R.cc.push(f);return ()=>{R.cc=R.cc.filter(x=>x!==f);};},
      leave:async()=>{R.done=true;R.hs={};R.ph=[];try{peer&&peer.destroy();}catch(_){}}
    };
    /* 1) tenter d'ouvrir la salle (devenir le relais) */
    try{peer=new Peer(HUB,{debug:0});}catch(_){fail('upstream_error');return;}
    peer.on('open',id=>{if(R.done)return;R.hub=true;R.me=id;R.ok=true;R.peers.set(id,entry(id,R.mine));snapshot();conn(true);resolve(api);});
    peer.on('connection',c=>{
      c.on('open',()=>{R.conns.set(c.peer,c);try{c.send({t:'peers',list:[...R.peers.values()]});}catch(_){}});
      c.on('data',m=>{if(!m||typeof m!=='object')return;const pid=c.peer;
        if(m.t==='pres'){R.peers.set(pid,entry(pid,small(m.p)));hubPeers();}
        else if(m.t==='ev'&&typeof m.topic==='string'&&m.topic.length<48){deliver(m.topic,m.data,pid);for(const [k,o] of R.conns)if(o.open&&k!==pid)try{o.send({t:'ev',topic:m.topic,data:m.data,peer:pid});}catch(_){}}});
      const gone=()=>{if(R.conns.get(c.peer)===c){R.conns.delete(c.peer);R.peers.delete(c.peer);hubPeers();}};
      c.on('close',gone);c.on('error',gone);
    });
    peer.on('error',err=>{
      if(R.ok||R.done)return;
      if(err&&err.type==='unavailable-id'){
        /* 2) la salle existe déjà : s'y connecter */
        try{peer.destroy();}catch(_){}
        try{peer=new Peer({debug:0});}catch(_){fail('upstream_error');return;}
        peer.on('open',id=>{if(R.done)return;R.me=id;
          const c=peer.connect(HUB,{reliable:true});R.toHub=c;
          c.on('open',()=>{if(R.done)return;R.ok=true;R.peers.set(id,entry(id,R.mine));try{c.send({t:'pres',p:R.mine});}catch(_){}snapshot();conn(true);resolve(api);});
          c.on('data',m=>{if(!m||typeof m!=='object')return;
            if(m.t==='peers'&&Array.isArray(m.list)){R.peers=new Map(m.list.filter(x=>x&&typeof x.peer==='string').map(x=>[x.peer,entry(x.peer,small(x.presence))]));if(!R.peers.has(R.me))R.peers.set(R.me,entry(R.me,R.mine));snapshot();}
            else if(m.t==='ev'&&typeof m.topic==='string')deliver(m.topic,m.data,typeof m.peer==='string'?m.peer:HUB);});
          c.on('close',()=>{R.peers=new Map([[R.me,entry(R.me,R.mine)]]);snapshot();conn(false);});
        });
        peer.on('error',e=>{if(!R.ok)fail(e&&e.type==='peer-unavailable'?'not_found':'upstream_error');});
      }else fail('upstream_error');
    });
    setTimeout(()=>fail('upstream_error'),20000);
    /* fermeture de l'onglet : on prévient tout de suite les autres (sinon WebRTC peut mettre plusieurs secondes à s'en apercevoir) */
    addEventListener('pagehide',()=>{try{peer&&peer.destroy();}catch(_){}});
  });
}

/* ─────────── module : 18-progression.js ─────────── */
/* RISK OP — progression permanente et commandants proposés par difficulté.
   Deux systèmes distincts :
   · la COLLECTION (permanente, ce navigateur) : les commandants débloqués au fil des parties ;
   · les commandants PROPOSÉS dans une partie : tirés au lancement, pour chaque camp, selon la difficulté
     (Facile 4, Normal 8, Difficile 16, Expert tous ceux du camp ; jamais plus que le camp n'en compte).
   Stockage : clé 'rk-prog', séparée du carnet 'gl-profile' (jamais réécrit ici). Les fiches LEGENDS / CHMETA ne sont pas modifiées.
   Une partie sauvegardée avant cette version (sans liste) garde tous les commandants de chaque camp. */

/* ---------- réglages ---------- */
const PG_N={easy:4,normal:8,hard:16,expert:99};
const PG_MUL={easy:.6,normal:1,hard:1.25,expert:1.5};
const PG_MAXR=30;
/* XP pour passer du rang r au rang r+1. Seule constante de rythme : environ 25 parties en Normal pour le rang 30. */
const pgCost=r=>100+6*(r-1);
const pgCum=r=>{let s=0;for(let k=1;k<r;k++)s+=pgCost(k);return s;};
const pgRank=xp=>{let r=1;while(r<PG_MAXR&&xp>=pgCum(r+1))r++;return r;};
const PG_TITLES=[[1,'Mousse'],[5,'Matelot'],[10,'Second'],[15,'Capitaine'],[20,'Grand capitaine'],[25,'Légende des mers'],[30,'Roi des mers']];
const pgTitle=r=>PG_TITLES.filter(t=>t[0]<=r).pop()[1];
const pgTitleRank=r=>r%5===0;              /* rangs 5, 10… 30 : nouveau titre + une relance du tirage */
/* équipage de départ : par camp, les 4 commandants aux conditions les plus simples (au moins 2 sans âge requis) */
const PG_START={pirate:['Nami','Zoro','Ace','Bartolomeo'],marine:['Smoker','Garp','Killingham','Sommers'],revo:['Ace','Ivankov','Koala','Rayleigh'],chasseur:['Zoro','Smoker','Rayleigh','Law']};
/* XP d'une partie : points d'actions (plafond 150 au total), + victoire, × difficulté */
const PG_ACT=[
  {k:'isl',n:'Îles conquises (différentes)',p:4,max:15},
  {k:'bw',n:'Batailles gagnées',p:2,max:10},
  {k:'bd',n:'Constructions achevées',p:4,max:6},
  {k:'tech',n:'Technologies',p:2,max:10},
  {k:'age',n:'Âges franchis',p:15,max:2},
  {k:'bk',n:'Boss vaincus',p:5,max:3},
  {k:'lt',n:'Commandants recrutés',p:3,max:3}
];
const PG_ACT_CAP=150,PG_WIN=150,PG_SHORT=15,PG_SHORT_CAP=20,PG_NET=40,PG_NET_WIN=60;
let PG=null;

/* ---------- état et stockage ---------- */
const pgLegIdx=s=>LEGENDS.findIndex(L=>L.s===s);
const pgValid=s=>typeof s==='string'&&pgLegIdx(s)>=0;
const pgIsL=i=>chMeta(i).r==='L';
function pgBlank(){return {v:1,xp:0,col:{},claimed:{},offers:{},fresh:[],recent:{},gids:[],w:{easy:0,normal:0,hard:0,expert:0},age:0,camps:{},rr:0,mig:0,seen:0,last:null};}
function pgSave(){try{localStorage.setItem('rk-prog',JSON.stringify(PG));}catch(_){}}
function pgLoad(){
  let o=null;try{o=JSON.parse(localStorage.getItem('rk-prog')||'null');}catch(_){o=null;}
  PG=pgBlank();
  if(!o||o.v!==1){pgMigrate();return;}
  PG.xp=Math.max(0,Math.min(1e7,+o.xp||0));
  if(o.col&&typeof o.col==='object')for(const k of Object.keys(o.col))if(pgValid(k))PG.col[k]=1;
  if(o.claimed&&typeof o.claimed==='object')for(const k of Object.keys(o.claimed))if(+k>=2&&+k<=PG_MAXR)PG.claimed[+k]=1;
  if(o.offers&&typeof o.offers==='object')for(const k of Object.keys(o.offers))if(Array.isArray(o.offers[k]))PG.offers[+k]=o.offers[k].filter(pgValid).slice(0,3);
  if(Array.isArray(o.fresh))PG.fresh=o.fresh.filter(pgValid).slice(-10);
  if(o.recent&&typeof o.recent==='object')for(const c of CREWS)if(Array.isArray(o.recent[c.id]))PG.recent[c.id]=o.recent[c.id].filter(pgValid).slice(0,40);
  if(Array.isArray(o.gids))PG.gids=o.gids.filter(g=>typeof g==='string').slice(-60);
  if(o.w)for(const k of Object.keys(PG.w))PG.w[k]=Math.max(0,o.w[k]|0);
  PG.age=Math.max(0,Math.min(2,o.age|0));
  if(o.camps)for(const c of CREWS)PG.camps[c.id]=Math.max(0,o.camps[c.id]|0);
  PG.rr=Math.max(0,Math.min(99,o.rr|0));PG.mig=o.mig|0;PG.seen=Math.max(0,o.seen|0);
  PG.last=o.last&&typeof o.last==='object'?o.last:null;
  for(const c of Object.keys(PG_START))for(const s of PG_START[c])PG.col[s]=1;
}
/* premier lancement de cette version : on part du carnet existant (rien n'est perdu) */
function pgMigrate(){
  for(const c of Object.keys(PG_START))for(const s of PG_START[c])PG.col[s]=1;
  let n=0;
  for(const k of Object.keys(PROFILE.rec||{}))if(pgValid(k)&&(PROFILE.rec[k]|0)>0){PG.col[k]=1;n++;}
  const g=PROFILE.games|0,w=PROFILE.wins|0;
  PG.xp=Math.min(pgCum(10),g*80+w*120);
  PG.mig=1;PG.migInfo={games:g,wins:w,rec:n};
  pgSave();
}
pgLoad();

/* ---------- récompenses ---------- */
const PG_LEG={
  'Barbe Noire':{r:6,t:'Prendre 1 capitale ennemie (au total de vos parties)',v:()=>PROFILE.tot.cp|0,n:1},
  'Akainu':{r:8,t:'Gagner 1 partie en Normal, Difficile ou Expert',v:()=>(PG.w.normal|0)+(PG.w.hard|0)+(PG.w.expert|0),n:1},
  'Shanks':{r:10,t:'Vaincre 3 boss (au total)',v:()=>PROFILE.tot.bk|0,n:3},
  'Barbe Blanche':{r:12,t:'Gagner 40 batailles (au total)',v:()=>PROFILE.tot.bw|0,n:40},
  'Big Mom':{r:14,t:'Atteindre l’âge III dans une partie',v:()=>PG.age>=2?1:0,n:1},
  'Kaido':{r:16,t:'Gagner 1 partie en Difficile ou Expert',v:()=>(PG.w.hard|0)+(PG.w.expert|0),n:1},
  'Luffy':{r:18,t:'Gagner 5 parties (au total)',v:()=>PROFILE.wins|0,n:5},
  'Loki':{r:20,t:'Déchiffrer 3 Poneglyphes (au total)',v:()=>PROFILE.tot.pz|0,n:3},
  'Roger':{r:24,t:'Gagner 1 partie en Expert',v:()=>PG.w.expert|0,n:1}
};
const pgRankNow=()=>pgRank(PG.xp);
function pgLegState(s){
  const d=PG_LEG[s];if(!d)return null;
  const have=!!PG.col[s],rk=pgRankNow()>=d.r,v=Math.min(d.n,d.v()),ok=rk&&v>=d.n;
  return {s,d,have,rk,v,ok,ready:ok&&!have};
}
/* rangs dont la récompense n'a pas encore été prise */
function pgPendingRanks(){const r=pgRankNow(),o=[];for(let k=2;k<=r;k++)if(!PG.claimed[k])o.push(k);return o;}
function pgPendingCount(){return pgPendingRanks().length+Object.keys(PG_LEG).filter(s=>pgLegState(s).ready).length;}
/* trois commandants au choix : rares, épiques, communs non encore débloqués, de préférence des camps que vous jouez */
function pgOffer(r){
  const cur=(PG.offers[r]||[]).filter(s=>!PG.col[s]);
  if(cur.length)return cur;
  const pool=LEGENDS.map((L,i)=>i).filter(i=>!pgIsL(i)&&!PG.col[LEGENDS[i].s]);
  if(!pool.length){PG.offers[r]=[];return [];}
  const w=i=>1+LEGENDS[i].camps.reduce((a,c)=>a+Math.min(5,PG.camps[c]|0),0);
  const out=[],left=pool.slice();
  while(out.length<3&&left.length){let tot=0;for(const i of left)tot+=w(i);let x=Math.random()*tot,k=0;for(;k<left.length-1;k++){x-=w(left[k]);if(x<=0)break;}out.push(LEGENDS[left[k]].s);left.splice(k,1);}
  PG.offers[r]=out;pgSave();return out;
}
function pgAdd(s){if(!PG.col[s]){PG.col[s]=1;PG.fresh.push(s);PG.fresh=PG.fresh.slice(-10);}}
function pgClaim(r,s){
  r=r|0;if(!pgPendingRanks().includes(r))return 'Cette récompense n’est pas disponible.';
  if(pgTitleRank(r)){PG.claimed[r]=1;PG.rr++;pgSave();return '';}
  const off=pgOffer(r);
  if(!off.length){PG.claimed[r]=1;PG.rr++;pgSave();return '';}   /* collection complète : la récompense devient une relance */
  if(!off.includes(s))return 'Choisissez un des commandants proposés.';
  pgAdd(s);PG.claimed[r]=1;delete PG.offers[r];pgSave();return '';
}
function pgClaimLeg(s){const st=pgLegState(s);if(!st||!st.ready)return 'Objectif non atteint.';pgAdd(s);pgSave();return '';}
/* découverte : recruter en solo un commandant qui n'est pas dans la collection l'y ajoute */
function pgDiscover(k){
  if(MODE!=='solo'||!PG||PG.col[k])return;
  pgAdd(k);pgSave();
  try{toast('Nouveau commandant dans votre collection : '+k+'.');}catch(_){}
}

/* ---------- commandants proposés dans une partie ---------- */
function pgRng(s){let a=s|0;return ()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function pgDraw(arr,wf,k,rnd){
  const left=arr.slice(),out=[];
  while(out.length<k&&left.length){let tot=0;for(const i of left)tot+=wf(i);let x=rnd()*tot,j=0;for(;j<left.length-1;j++){x-=wf(left[j]);if(x<=0)break;}out.push(left[j]);left.splice(j,1);}
  return out;
}
const pgNoAge=i=>!LEGENDS[i].rec.age;
/* useCol : le camp du joueur humain en solo puise dans sa collection ; en ligne, la liste ne dépend que de la graine
   (identique chez l'hôte et chez chaque joueur, sans message réseau). */
function pgRoster(sd,dk,crews,humans,useCol){
  const N=PG_N[dk]||8,rnd=pgRng((sd|0)*7919+(Object.keys(PG_N).indexOf(dk)+1)*104729);
  const ro={},disc=[],taken=new Set();
  const seats=[0,1,2,3].filter(s=>crews[s]!==undefined).sort((a,b)=>(humans[b]?1:0)-(humans[a]?1:0)||a-b);
  for(const seat of seats){
    const cid=CREWS[crews[seat]].id;if(ro[cid])continue;
    const pool=LEGENDS.map((L,i)=>i).filter(i=>LEGENDS[i].camps.includes(cid));
    if(N>=pool.length){
      /* camp entier (Expert, ou camp plus petit que le nombre prévu) : ce qui manque à la collection est « À découvrir » */
      ro[cid]=pool.map(i=>LEGENDS[i].s);
      if(useCol&&humans[seat])for(const s of ro[cid])if(!PG.col[s])disc.push(s);
      continue;
    }
    /* Facile : pas de commandant en double entre camps quand le camp en a assez (le camp du joueur est servi en premier) */
    let cand=dk==='easy'?pool.filter(i=>!taken.has(i)):pool.slice();
    if(cand.length<N)cand=pool.slice();
    const pick=[];const col=useCol&&humans[seat];
    if(col){
      const own=cand.filter(i=>PG.col[LEGENDS[i].s]),fr=own.filter(i=>PG.fresh.includes(LEGENDS[i].s));
      for(const i of pgDraw(fr,()=>1,Math.ceil(N/2),rnd))pick.push(i);
      const rec=PG.recent[cid]||[];
      for(const i of pgDraw(own.filter(i=>!pick.includes(i)),i=>rec.includes(LEGENDS[i].s)?.35:1,N-pick.length,rnd))pick.push(i);
      if(pick.length<N)for(const i of pgDraw(cand.filter(i=>!pick.includes(i)&&!pgIsL(i)),()=>1,N-pick.length,rnd)){pick.push(i);disc.push(LEGENDS[i].s);}
    }else for(const i of pgDraw(cand,()=>1,N,rnd))pick.push(i);
    if(dk==='easy'){
      /* au moins 2 commandants sans âge requis : on remplace le dernier tiré qui en demande un */
      let guard=0;
      while(pick.filter(pgNoAge).length<2&&guard++<4){
        const opts=pool.filter(i=>pgNoAge(i)&&!pick.includes(i)&&!pgIsL(i));
        const add=(col?opts.find(i=>PG.col[LEGENDS[i].s]):undefined)??opts[0];
        const out=pick.slice().reverse().find(i=>!pgNoAge(i));
        if(add===undefined||out===undefined)break;
        pick[pick.indexOf(out)]=add;
        const di=disc.indexOf(LEGENDS[out].s);if(di>=0)disc.splice(di,1);
        if(col&&!PG.col[LEGENDS[add].s])disc.push(LEGENDS[add].s);
      }
    }
    for(const i of pick)taken.add(i);
    ro[cid]=pick.map(i=>LEGENDS[i].s);
  }
  return {ro,disc};
}
/* liste en vigueur (null = partie d'avant cette version : tous les commandants du camp) */
function pgRosterNow(){
  if(MODE==='client'&&players.length){
    const key=seed+'|'+diffKey+'|'+players.map(p=>p.crew).join(',')+'|'+players.map(p=>p.human?1:0).join('');
    if(RK.roKey!==key){RK.roKey=key;const r=pgRoster(seed,diffKey,players.map(p=>p.crew),players.map(p=>!!p.human),false);RK.roster=r.ro;RK.disc=[];}
  }
  return RK.roster||null;
}
const pgOffered=(cid,s)=>{const ro=pgRosterNow();return !ro||!ro[cid]||ro[cid].includes(s);};
const pgIsDisc=s=>MODE==='solo'&&Array.isArray(RK.disc)&&RK.disc.includes(s)&&!PG.col[s];

/* appelé après chaque newGame (solo, hôte, campagne, tutoriel) */
function pgNewGame(sd){
  if(MODE==='client')return;
  const r=pgRoster(sd,diffKey,players.map(p=>p.crew),players.map(p=>!!p.human),MODE==='solo');
  RK.roster=r.ro;RK.disc=r.disc;RK.roKey='';
  RK.coal=-1;
  RK.gid=(sd|0)+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
  RK.pgOver=null;
}
function newGame(sd,dk,o){newGame_o(sd,dk,o);try{pgNewGame(sd);}catch(_){RK.roster=null;RK.disc=[];}}
/* îles conquises comptées une seule fois (reprendre la même île ne rapporte pas d'XP) */
function rkCqT(o,t){const p=players[o];if(!p||!p.x||!t)return;const a=p.x.cqi||(p.x.cqi=[]);if(!a.includes(t.id))a.push(t.id);}

/* ---------- fin de partie : XP ---------- */
function pgActions(){
  const p=players[ME],st=(p&&p.x&&p.x.st)||{};
  const v={isl:Array.isArray(p&&p.x&&p.x.cqi)?p.x.cqi.length:Math.min(15,st.cq|0),bw:st.bw|0,bd:st.bd|0,tech:p?Object.keys(p.techs||{}).length:0,age:AG.n|0,bk:st.bk|0,lt:st.lt|0};
  const rows=PG_ACT.map(a=>({n:a.n,v:v[a.k],pts:Math.min(a.max,v[a.k])*a.p,max:a.max*a.p}));
  return {rows,sum:Math.min(PG_ACT_CAP,rows.reduce((s,r)=>s+r.pts,0))};
}
function pgEnd(win){
  if(!PG||!over||RK.pgOver===over)return;RK.pgOver=over;
  if(MODE==='client'&&!RK.gid)RK.gid='net-'+seed+'-'+(NET.code||'');
  const gid=RK.gid||'';
  if(gid&&PG.gids.includes(gid)){PG.last={dup:1};pgSave();return;}
  const dk=PG_MUL[diffKey]?diffKey:'normal',m=PG_MUL[dk];
  let act=0,rows=[],short=false;
  if(MODE==='solo'){
    const A=pgActions();rows=A.rows;act=A.sum;
    short=(TM.on?TM.n:time/TURN_LEN)<PG_SHORT;
    if(short&&!win)act=Math.min(act,PG_SHORT_CAP);
  }else{act=PG_NET;rows=[{n:'Partie en ligne terminée',v:1,pts:PG_NET,max:PG_NET}];}
  const wb=win?(MODE==='solo'?PG_WIN:PG_NET_WIN):0;
  const xp=Math.round((act+wb)*m),r0=pgRankNow();
  PG.xp+=xp;
  if(win)PG.w[dk]=(PG.w[dk]|0)+1;
  PG.age=Math.max(PG.age,AG.n|0);
  const me=players[ME];const cid=me?CREWS[me.crew||0].id:'';
  if(cid)PG.camps[cid]=(PG.camps[cid]|0)+1;
  if(MODE==='solo'&&RK.roster&&cid&&RK.roster[cid]){
    PG.recent[cid]=RK.roster[cid].slice();
    PG.fresh=PG.fresh.filter(s=>!RK.roster[cid].includes(s));
  }
  if(gid){PG.gids.push(gid);PG.gids=PG.gids.slice(-60);}
  PG.last={xp,act,wb,m,dk,rows,short,win:!!win,r0,r1:pgRankNow()};
  pgSave();
}

/* ---------- relance du tirage (récompense des rangs 5, 10…) ---------- */
function pgReroll(){
  if(MODE!=='solo')return 'La relance n’existe qu’en solo (en ligne, la liste est commune).';
  if(PG.rr<1)return 'Aucune relance disponible (rangs 5, 10, 15…).';
  if((TM.on?TM.n>1:time>60)||chOwnedBy(ME).length)return 'La relance se fait au début de la partie, avant tout recrutement.';
  const cid=CREWS[players[ME].crew||0].id,all=LEGENDS.filter(L=>L.camps.includes(cid)).length;
  if(!RK.roster||!RK.roster[cid]||RK.roster[cid].length>=all)return 'Tous les commandants de votre camp sont déjà proposés.';
  const r=pgRoster((Math.random()*1e9)|0,diffKey,players.map(p=>p.crew),players.map(p=>!!p.human),true);
  RK.roster[cid]=r.ro[cid];RK.disc=r.disc;PG.rr--;pgSave();return '';

/* ---------- difficultés : règles stratégiques (pas seulement des chiffres) ---------- */
/* Coalition : quand un camp (humain OU IA) mène largement, les IA s'unissent contre lui.
   Difficile : à partir de l'âge II, seuil 1,5× le score du deuxième. Expert : dès l'âge I, seuil 1,3×.
   Dissoute quand l'écart retombe sous 1,2×. Toutes les conditions de victoire restent valables. */
const COAL={hard:{age:1,on:1.5},expert:{age:0,on:1.3}},COAL_OFF=1.2,COAL_MIN=30,EASY_PEACE=240;
function rkCoalTick(){
  const c=COAL[diffKey];
  if(!c||MODE==='client'){RK.coal=-1;return;}
  if(!(RK.coal>=-1))RK.coal=-1;
  const alive=players.filter(p=>p.alive);
  if(alive.length<3||AG.n<c.age){if(RK.coal>=0)rkCoalEnd('');return;}
  if(RK.coal>=0){
    const L=players[RK.coal];
    const best=Math.max(1,...alive.filter(p=>p.id!==RK.coal).map(scoreOf));
    if(!L||!L.alive||scoreOf(L)<COAL_OFF*best)rkCoalEnd(L&&L.alive?' : son avance s’est réduite':'');
    return;
  }
  const sc=alive.map(p=>({id:p.id,s:scoreOf(p)})).sort((a,b)=>b.s-a.s);
  if(sc[0].s>=COAL_MIN&&sc[0].s>c.on*Math.max(1,sc[1].s)){
    RK.coal=sc[0].id;const L=players[RK.coal];
    addLog('⚔ Coalition : les autres camps s’unissent contre '+L.name+', qui mène largement (alliance contre le meneur).','#f2c75c');
    if(L.id===ME&&MODE!=='client')try{toast('Coalition : vous menez trop largement, les IA s’allient contre vous. Elle se dissout si votre avance retombe sous 1,2× le deuxième.');}catch(_){}
  }
}
function rkCoalEnd(why){const L=players[RK.coal];RK.coal=-1;if(L)addLog('Coalition contre '+L.name+' dissoute'+why+'.','#9aa3ad');}
const rkCoalMember=id=>RK.coal>=0&&id!==RK.coal&&players[id]&&players[id].alive&&vas[id]!==RK.coal;
const rkCoalPair=(a,b)=>rkCoalMember(a)&&rkCoalMember(b);
/* une IA coalisée refuse la paix avec le meneur, sauf si elle est au bord de la ruine */
const rkCoalNoPeace=(q,p)=>RK.coal===p&&rkCoalMember(q)&&strength(q)>=.35*strength(p);
function rkCoalDiplo(p){
  rkCoalTick();
  if(!rkCoalMember(p.id))return;
  const L=RK.coal;
  const tot=players.filter(q=>rkCoalMember(q.id)).reduce((a,q)=>a+strength(q.id),0);
  if(rel[p.id][L]==='peace'&&time>=truce[p.id][L]&&terrs.some(t=>t.owner===p.id&&t.nb.some(n=>terrs[n].owner===L))&&tot>.6*strength(L)&&Math.random()<.35)declareWar(p.id,L);   /* plusieurs fronts à la fois : 60 % de la force du meneur suffit */
  for(const q of players){
    if(q.id===p.id||!rkCoalPair(p.id,q.id))continue;
    if(rel[p.id][q.id]==='war'&&Math.random()<.25)propose(p.id,q.id,'peace');
    else if(rel[p.id][q.id]==='peace'&&isWar(p.id,L)&&Math.random()<.2)propose(p.id,q.id,'alliance');
  }
}
/* Expert : les IA coalisées concentrent leurs attaques sur le meneur */
const rkCoalFocus=(p,x)=>diffKey==='expert'&&RK.coal>=0&&x.owner===RK.coal&&p.id!==RK.coal&&!p.human;
/* Facile : aucune IA ne déclare la guerre à un joueur HUMAIN avant EASY_PEACE (entre IA : comme en Normal) */
const rkPeaceT=q=>(diffKey==='easy'&&players[q]&&players[q].human?EASY_PEACE:170)*PK;

/* fiche des règles de la difficulté : affichée avant le lancement et dans « Règles » */
function pgRulesText(dk,pk){
  pk=pk>0?pk:PK;
  const D=DIFF[dk]||DIFF.normal,n=PG_N[dk]||8,pct=v=>(v>=1?'+':'')+Math.round((v-1)*100)+' %';
  const peace=(dk==='easy'?EASY_PEACE:170)*pk,turns=Math.round(peace/TURN_LEN);
  const o=[];
  o.push(n>=99?'Commandants : <b>tous ceux de votre camp</b>, même ceux pas encore débloqués (les recruter les ajoute à votre collection).':'Commandants proposés : <b>'+n+'</b> par camp (ou tous si le camp en compte moins), tirés dans votre collection.');
  o.push('IA : revenus '+pct(D.inc)+', agressivité '+pct(D.aggr)+'.');
  o.push((dk==='easy'?'Aucune IA ne vous déclare la guerre':'Les IA ne déclarent aucune guerre')+' avant ≈ '+turns+' tours ('+fmtDur(peace)+' de jeu)'+(dk==='easy'?' ; en Normal, ≈ '+Math.round(170*pk/TURN_LEN)+' tours':'')+'.');
  if(COAL[dk])o.push('<b>Coalition</b> : '+(dk==='expert'?'dès l’âge I':'à partir de l’âge II')+', si un camp (vous ou une IA) a un score supérieur à '+String(COAL[dk].on).replace('.',',')+'× celui du deuxième, les IA s’allient contre lui et refusent la paix avec lui. Elle se dissout quand l’écart retombe sous 1,2×.'+(dk==='expert'?' Les IA coalisées concentrent leurs attaques sur le meneur.':''));
  o.push('Toutes les conditions de victoire restent valables. Expérience ×'+String(PG_MUL[dk]||1).replace('.',',')+'.');
  return '<ul class="pgl">'+o.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
}
function pgRulesBox(id,dk,pk){return '<div class="pgdr" id="'+id+'"><b>Règles : '+esc((DIFF[dk]||DIFF.normal).n)+'</b>'+pgRulesText(dk,pk)+'</div>';}

/* ─────────── module : 20-rendu25d-biomes.js ─────────── */
/* ================= Rendu 2.5D des îles : biomes (couleurs du sol, relief, lagon) =================
   Données de RENDU seulement. Chaque biome donne : relief (plateau, collines, dunes), part de falaises,
   couleurs (sol, falaise, lagon) et une fonction de couleur du sol. Aucune donnée de jeu n'est lue ici. */

async function ilImportZip(file){
  let ent;try{ent=zipRead(await file.arrayBuffer());}catch(e){return {ok:false,t:e.message==='compressée'||e.message==='format'?'Cette archive n’a pas été créée par l’export de RISK OP (fichiers compressés) : réimport impossible.':'Archive illisible ou corrompue.'};}
  let col;try{col=JSON.parse(new TextDecoder().decode(ent['collection.json']));}catch(_){return {ok:false,t:'Archive sans fichier collection.json : ce n’est pas une collection RISK OP.'};}
  if(!col||col.format!=='risk-op-illustrations'||!Array.isArray(col.items))return {ok:false,t:'Ce n’est pas une collection d’illustrations RISK OP.'};
  let n=0,skip=0;
  for(const it of col.items){
    const data=ent[it.file];if(!data||!ilLeg(it.id)){skip++;continue;}
    const blob=new Blob([data],{type:it.type||'application/octet-stream'}),d=await ilDims(blob);if(!d){skip++;continue;}
    const rec={id:it.id,blob,name:it.name||'image',type:it.type,size:data.length,w:d.w,h:d.h,fx:+it.fx||.5,fy:+it.fy||.25,z:+it.z||1,date:it.date||Date.now()};
    try{await ilReq('readwrite',st=>st.put(rec));ilSetMem(rec);n++;}catch(_){skip++;}
  }
  ilPersist();ilEstimate();lastPanel='';
  return {ok:n>0,t:n+' illustration(s) réimportée(s)'+(skip?', '+skip+' ignorée(s) (héros inconnu ou image illisible)':'')+'.'};
}

/* Musique : 3 morceaux médiévaux + 1 chant de marins : 3 morceaux originaux, composés pour le jeu et joués par le navigateur (Web Audio, aucun fichier).
   Instruments imités : flûte à bec (vibrato), luth (cordes pincées), bourdon de vielle / cornemuse, cor, tambour sur cadre, tambourin.
   1. « Le port du village » (ré dorien)       : exploration, paix.
   2. « Le conseil des capitaines » (sol mixolydien) : phase d'ordres, développement.
   3. « Bataille » (ré phrygien)                : menace (tension, sans mélodie au début) puis guerre (complète).
   4. « L'appel du large » (ré mixolydien) : chant de marins original (accordéon), en alternance avec le 1 en exploration.
   Fin de partie : morceau 4 en fanfare (victoire), du morceau 2 lent et en mineur (défaite).
   Les moments où la musique change (scènes) ne bougent pas : seul ce qui est joué change. */
const MED_NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
/* « D5 - E5 . » : note, « - » prolonge la note précédente, « . » silence ; 8 temps par mesure */
function medBar(s){
  const tk=s.trim().split(/\s+/),out=Array(8).fill(null);let last=-1;
  tk.forEach((x,i)=>{
    if(x==='-'){if(last>=0)out[last].d++;return;}
    if(x==='.'){last=-1;return;}
    const m=x.match(/^([A-G])(b|#)?(\d)$/);if(!m)return;
    out[i]={m:12*(+m[3]+1)+MED_NOTE[m[1]]+(m[2]==='b'?-1:m[2]==='#'?1:0),d:1};last=i;
  });
  return out;
}
const MED={
  port:{len:.28,roots:[50,50,48,45,50,48,53,50],mel:[

  conseil:{len:.36,roots:[43,43,48,50,43,41,50,43],mel:[
    'G4 - A4 B4 C5 - B4 A4','G4 - - D5 - - . .','E5 D5 C5 - B4 C5 D5 -','A4 - - - . . . .',
    'B4 - C5 D5 E5 - D5 C5','D5 - F5 - E5 D5 C5 -','B4 A4 G4 - A4 - B4 -','G4 - - - . . . .'].map(medBar),
    lead:'flute',lute:'harpe',drum:'rare',drone:.04},
  bataille:{len:.21,roots:[50,50,53,51,50,46,50,50],mel:[
    'D5 . D5 F5 G5 - F5 Eb5','D5 - - . A4 . C5 D5','F5 . F5 G5 A5 - G5 F5','Eb5 - D5 - . . . .',
    'A5 . A5 Bb5 A5 G5 F5 G5','A5 - - . G5 F5 Eb5 F5','D5 . F5 Eb5 D5 C5 Bb4 C5','D5 - - - . . . .'].map(medBar),
    lead:'cor',lute:false,drum:'marche',drone:.06},

  large:{len:.27,roots:[50,43,48,50,50,48,48,50],mel:[

function medFlute(f,t,dur,vol){
  const c=SND.ctx,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();

  g.connect(SND.mus);g.connect(SND.send);

  tr.frequency.value=6;tg.gain.value=vol*.12;tr.connect(tg);tg.connect(g.gain);
  for(const [ty,dt,k] of [['square',1,.5],['sawtooth',1.004,.45],['square',2,.12]]){const o=c.createOscillator(),gg=c.createGain();o.type=ty;o.frequency.value=f*dt;gg.gain.value=k;o.connect(gg);gg.connect(lp);o.start(t);o.stop(t+dur+.15);}
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.035);g.gain.setValueAtTime(vol*.85,t+Math.max(.05,dur-.06));g.gain.exponentialRampToValueAtTime(.0001,t+dur+.1);
  lp.connect(g);g.connect(SND.mus);g.connect(SND.send);tr.start(t);tr.stop(t+dur+.15);SND.n++;
}
function medClap(t,vol){sNoise(SND.dr,t,.06,vol,1500,1.4);sNoise(SND.dr,t+.012,.07,vol*.8,1300,1.2);}
function medDrum(t,vol){sTone(SND.dr,92,t,.32,'sine',vol,.004,52);sNoise(SND.dr,t,.09,vol*.25,320,1.2,'lowpass');}
function medTamb(t,vol){sNoise(SND.dr,t,.07,vol,6500,1,'highpass');}
/* ---- un temps de musique ---- */
function sndBeat(t){
  const [key,k]=medKey(),P=MED[key],len=SND_SCENES[SND.scene].len,stp=SND.beat,bar=SND.bar%8;
  const root=P.roots[bar]+(SND.scene==='lose'&&bar%4===3?-1:0);
  const tense=SND.scene==='tense',win=SND.scene==='win',lose=SND.scene==='lose';
  if(stp===0&&P.drone)medDrone(root,t,len*8*1.02,P.drone*(tense?1.2:1));
  if(P.lead==='accordeon'&&(stp===0||stp===4)){medPluck(mfreq(root-12),t,.09,.5,900);for(const iv of [12,16,19])medAcc(mfreq(root+iv),t+len*2,len*.9,.02);}
  /* luth : arpège racine-quinte-octave ; harpe : un temps sur deux plus aigu */
  if(P.lute&&!tense){
    const arp=[0,7,12,7,0,7,12,7];
    if(P.lute==='bouzouki'){if(stp%2===1)medPluck(mfreq(root+12+arp[stp]),t,.085,.35,3600);}
    else if(P.lute==='harpe'){if(stp%2===0)medPluck(mfreq(root+12+arp[stp]),t,.07,1.4,3200);}
    else if(stp%2===0||stp===3)medPluck(mfreq(root+12+arp[stp]),t,.08*(lose?.6:1),.75);
  }
  /* mélodie (en « menace », elle n'apparaît qu'une mesure sur deux, plus bas) */
  const e=P.mel[bar][stp];
  if(e&&(!tense||SND.bar%2===1)){
    const f=mfreq(e.m-(tense?12:0)-(lose&&e.m%12===11?1:0))   /* défaite : si → si bémol, le morceau passe en mineur */,d=e.d*len*.95,v=(P.lead==='cor'?.07:.075)*k;
    if(P.lead==='cor')medHorn(f,t,d,v);else if(P.lead==='accordeon')medAcc(f,t,d,v*.95);else medFlute(f,t,d,v);
    if(win&&stp===0)medHorn(f/2,t,d,.04);
  }
  /* percussions */
  if(P.drum==='doux'){if(stp===0||stp===5)medDrum(t,.16);if(stp===3||stp===7)medTamb(t,.025);}
  else if(P.drum==='pont'){if(stp===0||stp===4)medDrum(t,.2);if(stp===2||stp===6)medClap(t,.06);}
  else if(P.drum==='rare'){if(stp===0&&bar%2===0)medDrum(t,.12);}
  else if(P.drum==='marche'){
    if(stp===0||stp===3||stp===6)medDrum(t,tense?.2:.26);
    if(!tense&&stp%2===1)medTamb(t,.03);
    if(!tense&&stp===4)sNoise(SND.dr,t,.12,.07,1700,.9);
  }
  if(win&&stp===0)medDrum(t,.22);
}

/* ================= Boucle principale ================= */
let last=performance.now(),acc=0,panelT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(MODE==='client')clientAdvance(dt);
  else if(started&&!over&&speed>0){
    acc+=dt*speed;
    let k=0;
    while(acc>=.05&&k<12&&!over){step(.05);acc-=.05;k++;}
    if(k>=12)acc=0;
  }
  tmTick(dt);agTick(dt);
  if(MODE==='host')netTick();
  if(MODE==='client'&&NET.pending.size&&now-NET.pushAt>250){NET.pushAt=now;pushCmds();}
  netWatch(now);checkElim();
  draw();updateTop();renderLog();rkFrame(now);
  if(++mTick%6===0)drawMini();
  panelT+=dt;
  if(AG.trn&&MODE==='client')AG.left=Math.max(0,AG.left-dt);
  if(panelT>.3){panelT=0;renderPanel(false);renderTModal();}
  else if(AG.trn){const tl=$('#tm-left');if(tl)tl.textContent=Math.ceil(AG.left);}
  requestAnimationFrame(frame);
}
new ResizeObserver(resize).observe($('#mapwrap'));
window.addEventListener('resize',resize);
seed=Math.floor(Math.random()*90000)+1000;
newGame(seed,'normal');
resize();
showIntro();
netInit();
renderPanel(true);
requestAnimationFrame(frame);
})();
</script>

/* ---------- 5. ÉQUIPAGE : recharges de tous, changement, assistance, attaque combinée ---------- */
function stepTeam(dt){

    for(const k in h.cd)if(h.cd[k]>0)h.cd[k]=Math.max(0,h.cd[k]-dt*(U&&U.cdK>1&&(k==='q'||k==='w'||k==='e')?U.cdK:1));
    h.asCd=Math.max(0,h.asCd-dt);

}

}

function assistWhy(i){const m=S.team[i];if(!m||m===S.h)return 'Indisponible.';if(m.ko)return HEROES[m.k].s+' est K.O.';if(m.asCd>0)return 'Assistance en recharge.';return '';}

/* ---------- 6. ENNEMIS ---------- */
function spawn(k,x,y,elite){
  const D=FOES[k],m=elite?2:1;
  const f={id:S.id++,k,x,y,r:D.r*(elite?1.15:1),hp:D.hp*m,hpM:D.hp*m,spd:D.spd,dmg:D.dmg*(elite?1.3:1),cd:.8+Math.random()*1.2,st:'move',wt:0,wtM:1,aimA:0,stun:0,flash:0,kx:0,ky:0,elite:!!elite,boss:!!D.boss,ph:1,invul:0,born:.45,dead:false,pat:'',burn:0,burnD:0,burnT:0};
  bound(f);S.foes.push(f);S.fx.push({k:'ring',x:f.x,y:f.y,r0:f.r*2.4,r1:f.r,t:0,dur:.45,col:'#ff5a4e'});
  return f;
}
function stepFoes(dt){
  const h=S.h;
  for(const f of S.foes){
    if(f.dead)continue;
    f.flash=Math.max(0,f.flash-dt);f.invul=Math.max(0,f.invul-dt);
    f.x+=f.kx*dt;f.y+=f.ky*dt;f.kx*=Math.max(0,1-7*dt);f.ky*=Math.max(0,1-7*dt);
    if(f.burn>0){f.burn-=dt;f.burnT-=dt;if(f.burnT<=0){f.burnT+=.5;if(f.invul<=0){const d=Math.max(1,Math.round(f.burnD*.5));f.hp-=d;S.dmgDone+=d;addTxt(f.x,f.y-f.r-6,String(d),'#ff9a4e',.85);if(f.hp<=0){killFoe(f);continue;}}}}
    if(f.born>0){f.born-=dt;continue;}
    if(f.stun>0){f.stun-=dt;bound(f);continue;}
    const D=FOES[f.k],d=dist(f,h),a=ang(f,h);
    if(D.ai==='boss')aiBoss(f,dt,d,a);
    else if(f.st==='wind'){
      f.wt-=dt;
      if(f.wt<=0){
        if(D.ai==='melee'){if(inCone(f,f.aimA,72,.75,h))hurtHero(f.dmg,D.ty,f);}
        else if(D.ai==='gunner'){S.shots.push({x:f.x+Math.cos(f.aimA)*f.r,y:f.y+Math.sin(f.aimA)*f.r,vx:Math.cos(f.aimA)*540,vy:Math.sin(f.aimA)*540,dmg:f.dmg,ty:'bullet',team:1,from:f.id,life:1.5,r:5});beep(700,.03,'square',.15);}
        else if(D.ai==='brute'){S.fx.push({k:'ring',x:f.x,y:f.y,r0:20,r1:110,t:0,dur:.25,col:'#ff8a5e'});if(!REDUCE)S.shake=Math.max(S.shake,.15);if(inCircle(f,108,h))hurtHero(f.dmg,D.ty,f);}
        f.st='move';f.cd=D.ai==='melee'?1.1+Math.random()*.4:D.ai==='gunner'?2.2+Math.random()*.8:2.8;
      }
    }else{
      f.cd-=dt;
      if(D.ai==='melee'){
        if(d>40+h.r){f.x+=Math.cos(a)*f.spd*dt;f.y+=Math.sin(a)*f.spd*dt;}
        if(f.cd<=0&&d<62+h.r)wind(f,.42,a);
      }else if(D.ai==='gunner'){
        const m=d<250?-1:d>420?1:0,sa=a+Math.PI/2*(f.id%2?1:-1);
        if(m){f.x+=Math.cos(a)*f.spd*m*dt;f.y+=Math.sin(a)*f.spd*m*dt;}else{f.x+=Math.cos(sa)*f.spd*.35*dt;f.y+=Math.sin(sa)*f.spd*.35*dt;}
        if(f.cd<=0&&d<500)wind(f,.7,a);
      }else if(D.ai==='brute'){
        if(d>70+h.r){f.x+=Math.cos(a)*f.spd*dt;f.y+=Math.sin(a)*f.spd*dt;}
        if(f.cd<=0&&d<95+h.r)wind(f,.8,a);
      }
    }
    bound(f);
  }
  /* les ennemis ne se superposent pas */
  for(let i=0;i<S.foes.length;i++){const p=S.foes[i];if(p.dead)continue;for(let j=i+1;j<S.foes.length;j++){const q=S.foes[j];if(q.dead)continue;const d=dist(p,q),m=p.r+q.r;if(d<m&&d>.01){const o=(m-d)/2,ux=(q.x-p.x)/d,uy=(q.y-p.y)/d,wp=p.boss?0:q.boss?2:1,wq=q.boss?0:p.boss?2:1;p.x-=ux*o*wp;p.y-=uy*o*wp;q.x+=ux*o*wq;q.y+=uy*o*wq;}}}
  if(S.foes.some(f=>f.dead))S.foes=S.foes.filter(f=>!f.dead);
}
function wind(f,t,a){f.st='wind';f.wt=t;f.wtM=t;f.aimA=a;}

/* ---------- 7. BOSS : Morgan, 2 phases ---------- */
function aiBoss(f,dt,d,a){
  const h=S.h,D=FOES[f.k];
  if(f.ph===1&&f.hp<=f.hpM*.5){
    f.ph=2;f.st='roar';f.wt=.9;f.wtM=.9;f.invul=.9;f.spd*=1.25;
    addTxt(f.x,f.y-80,'PHASE 2 — Morgan enrage','#ff6b5e',1.5);beep(70,.5,'sawtooth',.6);
    for(let i=0;i<4;i++){const q=TAU*i/4+Math.random();spawn('soldat',f.x+Math.cos(q)*150,f.y+Math.sin(q)*150);}
    return;
  }
  if(f.st==='roar'){f.wt-=dt;if(f.wt<=0){S.fx.push({k:'ring',x:f.x,y:f.y,r0:40,r1:240,t:0,dur:.35,col:'#ff5a4e'});S.shake=.4;if(inCircle(f,230,h))hurtHero(10,'blunt',f);f.st='move';f.cd=.8;}return;}
  if(f.st==='wind'){
    f.wt-=dt;
    if(f.wt<=0){
      if(f.pat==='cleave'){S.fx.push({k:'slash',x:f.x,y:f.y,a:f.aimA,r:195,half:1,t:0,dur:.22,col:'#ff8a5e'});S.shake=.25;if(inCone(f,f.aimA,195,1,h))hurtHero(f.dmg,'slash',f);f.st='rec';f.wt=f.wtM=1.15;}
      else if(f.pat==='charge'){f.st='dash';f.wt=.3;f.hitDone=false;}
      else{const n=3;for(let i=0;i<n;i++)S.later.push({at:S.t+i*.45,fn:()=>{if(!S.over)S.zones.push({x:S.h.x,y:S.h.y,r:105,t:.9,dur:.9,dmg:50,ty:'blunt'});}});f.st='rec';f.wt=f.wtM=.9;}
    }
    return;
  }
  if(f.st==='dash'){
    f.x+=Math.cos(f.aimA)*1500*dt;f.y+=Math.sin(f.aimA)*1500*dt;f.wt-=dt;
    S.fx.push({k:'ghost',x:f.x,y:f.y,r:f.r,col:D.col,t:0,dur:.2});
    if(!f.hitDone&&dist(f,h)<=f.r+h.r+12){f.hitDone=true;hurtHero(45,'slash',f);}
    if(f.wt<=0){f.st='rec';f.wt=f.wtM=1.15;}
    return;
  }
  if(f.st==='rec'){f.wt-=dt;if(f.wt<=0){f.st='move';f.cd=f.ph===2?.45:.8;}return;}
  if(d>120+h.r){f.x+=Math.cos(a)*f.spd*dt;f.y+=Math.sin(a)*f.spd*dt;}
  f.cd-=dt;
  if(f.cd<=0){
    const rnd=Math.random();
    if(f.ph===2&&rnd<.35){f.pat='quake';wind(f,.6,a);}
    else if(d>270){f.pat='charge';wind(f,.75,a);}
    else{f.pat='cleave';wind(f,f.ph===2?.7:.85,a);}
  }
}

/* ---------- 8. PROGRESSION (propre à la mission) : l'expérience est partagée, tout l'équipage monte de niveau ensemble ---------- */
function gainXp(n){

    while(h.lv<MAXLV&&h.xp>=xpNeed(h.lv)){
      h.xp-=xpNeed(h.lv);h.lv++;
      const nm=Math.round(D.hp*(1+.08*(h.lv-1)));if(!h.ko)h.hp=Math.min(nm,h.hp+(nm-h.hpM)+nm*.1);h.hpM=nm;

      }
