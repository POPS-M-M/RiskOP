/* Concept : carte marine de nuit. La carte occupe le centre, le tableau de bord privé du joueur est à droite, le journal des événements flotte sur la carte. Un seul univers visuel sombre, voulu. */

.speed button+button{border-left:1px solid var(--line)}
.speed button.on{background:var(--accent);color:var(--accent-ink)}

.tcard b.ok{color:var(--good)}

/* Zone de jeu : la carte est l'élément principal, le panneau privé est un tiroir à droite */

.copt{text-align:left;display:grid;gap:4px;padding:10px 12px;border-radius:10px;align-content:start}
.copt small{color:var(--muted);font-weight:400}
.copt.on{background:var(--panel-2);color:var(--ink);font-weight:400;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.copt.on small{color:var(--muted)}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.opt.on{border-color:var(--good)}
.opt.gold{border-color:var(--accent)}
.opt.dark{border-color:#7a4a7a}
.opt small{grid-column:1;color:var(--muted)}
.opt button{grid-row:1/3;grid-column:2;white-space:nowrap}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
/* ---- refonte visuelle : fiche d'île, lisibilité, retours ---- */
.tab{font-size:10px}
.note{font-size:13px}
.lr small,.br small,.bn small,.chr small{font-size:12.5px}
.log div{font-size:13px}.hint span{font-size:13px}
.pl .sts{font-size:13px}.rar{font-size:11px}.cond,.jl{font-size:12.5px}
.era,.tag,.pill{font-size:11.5px}
.sheet{padding:0 0 10px;overflow:hidden;border-top:3px solid var(--c,var(--line))}
.sheet>*:not(.sh-art){margin-left:12px;margin-right:12px}
.sh-art{position:relative;margin:0;height:132px;background:var(--panel);overflow:hidden}
.sh-art .art{display:block;width:100%;height:100%}
.sh-ban{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 12px 7px;background:linear-gradient(to top,rgba(6,14,26,.92),rgba(6,14,26,0))}
.sh-ban b{font:700 24px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sh-id{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ch{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink);background:rgba(255,255,255,.03);white-space:nowrap}
.ch .bi{width:13px;height:13px}
.ch.ok{color:var(--good);border-color:rgba(76,195,138,.5)}
.ch.ko{color:var(--bad);border-color:rgba(239,106,98,.5)}
.sheet h4{font:600 14px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:14px;margin-bottom:6px;padding-top:10px;border-top:1px solid var(--line)}
.gar{display:flex;align-items:center;gap:12px}
.gar .big{font:700 34px/1 var(--f-display);min-width:46px;font-variant-numeric:tabular-nums}
.gbar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c,var(--accent)),#fff);border-radius:99px;transition:width .4s}
.prod{display:flex;gap:8px;flex-wrap:wrap}
.prod span{flex:1 1 90px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:600 16px/1.1 var(--f-body);font-variant-numeric:tabular-nums}
.prod i{font-style:normal;margin-right:4px}.prod small{color:var(--muted);font-weight:400;font-size:12px}
.prod .pg i{color:var(--c-gold)}.prod .ps i{color:var(--c-sci)}.prod .pf i{color:var(--c-faith)}
.pot{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:2px 0}
.pot>div{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.pot i{display:block;height:100%}
.built{display:flex;flex-wrap:wrap;gap:6px}
.bd{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;padding:3px 8px 3px 6px;font-size:12.5px}
.bd em{font-style:normal}.bd .bi{width:16px;height:16px;color:var(--accent)}
.bd2{display:inline-flex;align-items:center;gap:6px}.bd2 .bi{width:15px;height:15px;color:var(--accent)}
.chr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:4px 0}.chr small{grid-column:1/-1;color:var(--muted)}
.bn{padding:4px 0}.bn b{display:block;font-weight:600}.bn small{color:var(--muted)}
.rec .lr small{font-size:12px}
.br{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);transition:background .3s}
.br:first-of-type{border-top:0}
.br .bi-w{grid-row:1/3;align-self:start;width:30px;height:30px;border-radius:8px;background:rgba(224,164,60,.12);border:1px solid rgba(224,164,60,.35);display:grid;place-items:center;color:var(--accent)}
.br .bi{width:19px;height:19px}
.br .bt{min-width:0;display:grid;gap:3px}.br .bt b{font-weight:600}.br .bt small{color:var(--muted)}
.br>button{grid-column:3;grid-row:1;align-self:center;font-size:12.5px;white-space:nowrap}
.chs{display:flex;flex-wrap:wrap;gap:4px}.chs .ch{font-size:11.5px;padding:0 7px}
.br.locked{opacity:.78}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{background:rgba(224,164,60,.45);box-shadow:0 0 0 2px rgba(224,164,60,.6)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
.bi{width:18px;height:18px;flex:none}
button[data-act]:not(:disabled):active{transform:scale(.96)}
/* bandeau d'événement et avis de recherche */
.evbar{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;max-width:min(320px,45%)}
.evbar span{background:rgba(14,18,23,.92);border:1px solid var(--c,var(--line));border-left:4px solid var(--c,var(--line));border-radius:8px;padding:3px 9px;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.evbar span b{font-weight:700;color:var(--muted);margin-left:6px}
@media(max-width:700px){.evbar{display:none!important}}
.brief{position:absolute;right:56px;top:10px;z-index:7;width:min(300px,calc(100% - 140px));background:rgba(10,18,30,.95);border:1px solid var(--line);border-left:5px solid var(--c,#f2c75c);border-radius:10px;padding:8px 10px;display:grid;gap:3px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.brief.win{--c:#f2c75c}.brief.loss{--c:#ff8a70}
.brief .bh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.brief .bh b{font:700 13.5px/1.25 var(--f-display);color:var(--c)}
.brief .bh button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;min-width:24px;min-height:24px}
.brief .bl{color:var(--ink)}.brief .brb{justify-self:start;margin-top:3px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px}
.brief .brb:hover{border-color:var(--c)}
@media (prefers-reduced-motion:no-preference){.brief{animation:evin .35s ease-out}}
@media(max-width:700px){.brief{right:8px;left:8px;top:auto;bottom:8px;width:auto;padding:5px 8px;gap:1px;font-size:12px}.brief .bl.muted{display:none}.brief .bh b{font-size:12.5px}.brief .brb{margin-top:2px;padding:3px 9px}}
.rpt .rh{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.rpt .rv{font:700 15px/1.2 var(--f-display)}.rpt .rv.win{color:#f2c75c}.rpt .rv.loss{color:#ff8a70}
.rpt table{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}.rpt td,.rpt th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right}.rpt td:first-child,.rpt th:first-child{text-align:left}.rpt th{font-weight:600;color:var(--muted)}
.bossbar{position:relative;height:8px;background:rgba(255,255,255,.12);border-radius:4px;margin:4px 0 6px;overflow:hidden}.bossbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4d4d,#ff8a70);transition:width .3s}.bossbar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.7);text-decoration:none}
.rpt .vs{display:grid;grid-template-columns:1fr;gap:10px}.rpt .vs>div{border-left:3px solid var(--c);padding-left:8px;min-width:0}
.rrow{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:6px 8px;margin:4px 0;color:var(--ink);cursor:pointer;font-size:12.5px}
.rrow:hover{border-color:var(--accent)}.rrow.win{--c:#f2c75c}.rrow.loss{--c:#ff8a70}
.est{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}.est th{text-align:left;color:var(--muted);font-weight:600;padding:3px 6px 3px 0}.est td{padding:3px 6px 3px 0;border-top:1px solid var(--line)}
.tu{border-left:3px solid var(--accent)}.tud{display:flex;gap:4px;margin:2px 0 8px}.tud i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}.tud i.d{background:var(--good)}.tud i.c{background:var(--accent)}
.hdr #b-snd.off,#b-snd.off{opacity:.5}
.msb{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin:4px 0}.msb i{display:block;height:100%;background:var(--accent)}
.msr,.ach{padding:7px 0;border-top:1px solid var(--line)}.msr:first-of-type{border-top:0}.ach:not(.on){opacity:.85}.ach .lgs{margin-top:4px}.pl .emb{margin-left:4px;color:#f2c75c}
.evt{position:absolute;left:50%;top:46px;transform:translateX(-50%);z-index:7;pointer-events:none;max-width:min(560px,calc(100% - 120px))}
.evt.ban{background:rgba(10,18,30,.94);border:1px solid var(--c,var(--accent));border-left:5px solid var(--c,var(--accent));border-radius:10px;padding:8px 16px;display:grid;gap:2px;animation:evin .4s ease-out}
.evt.ban b{font:700 20px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--accent))}
.evt.ban span{font-size:13px;color:var(--ink)}
.evt.poster{top:56px;animation:evpost .5s cubic-bezier(.2,.9,.3,1.2)}
.wp{background:#e6d3a6;color:#3a2a1a;border:3px solid #6b4a2a;border-radius:4px;padding:8px 22px 10px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 0 22px rgba(107,74,42,.35);transform:rotate(-2deg);min-width:170px}
.wt{font:800 28px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.wi{font-size:42px;line-height:1.15;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.wn{font:800 18px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.wd{font-size:11px;letter-spacing:.25em;text-transform:uppercase;margin-top:6px}
.wb{font:800 22px/1.1 var(--f-display);letter-spacing:.04em}
@keyframes evin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes evpost{from{opacity:0;transform:translate(-50%,-30px) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@media (prefers-reduced-motion:reduce){.flash,.evt.ban,.evt.poster{animation:none}.gbar i{transition:none}}
@media(max-width:700px){.evt{top:70px;max-width:calc(100% - 24px)}.sh-ban b{font-size:21px}.br{grid-template-columns:28px minmax(0,1fr)}.br>button{grid-column:2;grid-row:auto;justify-self:start}}
.sheet .sub{font-weight:600;margin:8px 12px 2px;color:var(--ink)}
.lg.dim{opacity:.62}
.res{flex:1 1 420px}

/* ===== RISK OP : couche d'expérience (tutoriel, phases, économie, sauvegardes, son) ===== */
.app{grid-template-rows:auto auto auto minmax(0,1fr)}
/* bandeau de phase : permanent, hors de la carte (ne cache aucune île) */
.phase{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:5px 10px;min-height:38px}
.phase.res{border-left-color:#5fb3e6}
.phase .ph-turn{font:800 18px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.phase .ph-state{font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.phase .ph-state i{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.phase.res .ph-state i{background:#5fb3e6}
@media (prefers-reduced-motion:no-preference){.phase.plan .ph-state i{animation:rkp 1.6s ease-in-out infinite}@keyframes rkp{50%{opacity:.35}}}
.phase .ph-sub{color:var(--muted);font-size:12.5px;min-width:0;flex:1 1 220px}
.phase .ph-camps{display:flex;gap:5px;flex-wrap:wrap}
.phase .pc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:1px 7px;font-size:12px;background:rgba(0,0,0,.2);white-space:nowrap}
.phase .pc em{font-style:normal;color:var(--muted)}
.phase .pc.ok em{color:var(--good)}
.phase .pc.me{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.phase .ph-bar{flex:1 1 90px;min-width:70px;max-width:180px;height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.phase .ph-bar i{display:block;height:100%;background:#5fb3e6;width:0}
.phase .ph-q{width:24px;height:24px;padding:0;border-radius:50%;line-height:1;flex:none}
.phase .ph-mv{flex-basis:100%;font-size:12.5px;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phase .ph-mv:empty{display:none}
.phase .ph-mv .mv{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:1px 8px;background:rgba(0,0,0,.22);cursor:pointer}
.phase .ph-mv .mv.me{border-color:var(--bad);border-left-color:var(--bad);background:rgba(239,106,98,.12)}
.phexp{flex-basis:100%;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;display:grid;gap:3px}
.phexp b{color:var(--ink)}
@media(max-width:700px){.phase .ph-sub{display:none}.phase .pc em{display:none}}
/* statut dans le tableau des camps */
.pl .rdy{font-size:11px;color:var(--muted);white-space:nowrap}.pl .rdy.ok{color:var(--good)}
/* HUD allégé */
.chip.adv{display:none}.app.adv .chip.adv{display:flex}
.ctl button .lbl2{display:inline}
@media(max-width:1100px){.ctl button .lbl2{display:none}}
/* mini-carte déplaçable et masquable */
.minibox{position:absolute;left:10px;bottom:10px;z-index:3;width:190px;background:rgba(14,22,34,.78);border:1px solid var(--line);border-radius:9px;overflow:hidden;opacity:.82;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.minibox:hover,.minibox.drag{opacity:1}
.mini-h{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:2px 4px 2px 8px;font-size:11px;color:var(--muted);cursor:grab;touch-action:none;user-select:none}
.mini-h button{padding:0 7px;line-height:1.4;font-size:12px;background:transparent;border-color:transparent}
.minibox .mini{position:static;display:block;width:100%;height:auto;aspect-ratio:1400/860;border:0;border-radius:0;box-shadow:none;cursor:crosshair}
.mini-lg{display:flex;gap:8px;flex-wrap:wrap;padding:3px 8px 4px;font-size:10.5px;color:var(--muted)}
.mini-lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:-1px;border:2px solid transparent}
.mini-show{position:absolute;left:10px;bottom:10px;z-index:3;padding:4px 9px;background:rgba(14,22,34,.85)}
@media(max-width:940px){.minibox,.mini-show{display:none!important}}
/* notifications discrètes */
.log{max-width:min(46%,420px);opacity:.95}
.log div{font-size:12px;padding:2px 8px;background:rgba(14,18,23,.72)}
.logbtn{position:relative}
.logbtn b{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font:700 10px/16px var(--f-body);text-align:center;padding:0 3px}
/* onglets groupés */
.tabs{grid-template-columns:repeat(5,1fr)}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 8px}
.subtabs button{font-size:12.5px;padding:3px 10px;border-radius:999px}
.subtabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .bdg{display:inline-block;min-width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:3px}
/* budget permanent en tête du panneau */
.budget{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin:0 0 8px;background:rgba(0,0,0,.18);font-size:12.5px}
.budget b{font:700 17px/1 var(--f-display);letter-spacing:.02em}
.budget .pos{color:var(--good)}.budget .neg{color:var(--bad)}
/* aperçu de dépense : affiché PAR-DESSUS le panneau (position absolue) pour ne jamais décaler les boutons sous la souris */
.budget{position:relative}
.budget .prev{position:absolute;left:-1px;right:-1px;top:calc(100% - 2px);z-index:5;pointer-events:none;color:var(--accent);font-size:12px;line-height:1.35;padding:5px 9px;background:var(--panel,#13202f);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.budget .prev:empty{display:none}
/* tableau des Berrys */
.ecoh{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:2px 0 8px}
.ecoh small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ecoh .big{font:800 30px/1 var(--f-display);letter-spacing:.02em}
.ecoh .net.pos .big{color:var(--good)}.ecoh .net.neg .big{color:var(--bad)}
.verdict{border-radius:8px;padding:6px 9px;font-size:12.5px;margin:0 0 8px;border:1px solid var(--line)}
.verdict.pos{border-color:var(--good);background:rgba(76,195,138,.1)}.verdict.neg{border-color:var(--bad);background:rgba(239,106,98,.1)}
.er{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.er b{font-variant-numeric:tabular-nums}.er.pos b{color:var(--good)}.er.neg b{color:var(--bad)}.er.tot{border-top:1px solid var(--line);font-weight:700;font-size:14px}
.er.sub span{color:var(--muted);padding-left:10px}
.ecoh2{font:600 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
/* conseils : toujours savoir pourquoi */
.adv-card{border-left:3px solid var(--accent)}
.adv-card .ar{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13px}
.adv-card .ar+.ar{border-top:1px solid rgba(255,255,255,.06)}
.adv-card .ar span:first-child{flex:none;width:20px;text-align:center}
.adv-card .ar button{margin-left:auto;flex:none;font-size:12px;padding:2px 9px}
/* butin de conquête dans le bandeau de bataille */
.brief .rc{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;display:grid;gap:2px;font-size:12.5px}
.brief .rc b{color:var(--accent)}
.brief .rc .g{color:var(--good)}
/* fiches de personnage */
.chc{border:1px solid var(--line);border-left:4px solid var(--rc,var(--line));border-radius:8px;padding:8px 10px;margin:6px 0;display:grid;gap:4px;background:rgba(0,0,0,.14)}
.chc .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chc .t b{font:700 16px/1.1 var(--f-display);letter-spacing:.03em}
.chc .ln{font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.chc .ln i{font-style:normal;flex:none;width:18px;text-align:center}
.chc .ln span{min-width:0}
.chc .use{color:var(--accent)}
.chc.dim{opacity:.7}
.chc details summary{cursor:pointer;color:var(--muted);font-size:12px}
.chc .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
/* boss : objectif facultatif */
.bossob{border:1px solid #7a3a34;border-radius:8px;padding:7px 9px;background:rgba(239,106,98,.07);display:grid;gap:3px;font-size:12.5px;margin:6px 0}
.bossob .gain{color:var(--good)}.bossob .risk{color:#ff9a8f}
/* coach : tutoriel interactif */
.coach{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;width:min(480px,calc(100% - 24px));background:rgba(10,18,30,.97);border:1px solid var(--accent);border-radius:12px;padding:10px 12px 11px;display:grid;gap:5px;box-shadow:0 10px 28px rgba(0,0,0,.6);font-size:13.5px}

function sndBuild(ctx){

function sTone(dest,f,t,dur,type,vol,att,slide,send){
  const c=SND.ctx,o=c.createOscillator(),g=c.createGain();

/* scène voulue d'après l'état de la partie ; priorité : fin > guerre > tension > développement > exploration */
function sndWant(){

    if(performance.now()<SND.until)return 'war';
    const mine=new Set(terrs.filter(t=>t.owner===ME).map(t=>t.id));

    if(marineWarned&&marineTarget===ME)return 'tense';

function sndSetScene(s){

function sndFill(limit){
  while(SND.next<limit){
    if(SND.beat===0){
      const w=sndWant(),held=performance.now()-SND.sceneAt;
      /* fin et guerre passent tout de suite ; les autres changements attendent au moins 10 s pour éviter le va-et-vient */
      if(w!==SND.scene&&(w==='win'||w==='lose'||w==='war'||SND.scene==='win'||SND.scene==='lose'||held>10000))sndSetScene(w);
    }

    SND.next+=SND_SCENES[SND.scene].len;

}
function sndSched(){
  const c=SND.ctx;if(!c||!SND.on||c.state!=='running')return;

function sndInit(){

}

}

function sndFx(k){
  if(!SND.ctx||!SND.on||SND.dead||SND.ctx.state!=='running'||SND.sv<=0.001)return;

  else if(k==='bell'){sTone(d,880,t,1.3,'sine',.14,.005);sTone(d,1760,t,.8,'sine',.05,.005);}
  else if(k==='chime'){sTone(d,784,t,.5,'sine',.15,.005);sTone(d,1175,t+.12,.7,'sine',.15,.005);}
  else if(k==='ach'){[72,76,79,84].forEach((n,i)=>sTone(d,mfreq(n),t+i*.1,.6,'triangle',.17,.01));}

  else if(k==='step'){sTone(d,740,t,.12,'sine',.1,.004);}
}

const chMeta=i=>CHMETA[LEGENDS[i].s];
/* état par personnage : niveau, expérience, recharge (temps de jeu) */
let CH=[];
const chReset=()=>{CH=LEGENDS.map(()=>({lv:1,xp:0,cd:0,own:-1,post:-1}));};
const XP_T=[6,14,26,42];
const chLvK=i=>1+.10*((CH[i]?CH[i].lv:1)-1);
const chPow=i=>{const M=chMeta(i);return RAR[M.r].pw*(.7+.05*M.st[M.sk.s])*(1+.08*((CH[i]?CH[i].lv:1)-1));};
const tkS=()=>Math.sqrt(PK/6);
const STRIKE_K=.45,CD_K=1.3;
const chCd=i=>{const sk=chMeta(i).sk;return sk.cd*tkS()*CD_K*(sk.ty==='strike'?1.5:1);};
const RAR_W={C:0,R:1,E:2,L:3};
/* places d'équipage : 3, puis 4 et 5 aux âges suivants. Seuls les plus rares (puis les plus expérimentés) servent ; les autres restent en réserve. Cela freine l'emballement du camp qui rafle les lieutenants. */
const chSlots=()=>3+Math.min(2,AG.n|0);
const chRank=i=>RAR_W[chMeta(i).r]*10+(CH[i]?CH[i].lv:1);
const chActive=list=>list.slice().sort((a,b)=>chRank(b)-chRank(a)||a-b).slice(0,chSlots());
const chOwnedBy=pid=>{const o=[];for(let i=0;i<LEGENDS.length;i++)if(CH[i]&&CH[i].own===pid)o.push(i);return o;};
const chIsActive=(pid,i)=>chActive(chOwnedBy(pid)).includes(i);
const chOwner=i=>CH[i]?CH[i].own:-1;
function chAddXP(i,n){const c=CH[i];if(!c)return;c.xp+=n;while(c.lv<5&&c.xp>=XP_T[c.lv-1])c.lv++;}
function chAddXPAll(pid,n){for(const i of chActive(chOwnedBy(pid)))chAddXP(i,n);}
function skText(i){
  const M=chMeta(i),sk=M.sk,f=chPow(i),k=tkS(),lv=CH[i]?CH[i].lv:1,pc=x=>Math.round(Math.abs(x)*100)+' %';
  if(sk.ty==='strike')return 'détruit '+pc(Math.min(.5,sk.v*f*STRIKE_K))+' de la garnison d\'un territoire voisin ennemi (en guerre) ou indépendant';
  if(sk.ty==='buff'||sk.ty==='debuff'){
    const fx={};for(const q in sk.fx)fx[q]=sk.fx[q]*f;
    return (sk.ty==='buff'?'pendant ':'chez tous les ennemis en guerre, pendant ')+Math.round(sk.dur*k*(1+.1*(lv-1)))+' s : '+fxText2(fx);
  }
  if(sk.ty==='gold')return 'rapporte l\'équivalent de '+Math.round(sk.secs*f)+' s de revenu en Berrys (au moins 10 ฿)';
  if(sk.ty==='wealth')return 'rapporte l\'équivalent de '+Math.round(sk.secs*f)+' s de revenu en Berrys et en Savoir';
  if(sk.ty==='rally')return 'ajoute '+pc(Math.min(.5,sk.v*f))+' de Pirates à la garnison de chacun de vos territoires';
  return '';
}
/* lieutenant affecté à une île : il commande les troupes qui en partent (attaque, vitesse) et la garnison qui la défend */
function ltAt(tid){const t=terrs[tid];if(!t||t.owner<0)return -1;for(let i=0;i<LEGENDS.length;i++){const c=CH[i];if(c&&c.own===t.owner&&c.post===tid&&chIsActive(c.own,i))return i;}return -1;}
function ltFx(i){const d=LEGENDS[i].lead||{},p=players[CH[i].own],kk=legBonus(p,i)*chLvK(i);return {atk:(d.atk||0)*kk,def:(d.def||0)*kk,spd:(d.spd||0)*kk,big:(d.big||0)*kk};}
const ltOf=tid=>{const i=ltAt(tid);return i<0?{atk:0,def:0,spd:0,big:0}:ltFx(i);};
const legBonus=(p,i)=>{const L=LEGENDS[i];return L.aff&&CREWS[p.crew||0].id===L.aff?1.5:1;};

function generateMap(seed){
  const rng=mulberry32(seed*31+977),idx=new Map(MAP_I.map((d,i)=>[d[0],i]));
  const shape=MAP_I.map(d=>{const r=mulberry32(nameHash(shapeKey(d[0])));return {a2:.04+r()*.04,p2:r()*6.28,a3:.02+r()*.03,p3:r()*6.28,a5:.01+r()*.02,p5:r()*6.28};});
  const grid=new Int16Array(GW*GH).fill(-1),score=new Float32Array(GW*GH).fill(9);
  MAP_I.forEach((d,id)=>{
    const cx=d[1],cy=d[2],R=d[3],sh=shape[id],B=Math.ceil(R*1.25/CELL)+2;
    const gx0=Math.max(0,Math.floor(cx/CELL)-B),gx1=Math.min(GW-1,Math.floor(cx/CELL)+B),gy0=Math.max(0,Math.floor(cy/CELL)-B),gy1=Math.min(GH-1,Math.floor(cy/CELL)+B);
    for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
      const dx=gx*CELL+1-cx,dy=gy*CELL+1-cy,th=Math.atan2(dy,dx);
      const rd=R*(1+sh.a2*Math.cos(2*th+sh.p2)+sh.a3*Math.cos(3*th+sh.p3)+sh.a5*Math.cos(5*th+sh.p5));
      const q=Math.hypot(dx,dy)/rd,i=gy*GW+gx;
      if(q<1&&q<score[i]){score[i]=q;grid[i]=id;}
    }
  });
  const T=MAP_I.map((d,i)=>{
    const u=emptyU();u.guerrier=11+Math.floor(rng()*11);
    const type=TCODE[d[4]];if(type==='montagne')u.guerrier+=4;
    if(d[0]==='Mary Geoise')u.guerrier+=8;else if(d[0]==='Reverse Mountain')u.guerrier+=4;
    return {id:i,x:d[1],y:d[2],rad:d[3],nb:[],type,name:d[0],owner:-1,u,capital:false,city:null,glyphs:[],reg:d[5]};
  });
  const belts=new Set(MAP_B.map(e=>e[0]+'|'+e[1])),routes=[];
  for(const e of MAP_E.concat(MAP_B)){
    const a=idx.get(e[0]),b=idx.get(e[1]);
    if(a===undefined||b===undefined)throw new Error('route inconnue '+e);
    if(T[a].nb.includes(b))continue;
    T[a].nb.push(b);T[b].nb.push(a);routes.push([a,b,belts.has(e[0]+'|'+e[1])?1:0]);
  }
  const cells=T.map(()=>[]),border=new Uint8Array(GW*GH),coast=new Uint8Array(GW*GH),tc=T.map(()=>[]);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const i=gy*GW+gx,id=grid[i];
    if(id>=0){
      tc[id].push(i);
      let edge=false;
      for(let d=1;d<=2&&!edge;d++){
        const l=gx>=d?grid[i-d]:id,r=gx<GW-d?grid[i+d]:id,u=gy>=d?grid[i-d*GW]:id,dn=gy<GH-d?grid[i+d*GW]:id;
        if(l!==id||r!==id||u!==id||dn!==id)edge=true;
      }
      if(edge)border[i]=1;else cells[id].push(i);
    }else{
      let md=99;
      for(let dy=-4;dy<=4&&md>2;dy++)for(let dx=-4;dx<=4;dx++){
        const x=gx+dx,y=gy+dy;
        if(x<0||y<0||x>=GW||y>=GH)continue;
        if(grid[y*GW+x]>=0){const d=Math.max(Math.abs(dx),Math.abs(dy));if(d<md)md=d;}
      }

    }
  }
  T.forEach(t=>{
    const pool=cells[t.id].filter(i=>{const x=(i%GW)*CELL+1,y=((i/GW)|0)*CELL+1;return Math.hypot(x-t.x,y-t.y)>t.rad*.5;});
    const src=pool.length?pool:cells[t.id];
    const cnt=t.type==='plaine'?0:(t.type==='foret'?4:3);
    for(let k=0;k<cnt&&src.length;k++){
      const i=src[Math.floor(rng()*src.length)];

    let cx=0,cy=0;for(const i of ids){cx+=T[i].x;cy+=T[i].y;}

    return {n:def.n,fx,w:def.w,ids,cx:cx/ids.length,cy:cy/ids.length,lx:MAP_LAB[r][0],ly:MAP_LAB[r][1]};
  });

}

function recalc(p){
  const m={atk:0,def:0,spd:0,gold:0,sci:0,faith:0,regen:0,cap:0,recruit:0,fruitCost:0,inf:0,rt:0,fc:0,fd:0,fm:0};

  const cw=CREWS[p.crew||0];
  for(const k in cw.fx)m[k]+=cw.fx[k];
  if(p.religion){
    const r=RELS.find(x=>x.id===p.religion),k=p.ferveur?2:1;
    for(const key in r.fx)m[key]+=r.fx[key]*k;
    m.faith+=.10*k;
  }
  for(const R of regs)if(regionHeld(R,p.id))for(const k in R.fx)m[k]+=R.fx[k];
  for(const t of terrs){
    if(t.owner!==p.id)continue;
    if(t.fruit){const f=FRUITS[t.fruit];for(const k in f.fx)m[k]+=f.fx[k]*cw.fruitX;}
    const ie=ISLE_FX[t.name];if(ie)for(const k in ie.fx)m[k]+=ie.fx[k];
    if(!t.city)continue;
    for(const b of t.city.b)if(b.startsWith('w:')){const w=WONDER[b.slice(2)];for(const k in w.fx)m[k]+=w.fx[k];}
  }
  for(let i=0;i<BS.length;i++)if(BS[i].dead&&BS[i].by===p.id)for(const k in BOSSES[i].rew.fx)m[k]+=BOSSES[i].rew.fx[k];
  for(const i of chActive(chOwnedBy(p.id))){const L=LEGENDS[i],kk=legBonus(p,i)*chLvK(i);for(const k in L.fx)m[k]+=L.fx[k]*kk;}
  if(p.buf&&p.buf.length){p.buf=p.buf.filter(b=>b.until>time);for(const b of p.buf)for(const k in b.fx)m[k]=(m[k]||0)+b.fx[k];}
  recalcAge(p,m);
  p.mod=m;
}

    if(t.city){
      const lm=1+.35*(t.city.lvl-1);
      gg*=lm;ss*=lm;ff*=lm;
      for(const b of t.city.b){const bi=BLD_INCOME[b];if(bi){gg+=bi.g||0;ss+=bi.s||0;ff+=bi.f||0;}}
    }
    return [gg,ss,ff];
}
/* Berrys bruts d'un camp (avant entretien) : base du tribut de vassalité */
function goldGross(p){let g=0;for(const t of terrs)if(t.owner===p.id)g+=terrInc(t)[0];return g*(1+p.mod.gold+Math.min(.2,tradePartners(p.id)*.1))*p.inc;}
function income(p){
  let g=0,s=0,f=0,up=0;
  for(const t of terrs){
    if(t.owner!==p.id)continue;
    const [gg,ss,ff]=terrInc(t);
    g+=gg;s+=ss;f+=ff;
    for(const k of UK)if(k!=='guerrier')up+=t.u[k]*UPKEEP;
  }
  for(const a of armies)if(a.owner===p.id)for(const k of UK)if(k!=='guerrier')up+=a.u[k]*UPKEEP;
  const m=p.mod,tb=Math.min(.2,tradePartners(p.id)*.1);
  const Z=1/PK;
  let gg2=g*(1+m.gold+tb)*p.inc;
  if(vas[p.id]>=0&&players[vas[p.id]]&&players[vas[p.id]].alive)gg2*=1-TRIB;
  for(const q of players)if(q.alive&&q.id!==p.id&&vas[q.id]===p.id)gg2+=TRIB*goldGross(q);
  return {g:(gg2-up)*Z,s:s*(1+m.sci)*p.inc*Z,f:f*(1+m.faith)*p.inc*Z,up:up*Z,i:Math.max(0,.22+tradePartners(p.id)*.04+m.inf)*p.inc*Z};
}
const unitOK=(p,k)=>!UNITS[k].tech||!!p.techs[UNITS[k].tech];
function recruitCost(p,t,k){
  const c=t&&t.city&&t.city.b.includes('caserne')?.8:1;
  const fc=k==='cavalier'?Math.min(.5,p.mod.fruitCost||0):0;
  return Math.max(3,Math.round(UNITS[k].cost*(1-Math.min(.6,p.mod.recruit))*(1-fc)*c));
}
const slotsOf=t=>2+t.city.lvl+(t.capital?1:0);
const usedSlots=t=>t.city.b.length+(t.city.q?1:0);

/* ---- combat ---- */
function powerOf(u,enemy,mode){
  const te=sumU(enemy)||1;
  const sh=k=>enemy[k]/te;
  let s=0;
  for(const k of UK){
    const n=u[k];if(n<=0)continue;
    let m=1;
    if(k==='lancier')m+=.8*sh('cavalier');
    if(k==='cavalier')m+=.6*sh('archer');
    if(k==='archer')m+=.5*sh('lancier');
    s+=n*(mode==='atk'?UNITS[k].atk:UNITS[k].def)*m;
  }
  return s;
}
function fortOf(t){
  let f=1;
  if(t.city){f*=1.15;if(t.city.b.includes('muraille'))f*=1.35;}
  if(t.capital)f*=1.25;
  return f;
}
function defTotal(t,attU,noise,P){
  const dm=(t.owner>=0?Math.max(.3,1+players[t.owner].mod.def+ltOf(t.id).def):1)*TYPES[t.type].def;
  const ap=powerOf(attU,t.u,'atk');
  const cat=attU.catapulte*UNITS.catapulte.atk;
  const cut=ap>0?Math.min(.75,cat/ap*1.6):0;
  const f=1+(fortOf(t)-1)*(1-cut),fo=t.fo>time?(t.fm||FORT_MUL):1;
  const base=powerOf(t.u,attU,'def'),nz=noise?(.9+Math.random()*.2):1;
  if(P){P.base=base;P.dm=dm;P.tt=TYPES[t.type].def;P.f=f;P.cut=cut;P.nz=nz;P.fo=fo;}
  return base*dm*f*fo*nz;
}
/* ---- ordres tactiques ----
   Posture de l'armée (choisie au départ, modifiable tant qu'elle est en mer) :
   - Équilibrée : aucun changement.
   - Offensive : attaque ×1,15, mais 15 % de survivants en moins après une victoire.
   - Prudente : attaque ×0,95, 10 % de survivants en plus après une victoire ; si à l'arrivée l'attaque est inférieure à 80 % de la défense,
     l'armée renonce à l'assaut et rentre (10 % de pertes), sans combat.
   Repli : une armée en mer fait demi-tour (10 % de pertes) ; elle met autant de temps à revenir qu'elle en avait déjà mis à partir.
   Fortifier : une île à vous gagne ×1,25 en défense pendant 90 s (échelle du rythme), pour des Berrys ; non cumulable avec elle-même, perdue si l'île est conquise.
   Tous ces chiffres sont des choix d'équilibrage, pas des données de l'œuvre. */
const STANCE=[
 {n:'Équilibrée',ic:'⚖',a:1,k:1,t:'Aucun changement.'},
 {n:'Offensive',ic:'⚔',a:1.15,k:.85,t:'Attaque +15 %, mais 15 % de survivants en moins après une victoire.'},
 {n:'Prudente',ic:'🛡',a:.95,k:1.1,t:'Attaque −5 %, 10 % de survivants en plus après une victoire ; renonce à l\u2019assaut si l\u2019attaque est sous 80 % de la défense.'}];
const FORT_MUL=1.25,RETREAT_LOSS=.1,PRUD_ABORT=.8;
const modOf=p=>(p&&p.mod)||{};
const fortDur=p=>90*tkS()*(1+Math.min(1,modOf(p).fd||0));
const fortCost=(t,p)=>{p=p||players[t.owner];return Math.max(20,Math.round((40+tr(t)*2)*PK/6*(1-Math.min(.6,modOf(p).fc||0))));};
const fortMul=p=>FORT_MUL+Math.min(.5,modOf(p).fm||0);
const retLoss=pid=>RETREAT_LOSS*(1-Math.min(.9,modOf(players[pid]).rt||0));
let ARMN=0;
let huntPrimes=[0,0,0,0];
const curPrimes=()=>MODE==='client'&&NET.prime?NET.prime:players.map(p=>primeOf(p.id));
function huntTarget(o,pr){pr=pr||huntPrimes;let b=-1,bs=-1;for(const p of players){if(p.id===o||!p.alive)continue;const v=pr[p.id]||0;if(v>bs){bs=v;b=p.id;}}return b;}
const huntBonus=(o,t)=>{const h=CREWS[players[o].crew||0].hunt;return h&&(t.owner>=0&&t.owner===huntTarget(o))?h:0;};
const attTotal=(owner,u,t,noise,from,P,st)=>{
  const L=from===undefined?{atk:0,big:0}:ltOf(from);
  const base=powerOf(u,t.u,'atk'),hb=huntBonus(owner,t),lat=L.atk+(L.big&&tr(t)>=18?L.big:0);
  const mult=Math.max(.3,1+players[owner].mod.atk+hb+lat),nz=noise?(.9+Math.random()*.2):1;
  const sm=STANCE[st|0]?STANCE[st|0].a:1;
  if(P){P.base=base;P.mult=mult;P.hunt=hb;P.lat=lat;P.nz=nz;P.st=sm;}
  return base*mult*sm*nz;
};

/* ---- déchiffrage des Poneglyphes ----
   Un camp qui TIENT une île à Poneglyphe peut la déchiffrer (Berrys + savoir, ~80 s). Si l’île change de main avant la fin, le travail est perdu.
   Chaque Poneglyphe déchiffré (par camp, définitivement) : +6 % de savoir et −8 % de durée du projet « Expédition à Laugh Tale » (déjà lancé : inchangée).
   Mécanisme de jeu inventé ; il ne remplace pas la condition « tenir 2 Poneglyphes ». */
const DEC_COST={g:50,s:20};
const decDur=()=>80*tkS();
const decCost=()=>({g:Math.max(10,Math.round(DEC_COST.g*PK/6)),s:Math.max(5,Math.round(DEC_COST.s*PK/6))});
const pnm=p=>p.name==='Votre camp'?CREWS[p.crew||0].n:p.name;
function decReason(p,t){
  if(!t||!t.pone)return 'Cette île ne porte pas de Poneglyphe.';
  if(t.owner!==p.id)return 'Il faut tenir l’île.';
  if(p.x.dc.includes(t.id))return 'Déjà déchiffré.';
  if(p.x.dx)return 'Un déchiffrage est déjà en cours.';
  const c=decCost();
  if(p.gold<c.g)return 'Berrys insuffisants ('+c.g+' requis).';
  if(p.sci<c.s)return 'Savoir insuffisant ('+c.s+' requis).';
  return '';
}
function decStart(p,t){
  const r=decReason(p,t);if(r)return r;
  const c=decCost();p.gold-=c.g;p.sci-=c.s;p.x.dx={t:t.id,e:0};dirty=true;
  return '';
}
function decTick(){
  if(over)return;
  for(const p of players){
    if(!p.alive||!p.x||!p.x.dx)continue;
    const d=p.x.dx,t=terrs[d.t];
    if(!t||t.owner!==p.id){if(p.human)addLog('Déchiffrage interrompu : '+(t?t.name:'l’île')+' n’est plus à vous.','#8c97a6',p.id);p.x.dx=null;dirty=true;continue;}
    d.e+=1;
    if(d.e>=decDur()){
      p.x.dx=null;p.x.dc.push(t.id);p.sci+=Math.round(40*PK/6);stInc(p.id,'pz');recalc(p);dirty=true;
      addLog(pnm(p)+' déchiffre le Poneglyphe de '+t.name+' (+6 % de savoir, Expédition à Laugh Tale plus rapide).',p.color);
    }
  }
}
function aiDec(p){
  if(p.human||!p.x||p.x.dx)return;
  const c=decCost();
  const t=terrs.find(x=>x.pone&&x.owner===p.id&&!p.x.dc.includes(x.id));
  if(t&&p.gold>=c.g*2&&p.sci>=c.s*2)decStart(p,t);
}
function poneBon(t){
  let h='<div class="bn"><b>Poneglyphe de Route</b><small>Compte pour l’Expédition à Laugh Tale (onglet Âge). Déchiffré : +6 % de savoir et −8 % de durée pour ce projet.</small>';

  if(p&&p.x&&p.x.dc){

function msAssign(p,i){

/* ---- événements du monde ----
   Toutes les 85 à 155 s environ (×√(rythme/6)), un événement aléatoire éclate, 3 en même temps au plus, jamais deux fois le même type de suite.
   Chacun a une vraie conséquence sur la partie, visible de tous :
   - treasure : un coffre sur une île ; celui qui la tient à la fin du compte à rebours empoche les Berrys.
   - bounty : la prime d’un camp grimpe (le plus souvent le meneur en nombre de territoires) : la Marine et les chasseurs le visent plus facilement ; il touche aussi quelques Berrys de mécènes.
   - logpose : toutes les armées avancent 40 % moins vite.
   - seaking : un Roi des mers bloque une route : aucun départ possible, les armées déjà en mer perdent 25 %.
   - revolt : rumeur de révolte dans un village faiblement tenu d’un camp d’au moins 5 territoires : sans 14 soldats à temps, l’île devient indépendante.
   - legend : un lieutenant libre est recrutable à moitié prix pendant un moment.
   Durées, montants et seuils sont des choix d’équilibrage. */
const EVK={treasure:{n:'Trésor',col:'#f2c75c',w:3,d:70},bounty:{n:'Prime qui grimpe',col:'#ff8a70',w:2,d:90},logpose:{n:'Log Pose perturbé',col:'#8fd3ff',w:2,d:60},
  seaking:{n:'Roi des mers',col:'#5cc8b0',w:3,d:55},revolt:{n:'Rumeurs de révolte',col:'#ee6666',w:2,d:45},legend:{n:'Légendaire signalé',col:'#c58cf0',w:2,d:80}};
const EV_REVOLT_MIN=14,EV_BOUNTY=600,EV_LOGPOSE=.6,EV_SEA_LOSS=.75,EV_LEGEND=.5;
let EV=[],evNextAt=0,evSeq=0,evLastK='';
const evDur=k=>EVK[k].d*tkS();

const evSpd=()=>EV.some(e=>e.k==='logpose')?EV_LOGPOSE:1;

/* crée un événement du type demandé ; renvoie null si aucune cible convenable */
function evSpawn(k){
  const alive=players.filter(p=>p.alive);
  let e=null;
  const base=()=>({id:++evSeq,k,until:time+evDur(k),t:-1,a:-1,b:-1,p:-1,i:-1,amt:0});
  if(k==='treasure'){
    const c=terrs.filter(t=>!t.capital&&!bossAlive(t));
    if(!c.length)return null;
    e=base();e.t=evPick(c).id;e.amt=Math.round((90+Math.random()*60)*PK/6);
  }else if(k==='bounty'){
    if(alive.length<2)return null;
    const cnt=p=>terrs.filter(t=>t.owner===p.id).length;
    const lead=alive.slice().sort((a,b)=>cnt(b)-cnt(a))[0];
    const tg=Math.random()<.6?lead:evPick(alive);
    e=base();e.p=tg.id;e.amt=EV_BOUNTY;
    tg.gold+=Math.round(60*PK/6);
  }else if(k==='logpose'){
    e=base();
  }else if(k==='seaking'){
    const c=routes.filter(r=>(terrs[r[0]].owner>=0||terrs[r[1]].owner>=0)&&!routeBlocked(r[0],r[1]));
    if(!c.length)return null;
    const r=evPick(c);e=base();e.a=r[0];e.b=r[1];
    let n=0;
    for(const a of armies)if((a.from===e.a&&a.to===e.b)||(a.from===e.b&&a.to===e.a)){
      const b0=sumU(a.u);a.u=scaleU(a.u,EV_SEA_LOSS);n++;
      if(players[a.owner]&&players[a.owner].human)addLog('Le Roi des mers attaque l’armée de '+players[a.owner].name+' : −'+Math.round(b0-sumU(a.u))+' soldats.',players[a.owner].color,[a.owner]);
    }
  }else if(k==='revolt'){
    const cnt=p=>terrs.filter(t=>t.owner===p.id).length;
    const big=alive.filter(p=>cnt(p)>=5);
    if(!big.length)return null;
    const lead=big.slice().sort((a,b)=>cnt(b)-cnt(a))[0];
    const tg=Math.random()<.6?lead:evPick(big);
    const c=terrs.filter(t=>t.owner===tg.id&&!t.capital&&!t.city&&!t.fruit&&!t.pone&&t.boss===undefined&&tr(t)<EV_REVOLT_MIN&&!EV.some(z=>z.k==='revolt'&&z.t===t.id)).sort((a,b)=>tr(a)-tr(b));
    if(!c.length)return null;
    e=base();e.t=c[0].id;e.p=tg.id;
  }else if(k==='legend'){
    const c=[];for(let i=0;i<LEGENDS.length;i++)if(CH[i].own<0)c.push(i);
    if(!c.length)return null;
    e=base();e.i=evPick(c);
  }
  if(!e)return null;
  EV.push(e);evAnnounce(e);dirty=true;
  return e;
}
function evResolve(e){
  if(e.k==='treasure'){
    const t=terrs[e.t];
    if(t&&t.owner>=0){const p=players[t.owner];p.gold+=e.amt;stInc(t.owner,'tz');addLog('Le trésor de '+t.name+' revient à '+p.name+' : +'+e.amt+' ฿.',p.color);}
    else addLog('Le trésor de '+(t?t.name:'?')+' repart à la mer : personne ne tenait l’île.','#8c97a6');
  }else if(e.k==='revolt'){
    const t=terrs[e.t],p=players[e.p];
    if(t&&t.owner===e.p&&tr(t)<EV_REVOLT_MIN){
      t.owner=-1;t.u=emptyU();t.u.guerrier=8;t.spec=null;dirty=true;
      addLog('Révolte à '+t.name+' : l’île échappe à '+p.name+' et devient indépendante.','#ee6666');
    }else if(t&&t.owner===e.p)addLog('La révolte de '+t.name+' est étouffée : la garnison a tenu.',p.color);
  }
}
function evTick(){
  if(over)return;
  for(let i=EV.length-1;i>=0;i--){
    if(time>=EV[i].until){const e=EV.splice(i,1)[0];evResolve(e);dirty=true;}
  }
  if(time<evNextAt)return;
  if(EV.length>=3){evNextAt=time+20;return;}
  const ks=Object.keys(EVK).filter(k=>k!==evLastK&&!EV.some(e=>e.k===k&&(k==='logpose'||k==='legend'||k==='treasure')));
  const bag=[];for(const k of ks)for(let j=0;j<EVK[k].w;j++)bag.push(k);
  for(let tries=0;tries<6&&bag.length;tries++){
    const k=evPick(bag);
    if(evSpawn(k)){evLastK=k;break;}
    for(let j=bag.length-1;j>=0;j--)if(bag[j]===k)bag.splice(j,1);
  }
  evNextAt=time+(85+Math.random()*70)*tkS();
}

/* ================= Tours simultanés ================= */
/* Chaque tour : phase d'ordres (temps arrêté, tout le monde joue en même temps), puis résolution de TURN_LEN secondes où tout s'exécute.
   Les mouvements de troupes sont mis en file et partent ensemble au début de la résolution ; achats, technologies et diplomatie sont immédiats.
   L'IA, elle, joue pendant la résolution, comme en temps réel. */
const TURN_LEN=15,TQ_MAX=40;
let TM={on:false,phase:'plan',n:1,res:0,ready:[false,false,false,false],queue:[],planMax:0,planLeft:-1};
const tmPlan=()=>TM.on&&TM.phase==='plan';
const allReady=()=>players.every(p=>!p.human||!p.alive||TM.ready[p.id]);
function startRes(){
  try{rkAiTurn();}catch(_){}
  const q=TM.queue.slice();TM.queue=[];
  const rot=TM.n%4;
  q.sort((a,b)=>((a.s-rot+4)%4)-((b.s-rot+4)%4));
  for(const o of q){const p=players[o.s];if(p&&p.alive)launch(o.s,o.f,o.to,o.pct,o.st);}
  TM.phase='res';TM.res=TURN_LEN;TM.ready=[false,false,false,false];dirty=true;
}
function endRes(){
  TM.phase='plan';TM.n++;TM.ready=[false,false,false,false];TM.planLeft=TM.planMax>0?TM.planMax:-1;dirty=true;
}
function tmTick(dt){
  if(!TM.on||TM.phase!=='plan'||over||!started||MODE==='client')return;

function launchCheck(pid,from,to,pct){
  const f=terrs[from],t=terrs[to];
  if(f.owner!==pid||!f.nb.includes(to))return 'Ces territoires ne sont pas voisins.';
  const sk=routeBlocked(from,to);if(sk)return 'Un Roi des mers bloque cette route (encore '+Math.ceil(sk.until-time)+' s).';
  const o=t.owner;
  if(o>=0&&o!==pid&&!isWar(pid,o))return rel[pid][o]==='alliance'?players[o].name+' est votre allié.':'Vous êtes en paix avec '+players[o].name+' : déclarez-lui la guerre (onglet Diplo).';
  if(!takeUnits(f.u,pct))return 'Pas assez de troupes (il faut en laisser au moins une).';
  return '';
}
function queueOrder(seat,f,to,pct,st){
  const why=launchCheck(seat,f,to,pct);if(why)return why;
  const mine=TM.queue.filter(o=>o.s===seat);
  const dup=mine.find(o=>o.f===f&&o.to===to);
  if(dup){dup.pct=pct;dup.st=st|0;return '';}
  if(mine.length>=TQ_MAX)return 'Trop d\'ordres ce tour ('+TQ_MAX+' maximum).';
  TM.queue.push({s:seat,f,to,pct,st:st|0});return '';
}

/* ================= Actions ================= */
function takeUnits(u,pct){
  const take=emptyU();let tot=0;
  for(const k of UK){take[k]=Math.floor(u[k]*pct);tot+=take[k];}
  if(sumU(u)-tot<1){
    const kk=UK.reduce((a,b)=>take[b]>take[a]?b:a);
    if(take[kk]>0){take[kk]-=1;tot-=1;}
  }
  return tot>0?take:null;
}
function launch_o(pid,from,to,pct,st){
  const f=terrs[from],t=terrs[to];
  if(f.owner!==pid||!f.nb.includes(to))return 'Ces territoires ne sont pas voisins.';
  {const sk=routeBlocked(from,to);if(sk)return 'Un Roi des mers bloque cette route (encore '+Math.ceil(sk.until-time)+' s).';}
  const o=t.owner;
  if(o>=0&&o!==pid&&!isWar(pid,o)){
    return rel[pid][o]==='alliance'?players[o].name+' est votre allié.':'Vous êtes en paix avec '+players[o].name+' : déclarez-lui la guerre (onglet Diplo).';
  }
  const take=takeUnits(f.u,pct);
  if(!take)return 'Pas assez de troupes (il faut en laisser au moins une).';
  for(const k of UK)f.u[k]-=take[k];
  let sp=1e9;for(const k of UK)if(take[k]>0)sp=Math.min(sp,UNITS[k].spd);
  const d=Math.hypot(f.x-t.x,f.y-t.y);
  armies.push({id:++ARMN,owner:pid,from,to,u:take,t:0,dur:d/(48*sp*Math.max(.3,1+players[pid].mod.spd+ltOf(from).spd)),s:STANCE[st|0]?st|0:0,rt:0});
  stInc(pid,'la');
  return '';
}

function foundCity(p,t){

const wonderOwner=id=>{for(const t of terrs)if(t.city&&t.city.b.includes('w:'+id))return t.owner;return null;};

function buildReason(p,t,id,noGold){
  if(t.owner!==p.id||!t.city)return 'Ville requise.';

    if(c.b.includes(id))return 'Déjà construit ici.';

  return '';
}

/* ================= Diplomatie ================= */
const isWar=(a,b)=>rel[a][b]==='war';
/* ---- réputation (−100 à +100, publique) ----
   Elle bouge avec ce que fait un camp : déclarer la guerre à qui lui était ami (−10) ou simplement en paix (−3), rompre une alliance (−18) ;
   signer une paix (+3), un commerce (+2), une alliance (+5) ; faire un cadeau (+2). Elle revient lentement vers 0 avec le temps.
   Effets : les IA acceptent plus ou moins volontiers vos propositions (±0,4 point d’attitude par point de réputation),
   les accords coûtent 20 % de moins à partir de +40 et 50 % de plus à partir de −40, et l’attitude des autres camps dérive avec elle. */
/* ---- vassalité et ultimatum ----
   Vassalité : un camp (suzerain) exige qu'un autre devienne son vassal, en paix comme en guerre. Le vassal passe en paix avec lui et lui verse 20 % de ses Berrys bruts tant que dure le lien ;
   ni l'un ni l'autre ne peut être vassal ou suzerain d'un troisième à la fois (un camp a au plus un suzerain). L'IA accepte seulement si elle est écrasée (en guerre : le suzerain a ≥ 2,2× sa force ; en paix : ≥ 3× et opinion > −30).
   Le lien cesse : si le vassal déclare la guerre à son suzerain (rébellion), si le suzerain le libère, ou si l'un des deux est éliminé. L'IA vassale se rebelle quand sa force remonte à 90 % de celle du suzerain, au bout d'au moins 120 s.
   Ultimatum : en paix, un camp exige 60 ฿ (à l'échelle du rythme). Accepté : l'argent change de mains, l'opinion de la cible baisse de 15 et la réputation de l'auteur de 4. Refusé : la guerre est déclarée (sauf trêve en cours). L'IA accepte si l'auteur a ≥ 1,6× sa force et si elle a l'argent.
   Tous ces chiffres sont des choix d'équilibrage, pas des données de l'œuvre. */
const TRIB=.2,ULT_BASE=60,VAS_RS_WAR=2.2,VAS_RS_PEACE=3,ULT_RS=1.6;
const ultAmt=()=>Math.max(20,Math.round(ULT_BASE*PK/6));
const REP_DECAY=.03;
const repLabel=r=>r>=40?'Honorable':r>=15?'Digne de confiance':r>-15?'Neutre':r>-40?'Peu fiable':'Traître';
const repOf=id=>{const p=players[id];return p&&p.x?(p.x.rep||0):0;};
function repMove(pid,d,why){
  const p=players[pid];if(!p||!p.x)return;
  p.x.rep=clamp((p.x.rep||0)+d,-100,100);
  if(d<=-3&&why){const hs=players.filter(h=>h.human).map(h=>h.id);if(hs.length)addLog('Réputation de '+(p.name==='Votre camp'?CREWS[p.crew||0].n:p.name)+' : '+d+' ('+why+').','#d98c5f',hs);}
}
function repTick(){
  if(over)return;
  for(const p of players){
    if(!p.x||!p.alive||!p.x.rep)continue;
    const st=REP_DECAY/tkS();p.x.rep=Math.abs(p.x.rep)<=st?0:p.x.rep-Math.sign(p.x.rep)*st;
  }
}
const dealCost=(p,kind)=>{const r=p&&p.x?(p.x.rep||0):0;return Math.max(1,Math.round(DEAL_COST[kind]*(r>=40?.8:r<=-40?1.5:1)));};
function setRel(a,b,v){rel[a][b]=rel[b][a]=v;}
function setTrade(a,b,v){tradeM[a][b]=tradeM[b][a]=v;}
function strength(id){
  let s=0;
  for(const t of terrs)if(t.owner===id)s+=tr(t)+3;
  for(const a of armies)if(a.owner===id)s+=sumU(a.u);
  return s;
}
function declareWar(a,b){
  if(a===b||!players[a].alive||!players[b].alive||isWar(a,b)||time<truce[a][b])return false;
  const wasAlly=rel[a][b]==='alliance',o0=opin[b][a];
  if(vas[a]===b){vas[a]=-1;addLog('Rébellion : '+pnm(players[a])+' se libère de '+pnm(players[b])+'.',players[a].color);}
  else if(vas[b]===a){vas[b]=-1;addLog(pnm(players[a])+' rompt la vassalité de '+pnm(players[b])+' et lui déclare la guerre.',players[a].color);}
  setRel(a,b,'war');setTrade(a,b,false);
  warSince[a][b]=warSince[b][a]=time;
  repMove(a,o0>20?-10:o0>-10?-3:0,o0>20?'guerre déclarée à '+players[b].name+', qui le tenait pour ami':'guerre déclarée à '+players[b].name);
  if(opin[b][a]>-10){players[a].x.ws=Math.max(0,players[a].x.ws-12);players[b].x.ws=Math.min(100,players[b].x.ws+12);}
  opin[b][a]=Math.max(-100,opin[b][a]-40);
  addLog(players[a].name+' déclare la guerre à '+players[b].name,players[a].color);
  for(const c of players){
    if(!c.alive||c.id===a||c.id===b)continue;
    const withB=rel[c.id][b]==='alliance',withA=rel[c.id][a]==='alliance';
    if(withB&&withA){setRel(c.id,a,'peace');}
    else if(withB&&!isWar(c.id,a)){setRel(c.id,a,'war');setTrade(c.id,a,false);warSince[c.id][a]=warSince[a][c.id]=time;addLog(c.name+' rejoint la guerre contre '+players[a].name,c.color);}
  }
  return true;
}
function vassalFree(seat,q){
  if(!players[q]||vas[q]!==seat)return 'Ce camp n\u2019est pas votre vassal.';
  vas[q]=-1;opin[q][seat]=Math.min(100,opin[q][seat]+15);repMove(seat,2);
  addLog(pnm(players[seat])+' libère '+pnm(players[q])+' de sa vassalité.',players[seat].color);
  return '';
}
function ultimatumPay(a,b){
  const amt=ultAmt(),P=players[b];
  P.gold-=amt;players[a].gold+=amt;
  opin[b][a]=Math.max(-100,opin[b][a]-15);repMove(a,-4,'ultimatum à '+pnm(P));
  addLog(pnm(P)+' cède à l\u2019ultimatum de '+pnm(players[a])+' ('+amt+' ฿).',players[a].color);
}
function applyDeal(kind,a,b){
  if(kind==='vassal'){
    if(rel[a][b]==='war'){setRel(a,b,'peace');truce[a][b]=truce[b][a]=time+60*PK;}
    vas[b]=a;vasSince[b]=time;opin[b][a]=Math.max(-100,opin[b][a]-10);
    addLog(pnm(players[b])+' devient vassal de '+pnm(players[a])+' ('+Math.round(TRIB*100)+' % de ses Berrys).',players[a].color);
    return;
  }
  if(kind==='ultim'){ultimatumPay(a,b);return;}
  if(kind==='peace'){setRel(a,b,'peace');truce[a][b]=truce[b][a]=time+60*PK;addLog(players[a].name+' et '+players[b].name+' signent la paix','#5fb3e6');}
  else if(kind==='alliance'){setRel(a,b,'alliance');addLog('Alliance entre '+players[a].name+' et '+players[b].name,'#4cc38a');}
  else if(kind==='trade'){setTrade(a,b,true);{const hs=[a,b].filter(x=>players[x].human);if(hs.length)addLog('Accord commercial : '+players[a].name+' et '+players[b].name,'#e0a43c',hs);}}
  opin[a][b]=Math.min(100,opin[a][b]+8);opin[b][a]=Math.min(100,opin[b][a]+8);
  {const g=kind==='alliance'?5:kind==='peace'?3:2;repMove(a,g);repMove(b,g);}
}
function breakAlliance(a,b){
  setRel(a,b,'peace');truce[a][b]=truce[b][a]=time+30*PK;
  opin[b][a]=Math.max(-100,opin[b][a]-30);
  repMove(a,-18,'rupture de l’alliance avec '+players[b].name);
  addLog(players[a].name+' rompt son alliance avec '+players[b].name,players[a].color);
}
function aiAccepts(q,p,kind){
  const o=opin[q][p]+repOf(p)*.4,rs=strength(p)/Math.max(1,strength(q));
  if(kind==='vassal')return rel[q][p]==='war'?rs>=VAS_RS_WAR:(rs>=VAS_RS_PEACE&&opin[q][p]>-30);
  if(kind==='ultim')return rs>=ULT_RS&&players[q].gold>=ultAmt();
  if(kind==='peace'&&rkCoalNoPeace(q,p))return false;
  if(kind==='peace'&&rkCoalPair(q,p))return true;
  if(kind==='alliance'&&rkCoalPair(q,p)&&rel[q][p]==='peace')return true;
  if(kind==='peace')return o+(rs-1)*35>-10||strength(q)<.6*strength(p);
  if(kind==='alliance')return o>30&&rel[q][p]==='peace';
  if(kind==='trade')return o>-5;
  return false;
}
function validDeal(kind,a,b){
  const r=rel[a][b];
  if(kind==='peace')return r==='war';
  if(kind==='alliance')return r==='peace';
  if(kind==='trade')return r!=='war'&&!tradeM[a][b];
  if(kind==='vassal')return (r==='peace'||r==='war')&&vas[a]<0&&vas[b]<0&&players[a].alive&&players[b].alive;
  if(kind==='ultim')return r==='peace'&&players[a].alive&&players[b].alive;
  return false;
}
function propose(a,b,kind){
  if(!validDeal(kind,a,b)||!players[b].alive)return;
  if(!payDeal(a,kind))return;
  if(players[b].human){
    if(!proposals.some(x=>x.from===a&&x.to===b&&x.kind===kind))proposals.push({from:a,to:b,kind,t:time});
  }else if(aiAccepts(b,a,kind))applyDeal(kind,a,b);
}
function humanPropose(a,kind,q){
  const P=players[q],me=players[a];
  if(!P||!P.alive||q===a)return 'Cible invalide.';
  if(kind==='trade'&&!me.techs.commerce)return 'Technologie requise : Commerce.';
  if(!validDeal(kind,a,q))return kind==='peace'?'Vous n\'êtes pas en guerre.':kind==='alliance'?'Il faut être en paix pour s\'allier.':kind==='vassal'?'Vassalité impossible : l\'un de vous est déjà vassal ou a un vassal lié à l\'autre, ou une alliance est en cours.':kind==='ultim'?'Un ultimatum n\'est possible qu\'entre camps en paix.':'Accord impossible ou déjà signé.';
  const dc=dealCost(me,kind);
  if(me.x.inf<dc)return 'Influence insuffisante ('+dc+' requis).';
  me.x.inf-=dc;
  if(P.human){
    if(!proposals.some(x=>x.from===a&&x.to===q&&x.kind===kind))proposals.push({from:a,to:q,kind,t:time});
    return 'Proposition envoyée à '+P.name+'.';
  }
  if(aiAccepts(q,a,kind)){applyDeal(kind,a,q);return '';}
  opin[q][a]=Math.max(-100,opin[q][a]-2);
  if(kind==='ultim'){
    const w=declareWar(a,q);
    return P.name+' refuse l\u2019ultimatum'+(w?' : la guerre est déclarée.':' (une trêve empêche la guerre).');
  }
  return P.name+' refuse votre proposition.';
}
function humanWar(a,q){
  if(!players[q]||!players[q].alive||q===a)return 'Cible invalide.';
  if(rel[a][q]==='alliance')return 'Rompez d\'abord l\'alliance.';
  if(time<truce[a][q])return 'Trêve en cours : encore '+Math.ceil(truce[a][q]-time)+' s.';
  declareWar(a,q);return '';
}
function vasTick(){
  for(let v=0;v<4;v++){
    const m=vas[v];if(m<0)continue;
    if(!players[v].alive||!players[m].alive){vas[v]=-1;addLog('La vassalité de '+pnm(players[v])+' envers '+pnm(players[m])+' prend fin.','#8c97a6');}
  }
}
function driftOpinions(){
  for(let a=0;a<4;a++)for(let b=0;b<4;b++){
    if(a===b)continue;
    const r=rel[a][b],o=opin[a][b];
    let d=0;
    if(r==='alliance')d=.3;
    else if(r==='peace'){if(o<30)d=.06;else if(o>45)d=-.05;}
    else d=-.4;
    if(tradeM[a][b]&&o<60)d+=.1;
    d+=repOf(b)*.002;
    opin[a][b]=clamp(o+d/PK,-100,100);
  }
  proposals=proposals.filter(x=>{
    if(time-x.t>45||!players[x.to].alive||!validDeal(x.kind,x.from,x.to)){opin[x.from][x.to]=Math.max(-100,opin[x.from][x.to]-1);return false;}
    return true;
  });
}
function acceptProposal(seat,key){
  const [f,kind]=key.split(':');
  const x=proposals.find(p=>p.from===+f&&p.to===seat&&p.kind===kind);
  if(!x)return '';
  if(kind==='ultim'&&players[seat].gold<ultAmt())return 'Berrys insuffisants ('+ultAmt()+' ฿ requis) : refusez ou attendez.';
  proposals=proposals.filter(p=>p!==x);
  if(!validDeal(kind,x.from,seat))return 'Cette proposition n\'est plus valable.';
  applyDeal(kind,x.from,seat);return '';
}
function refuseProposal(seat,key){
  const [f,kind]=key.split(':');
  proposals=proposals.filter(p=>!(p.from===+f&&p.to===seat&&p.kind===kind));
  if(players[+f])opin[+f][seat]=Math.max(-100,opin[+f][seat]-3);
  if(kind==='ultim'&&players[+f]&&rel[+f][seat]==='peace')declareWar(+f,seat);
  return '';
}
function giftGold(seat,q){
  const me=players[seat];
  if(!players[q]||!players[q].alive||q===seat)return 'Cible invalide.';
  if(me.gold<25)return 'Berrys insuffisants (25 requis).';
  me.gold-=25;opin[q][seat]=Math.min(100,opin[q][seat]+10);repMove(seat,2);
  if(players[q].human)players[q].gold+=25;
  return 'Cadeau offert à '+players[q].name+'.';
}

const fmtPrime=n=>(Math.round(n)*10000).toLocaleString('fr-FR')+' ฿';
function primeOf(id){
  let s=0;
  for(const t of terrs)if(t.owner===id){s+=100;if(t.city)s+=100*t.city.lvl;if(t.capital)s+=100;if(t.fruit)s+=300;if(t.pone)s+=300;}

/* Toutes les ~110 s la Marine frappe le camp à la plus grosse prime s'il domine nettement : cela freine l'emballement. */
function marineTick(){

  const arr=players.filter(p=>p.alive).map(p=>({p,s:primeOf(p.id)})).sort((a,b)=>b.s-a.s);
  const clear=arr.length>=2&&arr[0].s>=1.3*arr[1].s&&arr[0].s>=900;

    if(!marineWarned&&clear){marineWarned=true;marineTarget=arr[0].p.id;addLog('Le Journal publie l\'avis de recherche de '+arr[0].p.name+' : prime '+fmtPrime(arr[0].s)+'. La Marine prépare un Buster Call.','#9ec5ff');}

  }
  if(marineWarned&&players[marineTarget]&&players[marineTarget].alive){
    const mine=terrs.filter(t=>t.owner===marineTarget&&!t.capital).sort((a,b)=>tr(b)-tr(a));

}

/* ================= Boucle de simulation ================= */
function step(dt){
  if(TM.on&&TM.phase==='plan')return;
  if(AG.trn)return;
  time+=dt;
  for(const p of players)if(p.alive)recalc(p);
  for(const p of players){
    if(!p.alive)continue;
    const r=income(p);p.rate=r;
    p.gold=Math.max(0,p.gold+r.g*dt);p.sci+=r.s*dt;p.faith+=r.f*dt;p.x.inf+=r.i*dt;
    p.x.me[1]+=Math.max(0,r.g)*dt;p.x.me[2]+=r.s*dt;p.x.me[3]+=r.f*dt;
  }
  for(const t of terrs){
    if(t.owner<0)continue;
    const p=players[t.owner],cap=30+p.mod.cap;
    let reg=.05+(t.capital?.15:0);
    if(t.city&&t.city.b.includes('caserne'))reg+=.2;
    if(t.spec==='r'&&!t.city)reg+=.18;
    if(tr(t)<cap)t.u.guerrier+=reg*(1+p.mod.regen)*dt/PK;
    if(t.city&&t.city.q){
      const q=t.city.q;q.t+=dt;
      if(q.t>=q.dur){
        t.city.b.push(q.id);t.city.q=null;stInc(p.id,'bd');
        const d=defOfBuild(q.id);
        if(q.id.startsWith('w:')){p.x.me[3]+=40;addLog(p.name+' achève un lieu légendaire : '+d.n,p.color);}
        else if(p.human)addLog('Construction terminée : '+d.n+' à '+t.name,p.color,p.id);
      }
    }
  }
  for(let i=armies.length-1;i>=0;i--){
    const a=armies[i];a.t+=dt*evSpd();
    if(a.t>=a.dur){armies.splice(i,1);resolveArrival(a);}
  }
  for(const c of CH)if(c.cd>0)c.cd=Math.max(0,c.cd-dt);
  secAcc+=dt;
  if(secAcc>=1){secAcc-=1;huntPrimes=players.map(p=>primeOf(p.id));driftOpinions();marineTick();bossTick();evTick();repTick();decTick();vasTick();msTick();campTick();achCheck();chTick();agSecond();}
  if(AG.trn)return;
  for(const p of players){
    if(!p.alive||p.human||TM.on)continue;
    p.ai.t-=dt;
    if(p.ai.t<=0){aiThink(p);p.ai.t=DIFF[diffKey].think*PK*(.7+Math.random()*.6);}
  }
  checkEnd(dt);
  if(TM.on&&TM.phase==='res'&&!over){TM.res-=dt;if(TM.res<=1e-9)endRes();}
}
function checkEnd(dt){
  if(over)return;
  const counts=players.map(()=>0);
  for(const t of terrs)if(t.owner>=0)counts[t.owner]++;
  for(const p of players){
    if(!p.alive)continue;
    if(counts[p.id]===0&&!armies.some(a=>a.owner===p.id)){
      p.alive=false;AG.prog=Math.min(100,AG.prog+4);addLog(p.name+' est éliminé',p.color);
      for(let q=0;q<4;q++){if(q!==p.id){setRel(p.id,q,'war');setTrade(p.id,q,false);}}
      proposals=proposals.filter(x=>x.from!==p.id&&x.to!==p.id);
    }
  }
  const alive=players.filter(p=>p.alive);
  const fin=(winners,text)=>{over={winners,text};showEnd();};
  if(!players.some(p=>p.human&&p.alive)){fin([],MODE==='solo'?'Votre camp est tombé.':'Plus aucun camp humain n\'est en vie.');return;}
  if(alive.length===1){fin([alive[0].id],MODE==='solo'?'Tous vos rivaux sont éliminés.':alive[0].name+' est le dernier camp en mer.');return;}
  {
    /* domination par vassalité : tous les autres camps vivants sont vassaux du même suzerain depuis 30 s de rythme (le temps d'une rébellion) */
    const dom=alive.length>=2?alive.find(a=>alive.every(b=>b.id===a.id||vas[b.id]===a.id)):null;
    if(dom){vasDomT+=dt;if(vasDomT>=30*PK){fin([dom.id],MODE==='solo'?(dom.id===ME?'Tous vos rivaux sont éliminés ou soumis.':'Un rival a soumis tous les autres camps.'):dom.name+' a soumis tous les autres camps.');return;}}
    else vasDomT=0;
  }
  if(AG.n>=2&&alive.length>=2&&alive.every(a=>alive.every(b=>a.id===b.id||rel[a.id][b.id]==='alliance'))){
    fin(alive.map(p=>p.id),'Tous les camps encore en vie sont alliés : victoire commune.');
  }
}

function aiDiplo(p){

  /* une IA ne déclare pas une nouvelle guerre tant qu'elle en mène déjà une */
  const busy=players.some(q=>q.alive&&q.id!==p.id&&rel[p.id][q.id]==='war');
  for(const q of players){
    if(!q.alive||q.id===p.id)continue;

    if(r==='war'&&vas[p.id]<0&&vas[q.id]<0&&time>=warSince[p.id][q.id]+40*PK&&myS>=VAS_RS_WAR*1.1*qS&&Math.random()<.12){propose(p.id,q.id,'vassal');continue;}
    if(r==='war'){

      if(time>=warSince[p.id][q.id]+60*PK&&(myS<.75*qS||Math.random()<.015)&&!rkCoalNoPeace(p.id,q.id))propose(p.id,q.id,'peace');
    }else if(r==='peace'){

      const need=(!neutralAdj&&time>180*PK?.95:1.25)/p.ai.aggr;
      const wantWar=!busy&&adjacent&&time>=truce[p.id][q.id]&&time>rkPeaceT(q.id)&&(!neutralAdj||time>300*PK)&&myS>qS*need&&(o<60||(time>300*PK&&myS>qS*1.6));
      if(wantWar&&Math.random()<.3){declareWar(p.id,q.id);continue;}
      if(!tradeM[p.id][q.id]&&p.techs.commerce&&o>10)propose(p.id,q.id,'trade');
      else if(o>45&&sharedEnemy(p.id,q.id))propose(p.id,q.id,'alliance');

function pickUnit(p,t){

function aiWant(p){const w=new Set(),cid=CREWS[p.crew||0].id;for(let i=0;i<LEGENDS.length;i++){const L=LEGENDS[i];if(CH[i].own>=0||!L.camps.includes(cid))continue;for(const n of L.rec.isl||[])w.add(n);}return w;}

/* l'IA utilise les mêmes ordres que le joueur : repli si la défense s'est renforcée, fortification quand une attaque la menace de justesse */
function aiTactics(p){

function aiThink(p){
  const m=p.mod;
  aiAge(p);
  aiTactics(p);
  const avail=TECHS.filter(t=>!p.techs[t.id]&&t.era<=AG.n+1&&t.req.every(r=>p.techs[r])).sort((a,b)=>p.ai.pref.indexOf(a.br)-p.ai.pref.indexOf(b.br)||a.era-b.era||a.cost-b.cost);

    if(p.faith>=FOUND_COST){const pr=RELS.find(r=>r.br===p.ai.pref[0])||RELS[0];foundReligion(p,pr.id);}
  }else if(!p.ferveur&&p.ai.wantFerv){
    if(p.faith>=FERV_COST)buyFerveur(p);
  }else{
    let bestT=null,bestC=1e9;
    for(const t of terrs){
      if(convertReason(p,t))continue;

    }
    if(bestT)convert(p,bestT);
  }
  aiDiplo(p);aiChars(p);aiDec(p);
  const mine=terrs.filter(t=>t.owner===p.id);
  if(!mine.length)return;
  const cities=mine.filter(t=>t.city);
  /* économie : on choisit un achat visé, on épargne pour lui, sauf si l'empire est menacé */
  const threat=mine.some(t=>t.nb.some(n=>terrs[n].owner>=0&&isWar(p.id,terrs[n].owner)));
  let want=null;
  for(const t of cities){
    if(want)break;

      for(const id of AIB){
        if(buildReason(p,t,id,true)===''){want={cost:BUILDINGS[id].cost+10,fn:()=>startBuild(p,t,id)};break;}
      }
    }
  }
  if(!want&&cities.length<2+Math.floor(time/110)){
    const cand=mine.filter(t=>!t.city&&t.u.guerrier>=CITY_UNITS+2).sort((a,b)=>(b.type==='plaine'?1:0)-(a.type==='plaine'?1:0)||tr(b)-tr(a));

  }
  if(!want&&p.ai.wonder){
    for(const w of WONDERS){
      if(want)break;
      for(const t of cities){
        if(buildReason(p,t,'w:'+w.id,true)===''){want={cost:w.cost+30,fn:()=>startBuild(p,t,'w:'+w.id)};break;}
      }
    }
  }
  if(!want){
    const up=cities.find(t=>t.city.lvl<3);
    if(up)want={cost:CITY_UP*up.city.lvl+50,fn:()=>upgradeCity(p,up)};
  }
  if(want&&p.gold>=want.cost){want.fn();want=null;}
  const totalUnits=mine.reduce((s,t)=>s+tr(t),0);
  const saving=!!want&&!threat&&p.gold<want.cost*1.6;
  const overArmed=!threat&&totalUnits>14*mine.length+20;
  /* fronts */
  const isFront=t=>t.nb.some(n=>canHit(p,terrs[n]));
  const fronts=mine.filter(isFront);
  let guard=0;
  while(guard++<2&&mine.length&&!saving&&!overArmed){
    let pick=null,ps=-1e9;
    for(const t of fronts){
      const warAdj=t.nb.some(n=>terrs[n].owner>=0&&isWar(p.id,terrs[n].owner));
      const sc=(warAdj?12:0)-tr(t);

    }
    if(!pick)pick=cities.find(t=>t.capital)||mine[0];

  }

  const dist=new Map(),q=[];
  for(const t of fronts){dist.set(t.id,0);q.push(t.id);}

    const c=q.shift();
    for(const n of terrs[c].nb)if(terrs[n].owner===p.id&&!dist.has(n)){dist.set(n,dist.get(c)+1);q.push(n);}
  }
  for(const t of shuffle(mine)){
    const total=tr(t);
    if(total<4)continue;
    const foes=t.nb.map(i=>terrs[i]).filter(x=>canHit(p,x));
    if(!foes.length){
      if(!dist.has(t.id))continue;
      let nxt=-1,nd=dist.get(t.id);

      if(nxt>=0)launch(p.id,t.id,nxt,1);
      continue;
    }
    const hasWar=foes.some(x=>x.owner>=0);
    const reserve=hasWar?Math.max(2,Math.ceil(total*.2)):1;
    const frac=clamp((total-reserve)/total,0,1);
    if(frac<=0||total*frac<3)continue;
    const avU=scaleU(t.u,frac);
    let best=null,bestScore=-1,bestRatio=0,bestRaw=0;
    const want=aiWant(p);
    for(const x of foes){
      const A=attTotal(p.id,avU,x,false,t.id),D=defTotal(x,avU,false);
      const ratio=A/(D+.5);
      const thr=(x.owner<0?(mine.length<5?1.15:1.3):1.5)*(x.fruit||x.pone?.85:1)/p.ai.aggr*(rkCoalFocus(p,x)?.85:1);
      if(ratio>=thr){
        const sc=ratio*(rkCoalFocus(p,x)?1.6:1)*(evTreasureAt(x.id)?1.5:1)*(x.owner<0?1.2:1)*(x.capital?1.8:1)*(x.fruit||x.pone?1.4:1)*(ISLE_FX[x.name]?1.15:1)*(want.has(x.name)?1.35:1)*regScore(p,x);

      }

    if(best){
      const f=clamp(frac*(1.25/bestRatio),.3,frac);
      const rs=bestRaw*f/frac;
      launch(p.id,t.id,best.id,f,rs<1.7?1:rs>=2.4?2:0);
    }else{
      let tgt=null;
      for(const n of t.nb){const o=terrs[n];if(o.owner===p.id&&tr(o)>total&&(!tgt||tr(o)>tr(tgt)))tgt=o;}
      if(tgt&&total*frac>=4)launch(p.id,t.id,tgt.id,frac);
    }
  }
}

/* production réelle d'un territoire : mêmes formules que income(), par seconde de jeu */
function tProd(t,p){
  const y=TYPES[t.type];let gg=y.g,ss=y.s,ff=y.f;
  if(t.spec&&!t.city){if(t.spec==='g')gg=gg*1.8+.18;else if(t.spec==='s')ss=ss*1.8+.22;else if(t.spec==='f')ff=ff*1.8+.18;}
  if(t.city){gg+=.25;ss+=.1;ff+=.05;}
  if(t.capital){gg+=.8;ss+=.6;ff+=.4;}
  if(t.city){
    const lm=1+.35*(t.city.lvl-1);gg*=lm;ss*=lm;ff*=lm;
    for(const b of t.city.b){const bi=BLD_INCOME[b];if(bi){gg+=bi.g||0;ss+=bi.s||0;ff+=bi.f||0;}}
  }
  const m=p.mod,Z=1/PK,tb=Math.min(.2,tradePartners(p.id)*.1);
  return {g:gg*(1+m.gold+tb)*p.inc*Z,s:ss*(1+m.sci)*p.inc*Z,f:ff*(1+m.faith)*p.inc*Z};
}
/* effet affiché d'un bâtiment : pour les bâtiments de revenu, la valeur réelle au rythme de la partie */
function bDesc(id,p){
  const bi=BLD_INCOME[id];
  if(!bi)return BUILDINGS[id].d;
  const m=p.mod,Z=1/PK;
  const o=[];
  if(bi.g)o.push('+'+f2(bi.g*(1+m.gold)*p.inc*Z*TLEN())+' ฿/'+TUN());
  if(bi.s)o.push('+'+f2(bi.s*(1+m.sci)*p.inc*Z*TLEN())+' savoir/'+TUN());
  if(bi.f)o.push('+'+f2(bi.f*(1+m.faith)*p.inc*Z*TLEN())+' Volonté/'+TUN());
  return o.join(', ')+(BUILDINGS[id].rel?'. Une Voie est requise.':'.');
}
/* une ligne de bâtiment : icône, effet, coût / durée / prérequis (vert = rempli, rouge = manquant), bouton */
function bRow(p,t,id,kind){
  const wonder=kind==='w',def=wonder?WONDER[id]:BUILDINGS[id],key=wonder?'w:'+id:id;

  const desc=wonder?def.d:bDesc(id,p);
  const locked=noGold&&(noGold.startsWith('Techno')||noGold.startsWith('Une Voie'));
  const flash=ui.flash&&ui.flash.key===key&&performance.now()<ui.flash.until?' flash':'';
  return '<div class="br'+(locked?' locked':'')+flash+'" title="'+esc(def.n+' — '+desc+(why&&!why.startsWith('Berrys')?' ('+why+')':''))+'">'
    +'<span class="bi-w">'+bico(wonder?'wonder':id)+'</span>'
    +'<div class="bt"><b>'+esc(def.n)+'</b><small>'+esc(desc)+'</small><div class="chs">'+chips.join('')+'</div></div>'
    +btn('build',key,'Construire',!!why)+'</div>';
}

const EVQ=[];let evBusy=false;
function worldEvent(text,color){
  try{sndBanner(text);}catch(_){}
  const m=/avis de recherche de (.+?) : prime (.+?)\./.exec(text);
  if(m)EVQ.push({k:'poster',n:m[1],p:m[2],col:color});
  else if(/^Événement : (.+?) — /.test(text)){const mm=/^Événement : (.+?) — (.*)$/.exec(text);EVQ.push({k:'ban',t:mm[1],s:mm[2].slice(0,140),col:color});}
  else if(/^Mission accomplie|^Succès débloqué/.test(text))EVQ.push({k:'ban',t:/^Mission/.test(text)?'Mission accomplie':'Succès débloqué',s:text.replace(/^[^:]+ : /,'').slice(0,140),col:'#f2c75c'});
  else if(/^Buster Call/.test(text))EVQ.push({k:'ban',t:'Buster Call',s:text,col:'#ff7a6a'});
  else if(/^Un nouvel âge commence/.test(text))EVQ.push({k:'ban',t:'Nouvel âge',s:text.replace('Un nouvel âge commence : ',''),col:'#f2c75c'});
  else if(/^Le complot|^Buster Call général/.test(text))EVQ.push({k:'ban',t:'Crise',s:text,col:'#ff7a6a'});
  if(EVQ.length>4)EVQ.shift();
  evNext();
}
function evNext(){
  if(evBusy||!EVQ.length)return;
  const el=document.getElementById('evt');if(!el)return;
  const e=EVQ.shift();evBusy=true;
  if(e.k==='poster'){
    const pl=players.find(x=>x.name===e.n),ic=pl?CREWS[pl.crew||0].ic:'☠';
    el.className='evt poster';
    el.innerHTML='<div class="wp"><div class="wt">Wanted</div><div class="wi" style="color:'+(pl?pl.color:'#3a2a1a')+'">'+ic+'</div><div class="wn">'+esc(e.n)+'</div><div class="wd">Prime</div><div class="wb">'+esc(e.p)+'</div></div>';
  }else{
    el.className='evt ban';el.style.setProperty('--c',e.col);
    el.innerHTML='<b>'+esc(e.t)+'</b><span>'+esc(e.s)+'</span>';
  }
  el.hidden=false;
  setTimeout(()=>{el.hidden=true;evBusy=false;setTimeout(evNext,350);},e.k==='poster'?5200:3600);
}

/* ================= Interactions sur la carte ================= */
function pos(e){const r=canvas.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;return {x:V.x+fx*W/V.k,y:V.y+fy*H/V.k,sx:e.clientX-r.left,sy:e.clientY-r.top};}
function clampV(){V.k=clamp(V.k,1,3.5);V.x=clamp(V.x,0,W-W/V.k);V.y=clamp(V.y,0,H-H/V.k);}
function zoomAt(fx,fy,f){const wx=V.x+fx*W/V.k,wy=V.y+fy*H/V.k;V.k=clamp(V.k*f,1,3.5);V.x=wx-fx*W/V.k;V.y=wy-fy*H/V.k;clampV();}
function centerOn(id){const t=terrs[id];if(!t||V.k<=1)return;V.x=t.x-W/V.k/2;V.y=t.y-H/V.k/2;clampV();}
function terrAt(x,y){
  const gx=Math.floor(x/CELL),gy=Math.floor(y/CELL);
  if(gx<0||gy<0||gx>=GW||gy>=GH)return -1;
  const id=grid[gy*GW+gx];
  if(id>=0)return id;
  /* îles petites : on accepte un toucher à côté (marge de 22 unités, plus large que l'île sur téléphone) */
  let best=-1,bd=1e9;
  for(const t of terrs){const d=Math.hypot(x-t.x,y-t.y)-t.rad;if(d<22&&d<bd){bd=d;best=t.id;}}
  return best;
}

canvas.addEventListener('pointermove',e=>{
  if(!grid)return;
  if(ptsMap.has(e.pointerId))ptsMap.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptsMap.size>=2){
    const [a,b]=[...ptsMap.values()],r=canvas.getBoundingClientRect();
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    zoomAt((cx-r.left)/r.width,(cy-r.top)/r.height,d/pinch.d);
    V.x-=(cx-pinch.cx)/r.width*W/V.k;V.y-=(cy-pinch.cy)/r.height*H/V.k;clampV();
    pinch.d=d;pinch.cx=cx;pinch.cy=cy;return;
  }
  const p=pos(e);ptr=p;
  const id=terrAt(p.x,p.y);
  if(id!==ui.hover){ui.hover=id;dirty=true;}
  if(drag){
    if(Math.hypot(p.sx-drag.sx,p.sy-drag.sy)>8)drag.moved=true;
    if(drag.moved&&drag.pan){const r=canvas.getBoundingClientRect();V.x=drag.vx-(p.sx-drag.sx)/r.width*W/V.k;V.y=drag.vy-(p.sy-drag.sy)/r.height*H/V.k;clampV();}
  }
});
canvas.addEventListener('pointerleave',()=>{if(ui.hover!==-1){ui.hover=-1;dirty=true;}});
canvas.addEventListener('pointercancel',e=>{ptsMap.delete(e.pointerId);drag=null;if(ptsMap.size<2)pinch=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,Math.exp(-e.deltaY*.0016));},{passive:false});
canvas.addEventListener('pointerup',e=>{
  ptsMap.delete(e.pointerId);
  if(pinch){if(ptsMap.size<2)pinch=null;drag=null;return;}
  if(!drag)return;
  const p=pos(e),to=terrAt(p.x,p.y),from=drag.id,moved=drag.moved,pan=drag.pan;
  drag=null;
  if(!started||over)return;
  if(moved&&pan)return;
  if(ui.mode==='convert'){
    if(to>=0)cmd({k:'conv',to});
    renderPanel(true);return;
  }
  if(moved&&from>=0&&to>=0&&from!==to&&terrs[from].owner===ME){
    cmd({k:'launch',f:from,to,pct:ui.pct,st:ui.stance|0});
    return;
  }
  if(to<0){ui.sel=-1;dirty=true;renderPanel(true);return;}
  const sel=ui.sel>=0?terrs[ui.sel]:null;
  if(sel&&sel.owner===ME&&to!==ui.sel&&terrs[to].owner!==ME&&sel.nb.includes(to)){
    cmd({k:'launch',f:ui.sel,to,pct:ui.pct,st:ui.stance|0});
    return;
  }
  ui.sel=to;TU.clk=1;dirty=true;
  renderPanel(true);
});

function campVal(o){
  const p=players[ME];if(!p||!p.x)return 0;
  if(o.k==='isl'){let n=0;for(const t of terrs)if(t.owner===ME)n++;return n;}
  if(o.k==='rv')return players.filter(q=>q.id!==ME&&(!q.alive||vas[q.id]===ME)).length;
  if(o.k==='te')return Object.keys(p.techs).length;
  return (p.x.st&&p.x.st[o.k])|0;
}
const campLeft=()=>Math.max(0,CAMP.lim-time);
function campInit(ci){
  const C=CAMPS[ci];if(!C||!campOpen(ci))return null;
  const p=players[ME];let her=0;
  for(let j=0;j<ci;j++)her+=(PROFILE.camp[CAMPS[j].id]|0);
  const gold=Math.round((C.gold+40*her)*PK/6);
  for(const id of C.tech)if(TECH[id])p.techs[id]=1;
  p.gold+=gold;recalc(p);
  addLog('Campagne — '+C.sub+' : « '+C.n+' ». '+C.tx,'#f2c75c',ME);
  if(gold>0||C.tech.length)addLog('Acquis de départ : '+(gold>0?gold+' ฿':'')+(gold>0&&C.tech.length?' et ':'')+(C.tech.length?C.tech.map(id=>TECH[id].n).join(', '):'')+(her?' (dont '+Math.round(40*her*PK/6)+' ฿ d’héritage : '+her+' étoile'+(her>1?'s':'')+').':'.'),'#f2c75c',ME);
  return {ch:ci,lim:C.lim*PK/6,fin:false,gold,her,res:null,stars:0};
}
function campTick(){
  if(!CAMP||CAMP.fin||over||MODE!=='solo')return;
  const C=CAMPS[CAMP.ch];
  if(C.obj.filter(o=>o.p).every(o=>campVal(o)>=o.n)){
    over={winners:[ME],text:'Chapitre accompli : « '+C.n+' ».',camp:1};showEnd();return;}
  if(time>=CAMP.lim){over={winners:[],text:'Le temps imparti est écoulé : les objectifs de « '+C.n+' » ne sont pas atteints.',camp:1};showEnd();}
}
function campFinalize(win){
  const C=CAMPS[CAMP.ch];CAMP.fin=true;
  const res=C.obj.map(o=>({o,ok:o.k==='fast'?(win&&time<=o.n*PK/6):campVal(o)>=o.n}));
  const bonus=res.filter(r=>!r.o.p&&r.ok).length;
  CAMP.res=res;CAMP.stars=win?Math.min(3,1+bonus):0;
  if(CAMP.stars>(PROFILE.camp[C.id]|0))PROFILE.camp[C.id]=CAMP.stars;
  PROFILE.cj.push({c:C.id,w:win?1:0,s:CAMP.stars,t:Math.round(time*6/PK),d:diffKey,x:CREWS[players[ME].crew||0].n});
  if(PROFILE.cj.length>30)PROFILE.cj.shift();
  profSave();
}
function campObjRows(res){
  const C=CAMPS[CAMP.ch];
  return C.obj.map((o,i)=>{
    const K=OBJK[o.k],v=o.k==='fast'?0:campVal(o);

}
