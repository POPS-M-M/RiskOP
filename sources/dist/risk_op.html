/* ---------- 9. MISSION : vagues, fin, rang ---------- */
function startWave(){
  const M=MISSIONS[S.mid],w=M.waves[S.wave],h=S.h;
  for(const g of w)for(let i=0;i<g[1];i++){
    let x,y,n=0;do{const a=Math.random()*TAU,r=430+Math.random()*260;x=clamp(h.x+Math.cos(a)*r,60,W-60);y=clamp(h.y+Math.sin(a)*r,60,H-60);n++;}while(Math.hypot(x-h.x,y-h.y)<330&&n<30);
    if(FOES[g[0]].boss){x=clamp(h.x+(h.x<W/2?520:-520),120,W-120);y=clamp(h.y,150,H-150);}
    spawn(g[0],x,y,g[2]);
  }
  S.wave++;S.waveT=-1;
  const boss=S.foes.find(f=>f.boss);
  addTxt(h.x,h.y-110,boss?'BOSS — '+FOES[boss.k].n:'VAGUE '+S.wave+' / '+M.waves.length,boss?'#ff6b5e':'#ffffff',1.7);
  beep(boss?80:392,.25,boss?'sawtooth':'triangle',.5);
}
function stepMission(dt){
  const M=MISSIONS[S.mid];
  if(S.waveT>=0){S.waveT-=dt;if(S.waveT<=0)startWave();return;}
  if(!S.foes.length){
    if(S.wave>=M.waves.length){finish(true);return;}
    /* entre deux vagues : soin de 8 %, et les personnages K.O. se relèvent avec 30 % de leurs PV */
    let up=[];for(const h of S.team){if(h.ko){h.ko=false;h.hp=Math.round(h.hpM*.3);up.push(HEROES[h.k].s);}else h.hp=Math.min(h.hpM,h.hp+Math.round(h.hpM*.08));}
    addTxt(S.h.x,S.h.y-80,'Vague terminée · soin'+(up.length?' · '+up.join(' et ')+' se relève'+(up.length>1?'nt':''):''),'#8dff9a',1.2);S.waveT=2.2;
  }
}
/* Rang : 4 critères, 1500 points au plus. S ≥ 1200, A ≥ 900, B ≥ 600, sinon C (mission terminée). */
function rankOf(){
  const M=MISSIONS[S.mid];
  const parts=[
    ['Rapidité',Math.round(400*clamp((M.par*2-S.t)/M.par,0,1)),fmtT(S.t)+' (référence '+fmtT(M.par)+')'],
    ['Combo maximal',Math.min(400,S.maxCombo*8),S.maxCombo+' coups'],
    ['Esquives parfaites',Math.min(300,S.perfect*50),String(S.perfect)],
    ['Dégâts subis',Math.round(400*clamp(1-S.dmgTaken/S.hpRef,0,1)),S.dmgTaken+' PV perdus']
  ];
  const score=parts.reduce((a,p)=>a+p[1],0);
  return {score,parts,r:score>=1200?'S':score>=900?'A':score>=600?'B':'C'};
}
function finish(win){
  if(S.over)return;
  const R=win?rankOf():null;
  S.over={win,rank:R?R.r:'',score:R?R.score:0,parts:R?R.parts:[],best:false};
  STORE.runs++;
  if(win){const b=STORE.best[S.mid];if(!b||R.score>b.s){STORE.best[S.mid]={r:R.r,s:R.score,t:Math.round(S.t)};S.over.best=true;}}
  save();IN.atk=false;IN.aimK=null;
  if(win){beep(523,.15,'triangle',.5);beep(659,.15,'triangle',.5);beep(784,.3,'triangle',.5);}else beep(110,.5,'sawtooth',.5);
  showEnd();
}
function step(dt){
  if(!S||S.over||S.paused)return;
  dt=Math.min(dt,.05);S.t+=dt;
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
  S.shake=Math.max(0,S.shake-dt);
  if(S.later.length){const due=S.later.filter(e=>e.at<=S.t);if(due.length){S.later=S.later.filter(e=>e.at>S.t);for(const e of due)e.fn();}}
  stepTeam(dt);stepHero(dt);if(S.over)return;
  stepFoes(dt);if(S.over)return;
  /* projectiles : les balles rebondissent sur les héros dont le passif le prévoit (Luffy) */
  for(const b of S.shots){
    const h=S.h;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.team===1){
      if(dist(b,h)<=b.r+h.r){
        if(h.inv>0){hurtHero(b.dmg,b.ty,null);b.life=0;}
        else if(HEROES[h.k].pas.bounce&&b.ty==='bullet'){const src=foeById(b.from),a=src?ang(b,src):Math.atan2(-b.vy,-b.vx);b.team=0;b.vx=Math.cos(a)*620;b.vy=Math.sin(a)*620;b.dmg=Math.round(b.dmg*2.5);b.life=1.2;addTxt(h.x,h.y-40,'Renvoyé !','#ffd95a',1);beep(900,.04,'square',.2);}
        else{hurtHero(b.dmg,b.ty,null);b.life=0;}
      }
    }else for(const f of S.foes)if(!f.dead&&dist(b,f)<=b.r+f.r){hitFoe(f,b.dmg,{a:Math.atan2(b.vy,b.vx),kb:30});b.life=0;break;}
    if(b.x<0||b.y<0||b.x>W||b.y>H)b.life=0;
    if(S.over)return;
  }
  S.shots=S.shots.filter(b=>b.life>0);
  for(const z of S.zones){z.t-=dt;if(z.t<=0){S.fx.push({k:'ring',x:z.x,y:z.y,r0:20,r1:z.r,t:0,dur:.25,col:'#ff8a5e'});if(!REDUCE)S.shake=Math.max(S.shake,.2);if(inCircle(z,z.r,S.h))hurtHero(z.dmg,z.ty,z);}}
  S.zones=S.zones.filter(z=>z.t>0);
  if(S.over)return;

    setW(el.querySelector('.arc-bar i'),m.hp/m.hpM);el.classList.toggle('ko',m.ko);
    const sw=el.querySelector('[data-act=swap]'),as=el.querySelector('[data-act=as]');
    sw.disabled=!!swapWhy(i);sw.textContent=m.ko?'K.O.':S.swapCd>0?Math.ceil(S.swapCd)+' s':'↔ '+(i+1);
    as.disabled=!!assistWhy(i);as.textContent=m.ko?'—':m.asCd>0?Math.ceil(m.asCd)+' s':'Assist. '+as.dataset.key;
  });
}
function kitHTML(k){
  const D=HEROES[k];
  return '<div class="arc-kit"><p><b>Passif — '+esc(D.pas.n)+'</b> : '+esc(D.pas.d)+'</p>'
    +['q','w','e','r'].map(x=>{const s=D.sk[x];return '<p><b>'+x.toUpperCase()+' — '+esc(s.n)+'</b> <span class="m">recharge '+s.cd+' s · '+s.en+' énergie'+(s.lv>1?' · niveau '+s.lv:'')+'</span><br>'+esc(s.d)+'</p>';}).join('')
    +'<p><b>Assistance — '+esc(D.as.n)+'</b> <span class="m">quand il est au repos · recharge 12 s</span><br>'+esc(D.as.d)+'</p></div>';
}
function teamHTML(team){
  const syn=synOf(team);
  return '<div class="arc-kit">'+syn.list.map(y=>'<p><b>Synergie — '+esc(y.n)+'</b> <span class="m">'+y.ks.map(k=>HEROES[k].s).join(' + ')+'</span><br>'+esc(y.d)+'</p>').join('')
    +Object.keys(DUOS).filter(k=>k.split('+').every(x=>team.includes(x))).map(k=>'<p><b>Duo — '+esc(DUOS[k].n)+'</b> <span class="m">'+k.split('+').map(x=>HEROES[x].s).join(' + ')+'</span><br>'+esc(DUOS[k].d)+'</p>').join('')+'</div>';
}
let briefSel=0;
function showBrief(mid){
  const M=MISSIONS[mid],b=STORE.best[mid],ov=$('#arc-ov'),team=STORE.team;ov.hidden=false;
  if(briefSel>=team.length)briefSel=0;
  ov.innerHTML='<div class="arc-card"><h2>Combat arcade</h2><p class="lead"><b>'+esc(M.n)+'</b> — '+esc(M.sub)+'. '+esc(M.tx)+'</p>'
    +'<p class="m">'+(b?'Meilleur résultat : rang <b>'+b.r+'</b>, '+b.s+' points en '+fmtT(b.t)+'.':'Aucun résultat enregistré.')+' Prototype : une mission, trois personnages.</p>'
    +'<h3>Votre équipage</h3><div class="arc-team" role="tablist">'+team.map((k,i)=>{const D=HEROES[k];return '<button type="button" role="tab" aria-selected="'+(i===briefSel)+'" class="arc-pick'+(i===briefSel?' on':'')+'" data-i="'+i+'"><span class="tk" style="background:'+D.col+'">'+D.s[0]+'</span><b>'+esc(D.s)+'</b><small>'+esc(D.role)+(i===0?' · principal':'')+'</small></button>';}).join('')+'</div>'
    +(briefSel>0?'<div class="arc-row" style="margin-top:8px"><button type="button" class="arc-btn" id="arc-main">Mettre '+esc(HEROES[team[briefSel]].s)+' en personnage principal</button></div>':'')
    +'<h3>'+esc(HEROES[team[briefSel]].n)+' · '+esc(HEROES[team[briefSel]].role)+'</h3>'+kitHTML(team[briefSel])
    +'<h3>Synergies et attaques combinées</h3>'+teamHTML(team)
    +'<h3>Commandes</h3><div class="arc-kit"><p><b>Se déplacer</b> : clic droit sur le sol, ou flèches du clavier. Au tactile : touchez le sol.</p>'
    +'<p><b>Attaquer</b> : clic gauche (maintenu = enchaînement de 3 coups, le 3e est plus fort). Clic droit sur un ennemi : il devient la cible et votre personnage l\'attaque tout seul.</p>'
    +'<p><b>Compétences</b> : Q, W, E, R — sur un clavier AZERTY, A et Z marchent aussi pour Q et W. Maintenez la touche pour voir la portée, relâchez pour lancer vers le curseur.</p>'
    +'<p><b>Esquive</b> : Espace. Bref instant d\'invulnérabilité ; éviter un coup ainsi donne une <b>esquive parfaite</b> (énergie +20, dégâts +30 % pendant 3 s).</p>'
    +'<p><b>Équipage</b> : touches 1, 2, 3 (ou Tab) pour changer de personnage ; F et G pour appeler l\'assistance d\'un coéquipier ; T pour l\'attaque combinée quand la jauge de duo est pleine. Un personnage au repos récupère lentement ses PV.</p>'
    +'<p><b>Pause</b> : Échap ou P. Les zones rouges annoncent les attaques ennemies.</p></div>'
    +'<div class="arc-row"><button type="button" class="arc-btn pri" id="arc-go">Combattre</button><button type="button" class="arc-btn" id="arc-quit">Retour au menu</button></div></div>';
  ov.querySelectorAll('.arc-pick').forEach(el=>el.addEventListener('click',()=>{briefSel=+el.dataset.i;showBrief(mid);}));
  const mb=$('#arc-main');if(mb)mb.addEventListener('click',()=>{const t=STORE.team,k=t.splice(briefSel,1)[0];t.unshift(k);briefSel=0;save();S=newState(mid);S.paused=true;S.brief=true;buildHud();render();hud();showBrief(mid);});
  $('#arc-go').addEventListener('click',()=>{audioOn();start(mid);});
  $('#arc-quit').addEventListener('click',close);
}
function showEnd(){
  const o=S.over,ov=$('#arc-ov');if(!ov)return;ov.hidden=false;
  ov.innerHTML='<div class="arc-card"><h2 class="'+(o.win?'win':'lose')+'">'+(o.win?'Victoire':'Défaite')+'</h2>'
    +(o.win?'<div class="arc-rank r'+o.rank+'">'+o.rank+'</div><p class="lead">'+o.score+' points sur 1500'+(o.best?' — <b>nouveau record</b>':'')+'.</p>'
      +'<table class="arc-tab"><tbody>'+o.parts.map(p=>'<tr><td>'+p[0]+'</td><td>'+esc(p[2])+'</td><td>'+p[1]+'</td></tr>').join('')+'</tbody></table>'
      +'<p class="m">Rang S à partir de 1200 points, A à 900, B à 600, C en dessous.</p>'
      :'<p class="lead">Tout l\'équipage est K.O. à la vague '+S.wave+' sur '+MISSIONS[S.mid].waves.length+'. '+S.kills+' ennemis vaincus en '+fmtT(S.t)+'.</p>')
    +'<p class="m">Niveau atteint : '+S.h.lv+' · combo maximal : '+S.maxCombo+' · esquives parfaites : '+S.perfect+' · dégâts infligés : '+S.dmgDone+' · changements : '+S.swaps+' · assistances : '+S.assists+' · duos : '+S.duos+'.</p>'
    +'<div class="arc-row"><button type="button" class="arc-btn pri" id="arc-again">Rejouer</button><button type="button" class="arc-btn" id="arc-quit">Retour au menu</button></div></div>';
  $('#arc-again').addEventListener('click',()=>start(S.mid));
  $('#arc-quit').addEventListener('click',close);
}
function pause(v){
  if(!S||S.over||S.brief)return;S.paused=v;IN.atk=false;IN.aimK=null;
  const ov=$('#arc-ov');ov.hidden=!v;
  if(v){ov.innerHTML='<div class="arc-card"><h2>Pause</h2><h3>'+esc(HEROES[S.h.k].n)+'</h3>'+kitHTML(S.h.k)+'<h3>Équipage</h3>'+teamHTML(S.team.map(h=>h.k))+'<div class="arc-row"><button type="button" class="arc-btn pri" id="arc-res">Reprendre</button><button type="button" class="arc-btn" id="arc-quit">Abandonner</button></div></div>';
    $('#arc-res').addEventListener('click',()=>pause(false));$('#arc-quit').addEventListener('click',close);}
}
function say(why){if(why&&S&&!S.over)addTxt(S.h.x,S.h.y-46,why,'#cfd8e6',.9);return why;}

/* ---------- 13. ENTRÉES ---------- */
const KEYMAP={q:'q',a:'q',w:'w',z:'w',e:'e',r:'r'};
const ARROWS={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right'};
const DIGIT={'1':0,'2':1,'3':2,'&':0,'é':1,'"':2};
const mates=()=>S.team.map((m,i)=>i).filter(i=>S.team[i]!==S.h);
function onKey(e,down){
  if(!open)return;
  const k=(e.key||'').toLowerCase();
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const run=S&&!S.over&&!S.brief&&!S.paused;
  if(k!=='enter'&&(k!=='tab'||run))e.stopPropagation();
  if(!run){if(down&&k==='escape'&&S&&S.paused&&!S.brief)pause(false);return;}
  let used=true;
  if(ARROWS[k])IN.keys[ARROWS[k]]=down;
  else if(KEYMAP[k]){const s=KEYMAP[k];if(down){if(!e.repeat)IN.aimK=s;}else if(IN.aimK===s){IN.aimK=null;cast(s);}}
  else if(k===' '||k==='spacebar'){if(down&&!e.repeat){const mx=(IN.keys.right?1:0)-(IN.keys.left?1:0),my=(IN.keys.down?1:0)-(IN.keys.up?1:0);heroDodge(mx||my?Math.atan2(my,mx):IN.mouse?aimAngle():S.h.face);}}
  else if(k in DIGIT){if(down&&!e.repeat&&DIGIT[k]!==S.ai)say(swapTo(DIGIT[k]));}
  else if(k==='tab'){if(down&&!e.repeat){const n=S.team.length;for(let j=1;j<n;j++){const i=(S.ai+j)%n;if(!S.team[i].ko){say(swapTo(i));break;}}}}
  else if(k==='f'||k==='g'){if(down&&!e.repeat){const i=mates()[k==='f'?0:1];if(i!==undefined)say(assist(i));}}
  else if(k==='t'){if(down&&!e.repeat)say(duo());}
  else if(k==='escape'||k==='p'){if(down)pause(true);}
  else used=false;
  if(used)e.preventDefault();
}
function toWorld(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-cw/2)/sc+S.cam.x,y:(e.clientY-r.top-ch/2)/sc+S.cam.y};}
function foeAt(p){let b=null,bd=1e9;for(const f of S.foes){if(f.dead)continue;const d=dist(p,f);if(d<=f.r+14&&d<bd){bd=d;b=f;}}return b;}
function moveOrder(p){const h=S.h,f=foeAt(p);if(f){h.tgt=f.id;h.auto=true;h.dest=null;}else{h.dest={x:clamp(p.x,30,W-30),y:clamp(p.y,30,H-30)};h.auto=false;}}
/* une action lancée depuis un bouton vise la cible ou l'ennemi le plus proche, pas le curseur (qui est sur le bouton) */
function noMouse(fn){const m=IN.mouse;IN.mouse=false;const r=fn();IN.mouse=m;return r;}
function bindInput(){
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    if(!S||S.over||S.paused)return;audioOn();const p=toWorld(e);
    if(e.pointerType==='mouse'){IN.mouse=true;IN.mx=p.x;IN.my=p.y;if(e.button===0){IN.atk=true;}else if(e.button===2)moveOrder(p);}
    else{IN.mouse=false;moveOrder(p);}
    e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{if(!S||e.pointerType!=='mouse')return;IN.mouse=true;const p=toWorld(e);IN.mx=p.x;IN.my=p.y;});
  window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button===0)IN.atk=false;});
  window.addEventListener('keydown',e=>onKey(e,true),true);
  window.addEventListener('keyup',e=>onKey(e,false),true);
  window.addEventListener('blur',()=>{IN.keys={};IN.atk=false;IN.aimK=null;});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&open&&S&&!S.over&&!S.paused)pause(true);});
  const sks=$('#arc-sks');
  sks.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.arc-sk');if(!b||!S||S.over||S.paused)return;audioOn();const k=b.dataset.k;
    if(e.pointerType!=='mouse')IN.mouse=false;
    if(k==='atk'){IN.atk=true;const up=()=>{IN.atk=false;window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);};window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);}
    else if(k==='dodge'){const mx=(IN.keys.right?1:0)-(IN.keys.left?1:0),my=(IN.keys.down?1:0)-(IN.keys.up?1:0);heroDodge(mx||my?Math.atan2(my,mx):S.h.face+Math.PI);}
    else if(k==='duo')say(noMouse(duo));
    else say(noMouse(()=>cast(k)));
    e.preventDefault();
  });
  sks.addEventListener('pointerover',e=>{const b=e.target.closest('.arc-sk');if(b&&S&&'qwer'.includes(b.dataset.k)&&e.pointerType==='mouse'){IN.aimK=b.dataset.k;IN.hov=true;}});
  sks.addEventListener('pointerout',()=>{if(IN.hov){IN.aimK=null;IN.hov=false;}});
  $('#arc-mates').addEventListener('pointerdown',e=>{
    const b=e.target.closest('button');if(!b||!S||S.over||S.paused)return;audioOn();const i=+b.dataset.i;
    if(e.pointerType!=='mouse')IN.mouse=false;
    if(b.dataset.act==='swap')say(swapTo(i));else say(noMouse(()=>assist(i)));
    e.preventDefault();
  });
  $('#arc-pause').addEventListener('click',()=>pause(true));
  window.addEventListener('resize',resize);
}

/* ---------- 14. API ---------- */
function frame(ts){
  raf=open?requestAnimationFrame(frame):0;
  const real=Math.min(.05,Math.max(0,(ts-lastT)/1000));lastT=ts;
  if(!S||manual)return;
  if(!S.over&&!S.paused){
    if(S.stop>0)S.stop-=real;
    else{let k=1;if(S.slow>0){S.slow-=real;k=.35;}step(real*k);}
  }
  render();hud();
}
function start(mid,team){
  S=newState(mid||'shells',team);IN.keys={};IN.atk=false;IN.aimK=null;IN.mouse=false;
  if(cv){const ov=$('#arc-ov');if(ov)ov.hidden=true;buildHud();resize();hud();render();}
  return S;
}
function ensureDom(){
  let el=$('#arc');
  if(!el){el=document.createElement('div');el.id='arc';el.hidden=true;document.body.appendChild(el);}
  if(!cv){el.innerHTML=HTML;cv=$('#arc-cv');cx=cv.getContext('2d');bindInput();}
  return el;
}
function openArc(mid){
  const el=ensureDom();el.hidden=false;open=true;briefSel=0;S=newState(mid||'shells');S.paused=true;S.brief=true;buildHud();resize();render();hud();showBrief(mid||'shells');
  if(!raf){lastT=performance.now();raf=requestAnimationFrame(frame);}
}
function close(){open=false;S=null;IN.keys={};IN.atk=false;const el=$('#arc');if(el)el.hidden=true;if(raf){cancelAnimationFrame(raf);raf=0;}}
window.ARC={open:openArc,close,start,step,render,hud,cast,attack:heroAttack,dodge:heroDodge,spawn,castWhy,rankOf,pause,swap:swapTo,swapWhy,assist,assistWhy,duo,duoWhy,synOf,
  S:()=>S,IN,HEROES,FOES,MISSIONS,SYN,DUOS,ROSTER,STORE:()=>STORE,isOpen:()=>open,setManual:v=>{manual=!!v;},hurt:hurtHero,hit:hitFoe,W,H,xpNeed,gainXp,atkOf:h=>hAtk(h)};
})();
</script>
