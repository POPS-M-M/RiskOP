/* Concept : carte marine de nuit. La carte occupe le centre, le tableau de bord privé du joueur est à droite, le journal des événements flotte sur la carte. Un seul univers visuel sombre, voulu. */

.speed button+button{border-left:1px solid var(--line)}
.speed button.on{background:var(--accent);color:var(--accent-ink)}

.tcard b.ok{color:var(--good)}

/* Zone de jeu : la carte est l'élément principal, le panneau privé est un tiroir à droite */

<script>
(()=>{
'use strict';
const W=1400,H=860,CELL=2,GW=W/CELL,GH=H/CELL;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---- ambiance sonore ----
   Tout est synthétisé par le navigateur (Web Audio) : aucun fichier audio, donc rien d’emprunté à la bande originale de l’œuvre.
   Musique générative (accords lents en mineur + petite mélodie pentatonique), plus tendue avec batterie après une bataille ; effets pour conquête,
   combat, construction, recrutement, bandeaux, missions, succès, victoire et défaite. Le son ne démarre qu’après un premier clic (règle des navigateurs). */
const SND={on:true,vol:.35,ctx:null,out:null,mus:null,fx:null,send:null,nb:null,mood:'calm',until:0,next:0,beat:0,bar:0,n:0,last:{},mel:3,dead:false,timer:0};
try{const o=JSON.parse(localStorage.getItem('gl-snd')||'null');if(o&&typeof o==='object'){SND.on=o.on!==false;const v=+o.vol;SND.vol=v>0&&v<=1?v:.35;}}catch(_){}
function sndSave(){try{localStorage.setItem('gl-snd',JSON.stringify({on:SND.on,vol:SND.vol}));}catch(_){}}
const SND_G=2.2;/* gain de sortie : les niveaux internes sont bas pour éviter tout écrêtage */
const mfreq=m=>440*Math.pow(2,(m-69)/12);
function sndBuild(ctx){
  SND.ctx=ctx;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;comp.connect(ctx.destination);
  const out=ctx.createGain();out.gain.value=SND.on?SND.vol*SND_G:0;out.connect(comp);SND.out=out;
  SND.mus=ctx.createGain();SND.mus.gain.value=.6;SND.mus.connect(out);
  SND.fx=ctx.createGain();SND.fx.gain.value=.9;SND.fx.connect(out);
  const dl=ctx.createDelay(1),fb=ctx.createGain(),lp=ctx.createBiquadFilter();
  dl.delayTime.value=.42;fb.gain.value=.36;lp.type='lowpass';lp.frequency.value=1700;
  SND.send=ctx.createGain();SND.send.gain.value=.35;SND.send.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(SND.mus);
  const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=nb.getChannelData(0);
  let sd=12345;for(let i=0;i<d.length;i++){sd=(sd*1103515245+12345)&0x7fffffff;d[i]=sd/0x3fffffff-1;}
  SND.nb=nb;SND.next=0;SND.beat=0;SND.bar=0;
}
function sTone(dest,f,t,dur,type,vol,att,slide,send){
  const c=SND.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);if(send)g.connect(SND.send);
  o.start(t);o.stop(t+dur+.05);SND.n++;
}
function sNoise(dest,t,dur,vol,freq,q,type){
  const c=SND.ctx,src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=SND.nb;f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q||1;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(dest);src.start(t,0,dur+.05);SND.n++;
}
const SND_CH={calm:[[50,57,62,65],[46,53,58,62],[48,55,60,64],[45,52,57,60]],war:[[50,57,62],[51,58,63],[50,57,62],[48,55,60]]};
const SND_SC={calm:[62,65,67,69,72,74,77],war:[62,64,65,67,69,70,73,74]};
function sndBeat(t){
  const w=SND.mood==='war',ch=SND_CH[SND.mood][SND.bar%4],stp=SND.beat,len=w?.3125:.4545,m=SND.mus;
  if(stp===0){
    for(const n of ch)sTone(m,mfreq(n),t,len*8*1.12,w?'sawtooth':'triangle',w?.018:.05,w?.4:1.2,0,true);
    sTone(m,mfreq(ch[0]-12),t,len*4,'sine',.1,.05);
  }else if(stp===4)sTone(m,mfreq(ch[0]-12),t,len*3,'sine',.08,.05);
  if(w){
    if(stp===0||stp===4||stp===5)sTone(SND.fx,130,t,.28,'sine',.28,.005,42);
    if(stp===2||stp===6)sNoise(SND.fx,t,.14,.1,1900,.8);
    if(stp%2===1)sNoise(SND.fx,t,.04,.025,7000,1,'highpass');
    sTone(m,mfreq(ch[0]-12),t,len*.7,'triangle',.05,.005);
  }
  const sc=SND_SC[SND.mood];
  if(Math.random()<(w?.3:.34)&&(w||stp%2===0)){
    SND.mel=Math.max(0,Math.min(sc.length-1,SND.mel+Math.round((Math.random()-.5)*4)));
    sTone(m,mfreq(sc[SND.mel]),t,w?.5:1,'triangle',w?.05:.06,.01,0,true);
  }
}
function sndFill(limit){
  while(SND.next<limit){
    if(SND.beat===0)SND.mood=performance.now()<SND.until?'war':'calm';
    sndBeat(SND.next);
    SND.next+=SND.mood==='war'?.3125:.4545;
    SND.beat=(SND.beat+1)%8;if(!SND.beat)SND.bar++;
  }
}
function sndSched(){
  const c=SND.ctx;if(!c||!SND.on||SND.vol<=0||c.state!=='running')return;
  if(SND.next<c.currentTime)SND.next=c.currentTime+.05;
  sndFill(c.currentTime+1.4);
}
function sndInit(){
  if(SND.ctx||SND.dead)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){SND.dead=true;return;}
    sndBuild(new AC());
    SND.timer=setInterval(sndSched,300);
  }catch(_){SND.dead=true;SND.ctx=null;}
}
function sndApply(){
  if(SND.out&&SND.ctx)try{SND.out.gain.setTargetAtTime(SND.on?SND.vol*SND_G:0,SND.ctx.currentTime,.05);}catch(_){}
  const b=$('#b-snd');if(!b)return;
  b.classList.toggle('off',!SND.on||SND.dead);
  $('#snd-l').textContent=SND.dead?' indisponible':SND.on?' '+Math.round(SND.vol*100)+' %':' coupé';
  b.title=SND.dead?'Le son n’est pas disponible dans ce navigateur':'Son : '+(SND.on?Math.round(SND.vol*100)+' %':'coupé')+' — cliquer pour changer';
}
function sndCycle(){
  const L=[[false,.35],[true,.35],[true,.7],[true,1]];
  let i=L.findIndex(z=>z[0]===SND.on&&(!z[0]||Math.abs(z[1]-SND.vol)<.01));if(i<0)i=0;
  i=(i+1)%L.length;SND.on=L[i][0];SND.vol=L[i][1];sndSave();
  if(SND.on){sndInit();if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();}
  sndApply();
}
function sndFx(k){
  if(!SND.ctx||!SND.on||SND.dead||SND.ctx.state!=='running')return;
  const now=performance.now();if(SND.last[k]&&now-SND.last[k]<150)return;SND.last[k]=now;
  const t=SND.ctx.currentTime+.01,d=SND.fx;
  if(k==='conquer'||k==='conquer0'){[72,76,79].forEach((n,i)=>sTone(d,mfreq(n),t+i*.09,.35,'triangle',.18,.01));}
  else if(k==='clash'||k==='battle'){sNoise(d,t,.2,.22,900,.7);sTone(d,110,t,.25,'sine',.3,.005,50);}
  else if(k==='build'){sTone(d,230,t,.09,'square',.07,.003,170);sTone(d,190,t+.12,.09,'square',.07,.003,140);}
  else if(k==='recruit'){sTone(d,660,t,.07,'sine',.14,.004);sTone(d,880,t+.06,.07,'sine',.1,.004);}
  else if(k==='bell'){sTone(d,880,t,1.3,'sine',.14,.005);sTone(d,1760,t,.8,'sine',.05,.005);}
  else if(k==='chime'){sTone(d,784,t,.5,'sine',.15,.005);sTone(d,1175,t+.12,.7,'sine',.15,.005);}
  else if(k==='ach'){[72,76,79,84].forEach((n,i)=>sTone(d,mfreq(n),t+i*.1,.6,'triangle',.17,.01));}
  else if(k==='boss'){sTone(d,70,t,.5,'sine',.4,.005,38);sTone(d,70,t+.35,.6,'sine',.4,.005,36);sNoise(d,t,.3,.12,300,.7);}
  else if(k==='win'){[67,72,76,79,84].forEach((n,i)=>sTone(d,mfreq(n),t+i*.14,.9,'triangle',.18,.01,0,true));}
  else if(k==='lose'){[69,65,62,57].forEach((n,i)=>sTone(d,mfreq(n),t+i*.28,1,'triangle',.16,.02,0,true));}
}

  for(const R of regs)if(regionHeld(R,p.id))for(const k in R.fx)m[k]+=R.fx[k];
  for(const t of terrs){
    if(t.owner!==p.id)continue;
    const ie=ISLE_FX[t.name];if(ie)for(const k in ie.fx)m[k]+=ie.fx[k];
    if(!t.city)continue;
    for(const b of t.city.b)if(b.startsWith('w:')){const w=WONDER[b.slice(2)];for(const k in w.fx)m[k]+=w.fx[k];}
  }
  for(let i=0;i<BS.length;i++)if(BS[i].dead&&BS[i].by===p.id)for(const k in BOSSES[i].rew.fx)m[k]+=BOSSES[i].rew.fx[k];
  for(const i of chActive(chOwnedBy(p.id))){const L=LEGENDS[i],kk=legBonus(p,i)*chLvK(i);for(const k in L.fx)m[k]+=L.fx[k]*kk;}
  if(p.buf&&p.buf.length){p.buf=p.buf.filter(b=>b.until>time);for(const b of p.buf)for(const k in b.fx)m[k]=(m[k]||0)+b.fx[k];}
  recalcAge(p,m);
  p.mod=m;
}
function tradePartners(id){let n=0;for(const q of players)if(q.alive&&q.id!==id&&tradeM[id][q.id]&&rel[id][q.id]!=='war')n++;return n;}
function terrInc(t){
    const y=TYPES[t.type];
    let gg=y.g,ss=y.s,ff=y.f;
    if(t.spec&&!t.city){if(t.spec==='g')gg=gg*1.8+.18;else if(t.spec==='s')ss=ss*1.8+.22;else if(t.spec==='f')ff=ff*1.8+.18;}
    if(t.city){gg+=.25;ss+=.1;ff+=.05;}
    if(t.capital){gg+=.8;ss+=.6;ff+=.4;}
    if(t.city){
      const lm=1+.35*(t.city.lvl-1);
      gg*=lm;ss*=lm;ff*=lm;
      for(const b of t.city.b){const bi=BLD_INCOME[b];if(bi){gg+=bi.g||0;ss+=bi.s||0;ff+=bi.f||0;}}

    return [gg,ss,ff];
}

  const m=p.mod,tb=Math.min(.2,tradePartners(p.id)*.1);

  for(const q of players)if(q.alive&&q.id!==p.id&&vas[q.id]===p.id)gg2+=TRIB*goldGross(q);
  return {g:(gg2-up)*Z,s:s*(1+m.sci)*p.inc*Z,f:f*(1+m.faith)*p.inc*Z,up:up*Z,i:Math.max(0,.3+tradePartners(p.id)*.04+m.inf+opInfB(p))*p.inc*Z};

function powerOf(u,enemy,mode){

    s+=n*(mode==='atk'?UNITS[k].atk:UNITS[k].def)*m;
  }

}

function defTotal(t,attU,noise,P){

  const ap=powerOf(attU,t.u,'atk');

  const cut=ap>0?Math.min(.75,cat/ap*1.6):0;
  const f=1+(fortOf(t)-1)*(1-cut),fo=t.fo>time?(t.fm||FORT_MUL):1;
  const base=powerOf(t.u,attU,'def')+(t.owner>=0?(t.u.elite||0)*UNITS.elite.def*(players[t.owner].mod.elite||0):0),nz=noise?(.9+Math.random()*.2):1;
  if(P){P.base=base;P.dm=dm;P.tt=TYPES[t.type].def;P.f=f;P.cut=cut;P.nz=nz;P.fo=fo;}
  return base*dm*f*fo*nz;

/* ---- ordres tactiques ----

   Fortifier : une île à vous gagne ×1,25 en défense pendant 90 s (échelle du rythme), pour des Berrys ; non cumulable avec elle-même, perdue si l'île est conquise.

const FORT_MUL=1.25,RETREAT_LOSS=.1,PRUD_ABORT=.8;

const fortCost=(t,p)=>{p=p||players[t.owner];return Math.max(20,Math.round((40+tr(t)*2)*PK/6*(1-Math.min(.6,modOf(p).fc||0))));};

function huntTarget(o,pr){pr=pr||huntPrimes;let b=-1,bs=-1;for(const p of players){if(p.id===o||!p.alive)continue;const v=pr[p.id]||0;if(v>bs){bs=v;b=p.id;}}return b;}
const huntBonus=(o,t)=>{const h=CREWS[players[o].crew||0].hunt;return h&&(t.owner>=0&&t.owner===huntTarget(o))?h:0;};
const attTotal=(owner,u,t,noise,from,P,st)=>{
  const L=from===undefined?{atk:0,big:0}:ltOf(from);
  const base=powerOf(u,t.u,'atk')+(u.elite||0)*UNITS.elite.atk*(players[owner].mod.elite||0),hb=huntBonus(owner,t),lat=L.atk+(L.big&&tr(t)>=18?L.big:0);
  const mult=Math.max(.3,1+players[owner].mod.atk+hb+lat),nz=noise?(.9+Math.random()*.2):1;
  const sm=STANCE[st|0]?STANCE[st|0].a:1;
  const chp=opAttChamp(owner,from,t),opm=opAttMul(owner,t);/* OP Adventure : champions présents et techniques */
  if(P){P.base=base;P.mult=mult;P.hunt=hb;P.lat=lat;P.nz=nz;P.st=sm;P.ch=Math.round(chp);P.opm=opm;}
  return (base+chp)*mult*sm*nz*opm;
};

let BS=[];

function bossPhaseIdx(b,hp){const f=hp/b.hp;return f>2/3?0:f>1/3?1:2;}
function bossFall(i,pid){
  const b=BOSSES[i],st=BS[i],p=players[pid];

function bossHit(i,dmg,pid){
  const b=BOSSES[i],st=BS[i];if(!st||st.dead||!(dmg>0))return 0;
  const p0=bossPhaseIdx(b,st.hp);dmg=Math.min(st.hp,dmg);st.hp-=dmg;st.last=time;
  if(st.hp<=.01){st.hp=0;bossFall(i,pid);}
  else{const p1=bossPhaseIdx(b,st.hp);if(p1>p0)addLog('☠ '+b.n+' passe en phase '+(p1+1)+' : '+b.ph[p1].n+'.','#ff8a70');}
  return dmg;
}
function bossTick(){

  }
}

/* ---- déchiffrage des Poneglyphes ----
   Un camp qui TIENT une île à Poneglyphe peut la déchiffrer (Berrys + savoir, ~80 s). Si l’île change de main avant la fin, le travail est perdu.
   Chaque Poneglyphe déchiffré (par camp, définitivement) : +6 % de savoir et −8 % de durée du projet « Expédition à Laugh Tale » (déjà lancé : inchangée).
   Mécanisme de jeu inventé ; il ne remplace pas la condition « tenir 2 Poneglyphes ». */
const DEC_COST={g:50,s:20};
const decDur=()=>80*tkS();
const decCost=p=>{const k=p&&p.techs&&p.techs.theologie?.75:1;return {g:Math.max(10,Math.round(DEC_COST.g*PK/6*k)),s:Math.max(5,Math.round(DEC_COST.s*PK/6*k))};};
const pnm=p=>p.name==='Votre camp'?CREWS[p.crew||0].n:p.name;
function decReason(p,t){
  if(!t||!t.pone)return 'Cette île ne porte pas de Poneglyphe.';
  if(t.owner!==p.id)return 'Il faut tenir l’île.';
  if(p.x.dc.includes(t.id))return 'Déjà déchiffré.';
  if(p.x.dx)return 'Un déchiffrage est déjà en cours.';
  const c=decCost(p);
  if(p.gold<c.g)return 'Berrys insuffisants ('+c.g+' requis).';
  if(p.sci<c.s)return 'Savoir insuffisant ('+c.s+' requis).';
  return '';
}
function decStart(p,t){
  const r=decReason(p,t);if(r)return r;
  const c=decCost(p);p.gold-=c.g;p.sci-=c.s;p.x.dx={t:t.id,e:0};dirty=true;
  return '';
}
function decTick(){
  if(over)return;
  for(const p of players){
    if(!p.alive||!p.x||!p.x.dx)continue;
    const d=p.x.dx,t=terrs[d.t];
    if(!t||t.owner!==p.id){if(p.human)addLog('Déchiffrage interrompu : '+(t?t.name:'l’île')+' n’est plus à vous.','#8c97a6',p.id);p.x.dx=null;dirty=true;continue;}
    d.e+=1;
    if(d.e>=decDur()){
      p.x.dx=null;p.x.dc.push(t.id);p.sci+=Math.round(40*PK/6);stInc(p.id,'pz');recalc(p);dirty=true;
      addLog(pnm(p)+' déchiffre le Poneglyphe de '+t.name+' (+6 % de savoir, Expédition à Laugh Tale plus rapide).',p.color);
    }
  }
}
function aiDec(p){
  if(p.human||!p.x||p.x.dx)return;
  const c=decCost(p);
  const t=terrs.find(x=>x.pone&&x.owner===p.id&&!p.x.dc.includes(x.id));
  if(t&&p.gold>=c.g*2&&p.sci>=c.s*2)decStart(p,t);
}
function poneBon(t){
  let h='<div class="bn"><b>Poneglyphe de Route</b><small>Compte pour l’Expédition à Laugh Tale (onglet Âge). Déchiffré : +6 % de savoir et −8 % de durée pour ce projet.</small>';
  const p=players[ME];
  if(p&&p.x&&p.x.dc){
    if(p.x.dc.includes(t.id))h+='<small style="color:var(--good)">✓ Déchiffré par votre camp.</small>';
    else if(p.x.dx&&p.x.dx.t===t.id){const pc=Math.round(Math.min(1,p.x.dx.e/decDur())*100);h+='<div class="msb"><i style="width:'+pc+'%"></i></div><small>Déchiffrage en cours : '+pc+' % · reste '+Math.max(0,Math.ceil(decDur()-p.x.dx.e))+' s. Perdu si l’île change de main.</small>';}
    else if(t.owner===ME){const why=decReason(p,t),c=decCost(p);h+=btn('decipher',t.id,'Déchiffrer · '+c.g+' ฿ + '+c.s+' savoir',!!why,'wide')+(why?'<small>'+esc(why)+'</small>':'');}
    else h+='<small>Tenez l’île pour la déchiffrer.</small>';
  }
  return h+'</div>';
}

const msProg=(p,m)=>{const T=MST.find(z=>z.id===m.id);return T?Math.max(0,T.v(p)-m.b):0;};
function msAssign(p,i){
  const ms=p.x.ms,used=ms.s.filter(m=>m).map(m=>m.id);
  const c=MST.filter(T=>!used.includes(T.id)&&!ms.h.includes(T.id)&&(!T.ok||T.ok(p,i)));
  if(!c.length)return;
  const T=c[Math.floor(Math.random()*c.length)];
  ms.s[i]={id:T.id,b:T.v(p),g:T.tg[i],until:time+MS_TIER[i].d*tkS()};
  ms.h.push(T.id);if(ms.h.length>3)ms.h.shift();
}
function msTick(){
  if(over)return;
  for(const p of players){
    if(!p.human||!p.alive||!p.x||!p.x.ms)continue;
    const ms=p.x.ms;
    for(let i=0;i<3;i++){
      const m=ms.s[i];
      if(m){
        if(msProg(p,m)>=m.g){
          const g=msGold(i),inf=MS_TIER[i].i;
          p.gold+=g;p.x.inf+=inf;stInc(p.id,'ms');
          addLog('Mission accomplie : '+msText(m)+' (+'+g+' ฿'+(inf?' et +'+inf+' influence':'')+').','#f2c75c',p.id);
          ms.s[i]=null;ms.cd[i]=time+12*tkS();dirty=true;

        }
      }else if(time>=ms.cd[i]){msAssign(p,i);if(ms.s[i])dirty=true;}
    }
  }
}
/* ---- événements du monde ----
   Toutes les 85 à 155 s environ (×√(rythme/6)), un événement aléatoire éclate, 3 en même temps au plus, jamais deux fois le même type de suite.
   Chacun a une vraie conséquence sur la partie, visible de tous :
   - treasure : un coffre sur une île ; celui qui la tient à la fin du compte à rebours empoche les Berrys.
   - bounty : la prime d’un camp grimpe (le plus souvent le meneur en nombre de territoires) : la Marine et les chasseurs le visent plus facilement ; il touche aussi quelques Berrys de mécènes.
   - logpose : toutes les armées avancent 40 % moins vite.
   - seaking : un Roi des mers bloque une route : aucun départ possible, les armées déjà en mer perdent 25 %.
   - revolt : rumeur de révolte dans un village faiblement tenu d’un camp d’au moins 5 territoires : sans 14 soldats à temps, l’île devient indépendante.
   - legend : un lieutenant libre est recrutable à moitié prix pendant un moment.
   Durées, montants et seuils sont des choix d’équilibrage. */
const EVK={treasure:{n:'Trésor',col:'#f2c75c',w:3,d:70},bounty:{n:'Prime qui grimpe',col:'#ff8a70',w:2,d:90},logpose:{n:'Log Pose perturbé',col:'#8fd3ff',w:2,d:60},
  seaking:{n:'Roi des mers',col:'#5cc8b0',w:3,d:55},revolt:{n:'Rumeurs de révolte',col:'#ee6666',w:2,d:45},legend:{n:'Légendaire signalé',col:'#c58cf0',w:2,d:80}};
const EV_REVOLT_MIN=14,EV_BOUNTY=600,EV_LOGPOSE=.6,EV_SEA_LOSS=.75,EV_LEGEND=.5;
let EV=[],evNextAt=0,evSeq=0,evLastK='';
const evDur=k=>EVK[k].d*tkS();
function evReset(){EV=[];evSeq=0;evLastK='';evNextAt=100*tkS();}
const evSpd=()=>EV.some(e=>e.k==='logpose')?EV_LOGPOSE:1;
const evPrime=id=>{let s=0;for(const e of EV)if(e.k==='bounty'&&e.p===id)s+=e.amt;return s;};
const evTreasureAt=tid=>EV.some(e=>e.k==='treasure'&&e.t===tid);
const evLegendK=i=>EV.some(e=>e.k==='legend'&&e.i===i)?EV_LEGEND:1;
function routeBlocked(f,to){return EV.find(e=>e.k==='seaking'&&((e.a===f&&e.b===to)||(e.a===to&&e.b===f)))||null;}
function evPick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function evText(e){
  const T=x=>terrs[x]?terrs[x].name:'?',P=x=>players[x]?players[x].name:'?';
  switch(e.k){

/* crée un événement du type demandé ; renvoie null si aucune cible convenable */

    }

    const tg=Math.random()<.6?lead:evPick(big);

}

/* ================= Tours simultanés ================= */
/* Chaque tour : phase d'ordres (temps arrêté, tout le monde joue en même temps), puis résolution de TURN_LEN secondes où tout s'exécute.
   Les mouvements de troupes sont mis en file et partent ensemble au début de la résolution ; achats, technologies et diplomatie sont immédiats.
   L'IA, elle, joue pendant la résolution, comme en temps réel. */

  for(const o of q){const p=players[o.s];if(p&&p.alive)launch(o.s,o.f,o.to,o.pct,o.st);}

}

function launchCheck(pid,from,to,pct){
  const f=terrs[from],t=terrs[to];
  if(f.owner!==pid||!f.nb.includes(to))return 'Ces territoires ne sont pas voisins.';
  const sk=routeBlocked(from,to);if(sk)return 'Un Roi des mers bloque cette route (encore '+Math.ceil(sk.until-time)+' s).';
  const o=t.owner;
  if(o>=0&&o!==pid&&!isWar(pid,o))return rel[pid][o]==='alliance'?players[o].name+' est votre allié.':'Vous êtes en paix avec '+players[o].name+' : déclarez-lui la guerre (onglet Diplo).';
  if(!takeUnits(f.u,pct))return 'Pas assez de troupes (il faut en laisser au moins une).';
  return '';
}
function queueOrder(seat,f,to,pct,st){
  const why=launchCheck(seat,f,to,pct);if(why)return why;
  const mine=TM.queue.filter(o=>o.s===seat);

  if(mine.length>=TQ_MAX)return 'Trop d\'ordres ce tour ('+TQ_MAX+' maximum).';

}

  const take=emptyU();let tot=0;

  if(sumU(u)-tot<1){
    const kk=UK.reduce((a,b)=>take[b]>take[a]?b:a);
    if(take[kk]>0){take[kk]-=1;tot-=1;}
  }
  return tot>0?take:null;
}
function launch(pid,from,to,pct,st){
  const f=terrs[from],t=terrs[to];
  if(f.owner!==pid||!f.nb.includes(to))return 'Ces territoires ne sont pas voisins.';
  {const sk=routeBlocked(from,to);if(sk)return 'Un Roi des mers bloque cette route (encore '+Math.ceil(sk.until-time)+' s).';}
  const o=t.owner;
  if(o>=0&&o!==pid&&!isWar(pid,o)){
    return rel[pid][o]==='alliance'?players[o].name+' est votre allié.':'Vous êtes en paix avec '+players[o].name+' : déclarez-lui la guerre (onglet Diplo).';
  }

  p.gold-=CITY_COST;t.u.guerrier-=CITY_UNITS;t.city={lvl:1,b:[],q:null};dirty=true;
  if(p.human)addLog('Nouvelle ville : '+t.name,p.color,p.id);
  return '';
}
function upgradeCity(p,t){
  if(t.owner!==p.id||!t.city)return 'Ville requise.';
  if(t.city.lvl>=3)return 'Niveau maximal.';
  const c=CITY_UP*t.city.lvl;
  if(p.gold<c)return 'Berrys insuffisants ('+c+' requis).';
  p.gold-=c;t.city.lvl++;
  return '';
}
const wonderOwner=id=>{for(const t of terrs)if(t.city&&t.city.b.includes('w:'+id))return t.owner;return null;};
const wonderBuilding=id=>terrs.some(t=>t.city&&t.city.q&&t.city.q.id==='w:'+id);
function buildReason(p,t,id,noGold){
  if(t.owner!==p.id||!t.city)return 'Ville requise.';
  const c=t.city;
  if(c.q)return 'Une construction est déjà en cours.';
  const def=defOfBuild(id);
  if(!def.up&&usedSlots(t)>=slotsOf(t))return 'Plus d\'emplacement libre.';
  if(id.startsWith('w:')){
    if(def.tech&&!p.techs[def.tech])return 'Technologie requise : '+TECH[def.tech].n+'.';
    if(wonderOwner(id.slice(2))!==null||wonderBuilding(id.slice(2)))return 'Lieu légendaire déjà construit ou en cours.';
  }else{
    if(def.tech&&!p.techs[def.tech])return 'Technologie requise : '+TECH[def.tech].n+'.';
    if(hasB(t,id))return c.b.includes(id)?'Déjà construit ici.':'Déjà amélioré ici.';
    if(def.up&&!c.b.includes(def.up))return 'Nécessite : '+BUILDINGS[def.up].n+' dans cette ville.';
    if(def.haki&&opHakiMax(p)<def.haki)return 'Nécessite un rang '+def.haki+' de Haki (onglet Haki).';
  }
  if(!noGold&&p.gold<def.cost)return 'Berrys insuffisants ('+def.cost+' requis).';
  return '';
}
function startBuild(p,t,id){
  const why=buildReason(p,t,id);if(why)return why;
  const def=defOfBuild(id);
  p.gold-=def.cost;t.city.q={id,t:0,dur:def.time};
  return '';
}

/* ================= Diplomatie ================= */
const isWar=(a,b)=>rel[a][b]==='war';
/* ---- réputation (−100 à +100, publique) ----
   Elle bouge avec ce que fait un camp : déclarer la guerre à qui lui était ami (−10) ou simplement en paix (−3), rompre une alliance (−18) ;
   signer une paix (+3), un commerce (+2), une alliance (+5) ; faire un cadeau (+2). Elle revient lentement vers 0 avec le temps.
   Effets : les IA acceptent plus ou moins volontiers vos propositions (±0,4 point d’attitude par point de réputation),
   les accords coûtent 20 % de moins à partir de +40 et 50 % de plus à partir de −40, et l’attitude des autres camps dérive avec elle. */
/* ---- vassalité et ultimatum ----
   Vassalité : un camp (suzerain) exige qu'un autre devienne son vassal, en paix comme en guerre. Le vassal passe en paix avec lui et lui verse 20 % de ses Berrys bruts tant que dure le lien ;
   ni l'un ni l'autre ne peut être vassal ou suzerain d'un troisième à la fois (un camp a au plus un suzerain). L'IA accepte seulement si elle est écrasée (en guerre : le suzerain a ≥ 2,2× sa force ; en paix : ≥ 3× et opinion > −30).
   Le lien cesse : si le vassal déclare la guerre à son suzerain (rébellion), si le suzerain le libère, ou si l'un des deux est éliminé. L'IA vassale se rebelle quand sa force remonte à 90 % de celle du suzerain, au bout d'au moins 120 s.
   Ultimatum : en paix, un camp exige 60 ฿ (à l'échelle du rythme). Accepté : l'argent change de mains, l'opinion de la cible baisse de 15 et la réputation de l'auteur de 4. Refusé : la guerre est déclarée (sauf trêve en cours). L'IA accepte si l'auteur a ≥ 1,6× sa force et si elle a l'argent.
   Tous ces chiffres sont des choix d'équilibrage, pas des données de l'œuvre. */
const TRIB=.2,ULT_BASE=60,VAS_RS_WAR=2.2,VAS_RS_PEACE=3,ULT_RS=1.6;
const ultAmt=()=>Math.max(20,Math.round(ULT_BASE*PK/6));
const REP_DECAY=.03;
const repLabel=r=>r>=40?'Honorable':r>=15?'Digne de confiance':r>-15?'Neutre':r>-40?'Peu fiable':'Traître';
const repOf=id=>{const p=players[id];return p&&p.x?(p.x.rep||0):0;};
function repMove(pid,d,why){
  const p=players[pid];if(!p||!p.x)return;
  p.x.rep=clamp((p.x.rep||0)+d,-100,100);
  if(d<=-3&&why){const hs=players.filter(h=>h.human).map(h=>h.id);if(hs.length)addLog('Réputation de '+(p.name==='Votre camp'?CREWS[p.crew||0].n:p.name)+' : '+d+' ('+why+').','#d98c5f',hs);}
}
function repTick(){
  if(over)return;
  for(const p of players){
    if(!p.x||!p.alive||!p.x.rep)continue;
    const st=REP_DECAY/tkS();p.x.rep=Math.abs(p.x.rep)<=st?0:p.x.rep-Math.sign(p.x.rep)*st;
  }
}
const dealCost=(p,kind)=>{const r=p&&p.x?(p.x.rep||0):0;return Math.max(1,Math.round(DEAL_COST[kind]*(r>=40?.8:r<=-40?1.5:1)));};
function setRel(a,b,v){rel[a][b]=rel[b][a]=v;}
function setTrade(a,b,v){tradeM[a][b]=tradeM[b][a]=v;}
function strength(id){
  let s=0;
  for(const t of terrs)if(t.owner===id)s+=tr(t)+3;
  for(const a of armies)if(a.owner===id)s+=sumU(a.u);
  return s;
}
function declareWar(a,b){
  if(a===b||!players[a].alive||!players[b].alive||isWar(a,b)||time<truce[a][b])return false;
  const wasAlly=rel[a][b]==='alliance',o0=opin[b][a];
  if(vas[a]===b){vas[a]=-1;addLog('Rébellion : '+pnm(players[a])+' se libère de '+pnm(players[b])+'.',players[a].color);}
  else if(vas[b]===a){vas[b]=-1;addLog(pnm(players[a])+' rompt la vassalité de '+pnm(players[b])+' et lui déclare la guerre.',players[a].color);}
  setRel(a,b,'war');setTrade(a,b,false);
  warSince[a][b]=warSince[b][a]=time;
  repMove(a,o0>20?-10:o0>-10?-3:0,o0>20?'guerre déclarée à '+players[b].name+', qui le tenait pour ami':'guerre déclarée à '+players[b].name);
  if(opin[b][a]>-10){players[a].x.ws=Math.max(0,players[a].x.ws-12);players[b].x.ws=Math.min(100,players[b].x.ws+12);}
  opin[b][a]=Math.max(-100,opin[b][a]-40);
  addLog(players[a].name+' déclare la guerre à '+players[b].name,players[a].color);
  for(const c of players){
    if(!c.alive||c.id===a||c.id===b)continue;
    const withB=rel[c.id][b]==='alliance',withA=rel[c.id][a]==='alliance';
    if(withB&&withA){setRel(c.id,a,'peace');}
    else if(withB&&!isWar(c.id,a)){setRel(c.id,a,'war');setTrade(c.id,a,false);warSince[c.id][a]=warSince[a][c.id]=time;addLog(c.name+' rejoint la guerre contre '+players[a].name,c.color);}
  }
  return true;
}
function vassalFree(seat,q){
  if(!players[q]||vas[q]!==seat)return 'Ce camp n\u2019est pas votre vassal.';
  vas[q]=-1;opin[q][seat]=Math.min(100,opin[q][seat]+15);repMove(seat,2);
  addLog(pnm(players[seat])+' libère '+pnm(players[q])+' de sa vassalité.',players[seat].color);
  return '';
}
function ultimatumPay(a,b){
  const amt=ultAmt(),P=players[b];
  P.gold-=amt;players[a].gold+=amt;
  opin[b][a]=Math.max(-100,opin[b][a]-15);repMove(a,-4,'ultimatum à '+pnm(P));
  addLog(pnm(P)+' cède à l\u2019ultimatum de '+pnm(players[a])+' ('+amt+' ฿).',players[a].color);
}
function applyDeal(kind,a,b){
  if(kind==='vassal'){
    if(rel[a][b]==='war'){setRel(a,b,'peace');truce[a][b]=truce[b][a]=time+60*PK;}
    vas[b]=a;vasSince[b]=time;opin[b][a]=Math.max(-100,opin[b][a]-10);
    addLog(pnm(players[b])+' devient vassal de '+pnm(players[a])+' ('+Math.round(TRIB*100)+' % de ses Berrys).',players[a].color);
    return;
  }
  if(kind==='ultim'){ultimatumPay(a,b);return;}
  if(kind==='peace'){setRel(a,b,'peace');truce[a][b]=truce[b][a]=time+60*PK;addLog(players[a].name+' et '+players[b].name+' signent la paix','#5fb3e6');}
  else if(kind==='alliance'){setRel(a,b,'alliance');addLog('Alliance entre '+players[a].name+' et '+players[b].name,'#4cc38a');}
  else if(kind==='trade'){setTrade(a,b,true);{const hs=[a,b].filter(x=>players[x].human);if(hs.length)addLog('Accord commercial : '+players[a].name+' et '+players[b].name,'#e0a43c',hs);}}
  opin[a][b]=Math.min(100,opin[a][b]+8);opin[b][a]=Math.min(100,opin[b][a]+8);
  {const g=kind==='alliance'?5:kind==='peace'?3:2;repMove(a,g);repMove(b,g);}
}
function breakAlliance(a,b){
  setRel(a,b,'peace');truce[a][b]=truce[b][a]=time+30*PK;
  opin[b][a]=Math.max(-100,opin[b][a]-30);
  repMove(a,-18,'rupture de l’alliance avec '+players[b].name);
  addLog(players[a].name+' rompt son alliance avec '+players[b].name,players[a].color);
}
function aiAccepts(q,p,kind){
  const o=opin[q][p]+repOf(p)*.4,rs=strength(p)/Math.max(1,strength(q));
  if(kind==='vassal')return rel[q][p]==='war'?rs>=VAS_RS_WAR:(rs>=VAS_RS_PEACE&&opin[q][p]>-30);
  if(kind==='ultim')return rs>=ULT_RS&&players[q].gold>=ultAmt();
  if(kind==='peace')return o+(rs-1)*35>-10||strength(q)<.6*strength(p);
  if(kind==='alliance')return o>30&&rel[q][p]==='peace';
  if(kind==='trade')return o>-5;
  return false;
}
function validDeal(kind,a,b){
  const r=rel[a][b];
  if(kind==='peace')return r==='war';
  if(kind==='alliance')return r==='peace';
  if(kind==='trade')return r!=='war'&&!tradeM[a][b];
  if(kind==='vassal')return (r==='peace'||r==='war')&&vas[a]<0&&vas[b]<0&&players[a].alive&&players[b].alive;
  if(kind==='ultim')return r==='peace'&&players[a].alive&&players[b].alive;
  return false;
}
function propose(a,b,kind){
  if(!validDeal(kind,a,b)||!players[b].alive)return;
  if(!payDeal(a,kind))return;
  if(players[b].human){
    if(!proposals.some(x=>x.from===a&&x.to===b&&x.kind===kind))proposals.push({from:a,to:b,kind,t:time});
  }else if(aiAccepts(b,a,kind))applyDeal(kind,a,b);
}
function humanPropose(a,kind,q){
  const P=players[q],me=players[a];
  if(!P||!P.alive||q===a)return 'Cible invalide.';
  if(kind==='trade'&&!me.techs.commerce)return 'Technologie requise : Commerce.';
  if(!validDeal(kind,a,q))return kind==='peace'?'Vous n\'êtes pas en guerre.':kind==='alliance'?'Il faut être en paix pour s\'allier.':kind==='vassal'?'Vassalité impossible : l\'un de vous est déjà vassal ou a un vassal lié à l\'autre, ou une alliance est en cours.':kind==='ultim'?'Un ultimatum n\'est possible qu\'entre camps en paix.':'Accord impossible ou déjà signé.';
  const dc=dealCost(me,kind);
  if(me.x.inf<dc)return 'Influence insuffisante ('+dc+' requis).';
  me.x.inf-=dc;
  if(P.human){
    if(!proposals.some(x=>x.from===a&&x.to===q&&x.kind===kind))proposals.push({from:a,to:q,kind,t:time});
    return 'Proposition envoyée à '+P.name+'.';
  }
  if(aiAccepts(q,a,kind)){applyDeal(kind,a,q);return '';}
  opin[q][a]=Math.max(-100,opin[q][a]-2);
  if(kind==='ultim'){
    const w=declareWar(a,q);
    return P.name+' refuse l\u2019ultimatum'+(w?' : la guerre est déclarée.':' (une trêve empêche la guerre).');
  }
  return P.name+' refuse votre proposition.';
}
function humanWar(a,q){
  if(!players[q]||!players[q].alive||q===a)return 'Cible invalide.';
  if(rel[a][q]==='alliance')return 'Rompez d\'abord l\'alliance.';
  if(time<truce[a][q])return 'Trêve en cours : encore '+Math.ceil(truce[a][q]-time)+' s.';
  declareWar(a,q);return '';
}
function vasTick(){
  for(let v=0;v<4;v++){
    const m=vas[v];if(m<0)continue;
    if(!players[v].alive||!players[m].alive){vas[v]=-1;addLog('La vassalité de '+pnm(players[v])+' envers '+pnm(players[m])+' prend fin.','#8c97a6');}
  }
}
function driftOpinions(){
  for(let a=0;a<4;a++)for(let b=0;b<4;b++){
    if(a===b)continue;
    const r=rel[a][b],o=opin[a][b];
    let d=0;
    if(r==='alliance')d=.3;
    else if(r==='peace'){if(o<30)d=.06;else if(o>45)d=-.05;}
    else d=-.4;
    if(tradeM[a][b]&&o<60)d+=.1;
    d+=repOf(b)*.002;
    opin[a][b]=clamp(o+d/PK,-100,100);
  }
  proposals=proposals.filter(x=>{
    if(time-x.t>45||!players[x.to].alive||!validDeal(x.kind,x.from,x.to)){opin[x.from][x.to]=Math.max(-100,opin[x.from][x.to]-1);return false;}
    return true;
  });
}
function acceptProposal(seat,key){
  const [f,kind]=key.split(':');
  const x=proposals.find(p=>p.from===+f&&p.to===seat&&p.kind===kind);
  if(!x)return '';
  if(kind==='ultim'&&players[seat].gold<ultAmt())return 'Berrys insuffisants ('+ultAmt()+' ฿ requis) : refusez ou attendez.';
  proposals=proposals.filter(p=>p!==x);
  if(!validDeal(kind,x.from,seat))return 'Cette proposition n\'est plus valable.';
  applyDeal(kind,x.from,seat);return '';
}
function refuseProposal(seat,key){
  const [f,kind]=key.split(':');
  proposals=proposals.filter(p=>!(p.from===+f&&p.to===seat&&p.kind===kind));
  if(players[+f])opin[+f][seat]=Math.max(-100,opin[+f][seat]-3);
  if(kind==='ultim'&&players[+f]&&rel[+f][seat]==='peace')declareWar(+f,seat);
  return '';
}
function giftGold(seat,q){
  const me=players[seat];
  if(!players[q]||!players[q].alive||q===seat)return 'Cible invalide.';
  if(me.gold<25)return 'Berrys insuffisants (25 requis).';
  me.gold-=25;opin[q][seat]=Math.min(100,opin[q][seat]+10);repMove(seat,2);
  if(players[q].human)players[q].gold+=25;
  return 'Cadeau offert à '+players[q].name+'.';
}
const moodOf=o=>o<-40?'Hostile':o<-10?'Méfiant':o<20?'Neutre':o<50?'Amical':'Très proche';

const fmtPrime=n=>(Math.round(n)*10000).toLocaleString('fr-FR')+' ฿';
function primeOf(id){
  let s=0;
  for(const t of terrs)if(t.owner===id){s+=100;if(t.city)s+=100*t.city.lvl;if(t.capital)s+=100;if(t.fruit)s+=300;if(t.pone)s+=300;}
  s+=150*chOwnedBy(id).length;
  for(const b of BS)if(b.by===id)s+=400;
  s+=evPrime(id);
  return s;
}
/* Toutes les ~110 s la Marine frappe le camp à la plus grosse prime s'il domine nettement : cela freine l'emballement. */
function marineTick(){
  if(over||time<marineAt-15)return;
  const arr=players.filter(p=>p.alive).map(p=>({p,s:primeOf(p.id)})).sort((a,b)=>b.s-a.s);
  const clear=arr.length>=2&&arr[0].s>=1.3*arr[1].s&&arr[0].s>=900;
  if(time<marineAt){
    if(!marineWarned&&clear){marineWarned=true;marineTarget=arr[0].p.id;addLog('Le Journal publie l\'avis de recherche de '+arr[0].p.name+' : prime '+fmtPrime(arr[0].s)+'. La Marine prépare un Buster Call.','#9ec5ff');}
    return;
  }
  if(marineWarned&&players[marineTarget]&&players[marineTarget].alive){
    const mine=terrs.filter(t=>t.owner===marineTarget&&!t.capital).sort((a,b)=>tr(b)-tr(a));
    const tg=mine[0]||terrs.find(t=>t.owner===marineTarget);
    if(tg){const k=CREWS[players[marineTarget].crew||0].bust||.7;tg.u=scaleU(tg.u,k);addLog('Buster Call de la Marine sur '+tg.name+' ('+players[marineTarget].name+') : −'+Math.round((1-k)*100)+' % de troupes.','#9ec5ff');}
  }
  marineAt=time+110*PK;marineWarned=false;
}

    if(r==='war'&&vas[p.id]<0&&vas[q.id]<0&&time>=warSince[p.id][q.id]+40*PK&&myS>=VAS_RS_WAR*1.1*qS&&Math.random()<.12){propose(p.id,q.id,'vassal');continue;}

      if(time>=warSince[p.id][q.id]+60*PK&&(myS<.75*qS||Math.random()<.015))propose(p.id,q.id,'peace');
    }else if(r==='peace'){

      const need=(!neutralAdj&&time>180*PK?.95:1.25)/p.ai.aggr;
      const wantWar=!busy&&adjacent&&time>=truce[p.id][q.id]&&time>170*PK&&(!neutralAdj||time>300*PK)&&myS>qS*need&&(o<60||(time>300*PK&&myS>qS*1.6));

      else if(o>45&&sharedEnemy(p.id,q.id))propose(p.id,q.id,'alliance');

function pickUnit(p,t){

function aiWant(p){const w=new Set(),cid=CREWS[p.crew||0].id;for(let i=0;i<LEGENDS.length;i++){const L=LEGENDS[i];if(CH[i].own>=0||!L.camps.includes(cid))continue;for(const n of recIsl(L.rec))w.add(n);}return w;}

function aiTactics(p){

function aiThink(p){
  const m=p.mod;

  aiTactics(p);
  const avail=TECHS.filter(t=>!p.techs[t.id]&&t.era<=AG.n+1&&t.req.every(r=>p.techs[r])).sort((a,b)=>p.ai.pref.indexOf(a.br)-p.ai.pref.indexOf(b.br)||a.era-b.era||a.cost-b.cost);
  if(avail.length&&p.sci>=avail[0].cost)buyTech(p,avail[0]);
  try{opAiThink(p);}catch(_){}
  {
    let bestT=null,bestC=1e9;
    for(const t of terrs){
      if(convertReason(p,t))continue;
      const sc=convertCost(t,p)*10+tr(t);
      if(sc<bestC){bestC=sc;bestT=t;}
    }
    if(bestT)convert(p,bestT);
  }
  aiDiplo(p);aiChars(p);aiDec(p);
  const mine=terrs.filter(t=>t.owner===p.id);
  if(!mine.length)return;
  const cities=mine.filter(t=>t.city);
  /* économie : on choisit un achat visé, on épargne pour lui, sauf si l'empire est menacé */
  const threat=mine.some(t=>t.nb.some(n=>terrs[n].owner>=0&&isWar(p.id,terrs[n].owner)));
  let want=null;
  for(const t of cities){
    if(want)break;
    if(!t.city.q&&usedSlots(t)<slotsOf(t)){
      for(const id of AIB){
        if(buildReason(p,t,id,true)===''){want={cost:BUILDINGS[id].cost+10,fn:()=>startBuild(p,t,id)};break;}
      }
    }
  }
  if(!want&&cities.length<2+Math.floor(time/110)){
    const cand=mine.filter(t=>!t.city&&t.u.guerrier>=CITY_UNITS+2).sort((a,b)=>(b.type==='plaine'?1:0)-(a.type==='plaine'?1:0)||tr(b)-tr(a));
    if(cand.length)want={cost:CITY_COST+10,fn:()=>foundCity(p,cand[0])};
  }
  if(!want&&p.ai.wonder){
    for(const w of WONDERS){
      if(want)break;
      for(const t of cities){
        if(buildReason(p,t,'w:'+w.id,true)===''){want={cost:w.cost+30,fn:()=>startBuild(p,t,'w:'+w.id)};break;}
      }
    }
  }
  if(!want){
    const up=cities.find(t=>t.city.lvl<3);
    if(up)want={cost:CITY_UP*up.city.lvl+50,fn:()=>upgradeCity(p,up)};
  }
  if(want&&p.gold>=want.cost){want.fn();want=null;}
  const totalUnits=mine.reduce((s,t)=>s+tr(t),0);

  const overArmed=!threat&&totalUnits>14*mine.length+20;

  const isFront=t=>t.nb.some(n=>canHit(p,terrs[n]));
  const fronts=mine.filter(isFront);
  let guard=0;
  while(guard++<2&&mine.length&&!saving&&!overArmed){
    let pick=null,ps=-1e9;
    for(const t of fronts){
      const warAdj=t.nb.some(n=>terrs[n].owner>=0&&isWar(p.id,terrs[n].owner));
      const sc=(warAdj?12:0)-tr(t);
      if(sc>ps){ps=sc;pick=t;}
    }
    if(!pick)pick=cities.find(t=>t.capital)||mine[0];

  }
  /* distance au front */
  const dist=new Map(),q=[];
  for(const t of fronts){dist.set(t.id,0);q.push(t.id);}
  while(q.length){
    const c=q.shift();
    for(const n of terrs[c].nb)if(terrs[n].owner===p.id&&!dist.has(n)){dist.set(n,dist.get(c)+1);q.push(n);}
  }
  for(const t of shuffle(mine)){
    const total=tr(t);
    if(total<4)continue;
    const foes=t.nb.map(i=>terrs[i]).filter(x=>canHit(p,x));
    if(!foes.length){
      if(!dist.has(t.id))continue;
      let nxt=-1,nd=dist.get(t.id);
      for(const n of t.nb)if(terrs[n].owner===p.id&&dist.has(n)&&dist.get(n)<nd){nd=dist.get(n);nxt=n;}
      if(nxt>=0)launch(p.id,t.id,nxt,1);
      continue;
    }
    const hasWar=foes.some(x=>x.owner>=0);
    const reserve=hasWar?Math.max(2,Math.ceil(total*.2)):1;
    const frac=clamp((total-reserve)/total,0,1);
    if(frac<=0||total*frac<3)continue;
    const avU=scaleU(t.u,frac);
    let best=null,bestScore=-1,bestRatio=0,bestRaw=0;
    const want=aiWant(p);
    for(const x of foes){
      const A=attTotal(p.id,avU,x,false,t.id),D=defTotal(x,avU,false);
      const ratio=A/(D+.5);
      const thr=(x.owner<0?1.4:1.5)*(x.fruit||x.pone?.85:1)/p.ai.aggr;
      if(ratio>=thr){
        const sc=ratio*(evTreasureAt(x.id)?1.5:1)*(x.owner<0?1.2:1)*(x.capital?1.8:1)*(x.fruit||x.pone?1.4:1)*(ISLE_FX[x.name]?1.15:1)*(want.has(x.name)?1.35:1)*regScore(p,x);
        if(sc>bestScore){bestScore=sc;best=x;bestRatio=ratio/thr;bestRaw=ratio;}
      }
    }
    if(best){
      const f=clamp(frac*(1.25/bestRatio),.3,frac);
      const rs=bestRaw*f/frac;
      launch(p.id,t.id,best.id,f,rs<1.7?1:rs>=2.4?2:0);
    }else{
      let tgt=null;
      for(const n of t.nb){const o=terrs[n];if(o.owner===p.id&&tr(o)>total&&(!tgt||tr(o)>tr(tgt)))tgt=o;}
      if(tgt&&total*frac>=4)launch(p.id,t.id,tgt.id,frac);
    }
  }
}

function initWaves(){

    const x=hsh(i*7+1)*W*.97+10,y=hsh(i*13+5)*H*.97+10;
    if(Math.abs(x-RL_X)<RL_HW+8)continue;
    if((y>=BELTS[0][0]-6&&y<=BELTS[0][1]+6)||(y>=BELTS[1][0]-6&&y<=BELTS[1][1]+6))continue;
    if(grid){const gi=Math.floor(y/CELL)*GW+Math.floor(x/CELL);if(grid[gi]>=0||(coast&&coast[gi]))continue;}
    WAVES.push({x,y,s:5+hsh(i*3+2)*7,p:hsh(i*11+3)*6.283});
  }
}

/* production réelle d'un territoire : mêmes formules que income(), par seconde de jeu */
function tProd(t,p){
  const y=TYPES[t.type];let gg=y.g,ss=y.s,ff=y.f;
  if(t.spec&&!t.city){if(t.spec==='g')gg=gg*1.8+.18;else if(t.spec==='s')ss=ss*1.8+.22;else if(t.spec==='f')ff=ff*1.8+.18;}
  if(t.city){gg+=.25;ss+=.1;ff+=.05;}
  if(t.capital){gg+=.8;ss+=.6;ff+=.4;}
  if(t.city){
    const lm=1+.35*(t.city.lvl-1);gg*=lm;ss*=lm;ff*=lm;
    for(const b of t.city.b){const bi=BLD_INCOME[b];if(bi){gg+=bi.g||0;ss+=bi.s||0;ff+=bi.f||0;}}
  }
  const m=p.mod,Z=1/PK,tb=Math.min(.2,tradePartners(p.id)*.1);
  return {g:gg*(1+m.gold+tb)*p.inc*Z,s:ss*(1+m.sci)*p.inc*Z,f:ff*(1+m.faith)*p.inc*Z};
}
/* effet affiché d'un bâtiment : pour les bâtiments de revenu, la valeur réelle au rythme de la partie */
function bDesc(id,p){
  const bi=BLD_INCOME[id];
  if(!bi)return BUILDINGS[id].d;
  const m=p.mod,Z=1/PK;
  const o=[];
  if(bi.g)o.push('+'+f2(bi.g*(1+m.gold)*p.inc*Z)+' ฿/s');
  if(bi.s)o.push('+'+f2(bi.s*(1+m.sci)*p.inc*Z)+' savoir/s');
  if(bi.f)o.push('+'+f2(bi.f*(1+m.faith)*p.inc*Z)+' Volonté/s');
  return o.join(', ')+(BUILDINGS[id].rel?'. Une Voie est requise.':'.');
}

/* ---- événements du monde : bandeau et avis de recherche ---- */
const EVQ=[];let evBusy=false;
function worldEvent(text,color){
  try{sndBanner(text);}catch(_){}
  const m=/avis de recherche de (.+?) : prime (.+?)\./.exec(text);
  if(m)EVQ.push({k:'poster',n:m[1],p:m[2],col:color});
  else if(/^Événement : (.+?) — /.test(text)){const mm=/^Événement : (.+?) — (.*)$/.exec(text);EVQ.push({k:'ban',t:mm[1],s:mm[2].slice(0,140),col:color});}
  else if(/^Mission accomplie|^Succès débloqué/.test(text))EVQ.push({k:'ban',t:/^Mission/.test(text)?'Mission accomplie':'Succès débloqué',s:text.replace(/^[^:]+ : /,'').slice(0,140),col:'#f2c75c'});
  else if(/^Buster Call/.test(text))EVQ.push({k:'ban',t:'Buster Call',s:text,col:'#ff7a6a'});
  else if(/^Un nouvel âge commence/.test(text))EVQ.push({k:'ban',t:'Nouvel âge',s:text.replace('Un nouvel âge commence : ',''),col:'#f2c75c'});
  else if(/^Le complot|^Buster Call général/.test(text))EVQ.push({k:'ban',t:'Crise',s:text,col:'#ff7a6a'});
  if(EVQ.length>4)EVQ.shift();
  evNext();
}
function evNext(){
  if(evBusy||!EVQ.length)return;
  const el=document.getElementById('evt');if(!el)return;
  const e=EVQ.shift();evBusy=true;
  if(e.k==='poster'){
    const pl=players.find(x=>x.name===e.n),ic=pl?CREWS[pl.crew||0].ic:'☠';
    el.className='evt poster';
    el.innerHTML='<div class="wp"><div class="wt">Wanted</div><div class="wi" style="color:'+(pl?pl.color:'#3a2a1a')+'">'+ic+'</div><div class="wn">'+esc(e.n)+'</div><div class="wd">Prime</div><div class="wb">'+esc(e.p)+'</div></div>';
  }else{
    el.className='evt ban';el.style.setProperty('--c',e.col);
    el.innerHTML='<b>'+esc(e.t)+'</b><span>'+esc(e.s)+'</span>';
  }
  el.hidden=false;
  setTimeout(()=>{el.hidden=true;evBusy=false;setTimeout(evNext,350);},e.k==='poster'?5200:3600);
}

/* ================= Interactions sur la carte ================= */
function pos(e){const r=canvas.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;return {x:V.x+fx*W/V.k,y:V.y+fy*H/V.k,sx:e.clientX-r.left,sy:e.clientY-r.top};}
function clampV(){V.k=clamp(V.k,1,3.5);V.x=clamp(V.x,0,W-W/V.k);V.y=clamp(V.y,0,H-H/V.k);}
function zoomAt(fx,fy,f){const wx=V.x+fx*W/V.k,wy=V.y+fy*H/V.k;V.k=clamp(V.k*f,1,3.5);V.x=wx-fx*W/V.k;V.y=wy-fy*H/V.k;clampV();}
function centerOn(id){const t=terrs[id];if(!t||V.k<=1)return;V.x=t.x-W/V.k/2;V.y=t.y-H/V.k/2;clampV();}
function terrAt(x,y){
  const gx=Math.floor(x/CELL),gy=Math.floor(y/CELL);
  if(gx<0||gy<0||gx>=GW||gy>=GH)return -1;
  const id=grid[gy*GW+gx];
  if(id>=0)return id;
  /* îles petites : on accepte un toucher à côté (marge de 22 unités, plus large que l'île sur téléphone) */
  let best=-1,bd=1e9;
  for(const t of terrs){const d=Math.hypot(x-t.x,y-t.y)-t.rad;if(d<22&&d<bd){bd=d;best=t.id;}}
  return best;
}

const ptsMap=new Map();let pinch=null;
canvas.addEventListener('pointerdown',e=>{
  if(!started||over)return;
  ptsMap.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  if(ptsMap.size===2){
    const [a,b]=[...ptsMap.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    drag=null;return;
  }
  const p=pos(e);ptr=p;
  const id=terrAt(p.x,p.y);
  drag={id,x:p.x,y:p.y,sx:p.sx,sy:p.sy,moved:false,pan:!(id>=0&&terrs[id].owner===ME),vx:V.x,vy:V.y};
});
canvas.addEventListener('pointermove',e=>{
  if(!grid)return;
  if(ptsMap.has(e.pointerId))ptsMap.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptsMap.size>=2){
    const [a,b]=[...ptsMap.values()],r=canvas.getBoundingClientRect();
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    zoomAt((cx-r.left)/r.width,(cy-r.top)/r.height,d/pinch.d);
    V.x-=(cx-pinch.cx)/r.width*W/V.k;V.y-=(cy-pinch.cy)/r.height*H/V.k;clampV();
    pinch.d=d;pinch.cx=cx;pinch.cy=cy;return;
  }
  const p=pos(e);ptr=p;
  const id=terrAt(p.x,p.y);
  if(id!==ui.hover){ui.hover=id;dirty=true;}
  if(drag){
    if(Math.hypot(p.sx-drag.sx,p.sy-drag.sy)>8)drag.moved=true;
    if(drag.moved&&drag.pan){const r=canvas.getBoundingClientRect();V.x=drag.vx-(p.sx-drag.sx)/r.width*W/V.k;V.y=drag.vy-(p.sy-drag.sy)/r.height*H/V.k;clampV();}
  }
});
canvas.addEventListener('pointerleave',()=>{if(ui.hover!==-1){ui.hover=-1;dirty=true;}});
canvas.addEventListener('pointercancel',e=>{ptsMap.delete(e.pointerId);drag=null;if(ptsMap.size<2)pinch=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,Math.exp(-e.deltaY*.0016));},{passive:false});
canvas.addEventListener('pointerup',e=>{
  ptsMap.delete(e.pointerId);
  if(pinch){if(ptsMap.size<2)pinch=null;drag=null;return;}
  if(!drag)return;
  const p=pos(e),to=terrAt(p.x,p.y),from=drag.id,moved=drag.moved,pan=drag.pan;
  drag=null;
  if(!started||over)return;
  if(moved&&pan)return;
  if(ui.mode==='convert'){
    if(to>=0)cmd({k:'conv',to});
    renderPanel(true);return;
  }
  if(moved&&from>=0&&to>=0&&from!==to&&terrs[from].owner===ME){
    cmd({k:'launch',f:from,to,pct:ui.pct,st:ui.stance|0});
    return;
  }
  if(to<0){ui.sel=-1;dirty=true;renderPanel(true);return;}
  const sel=ui.sel>=0?terrs[ui.sel]:null;
  if(sel&&sel.owner===ME&&to!==ui.sel&&terrs[to].owner!==ME&&sel.nb.includes(to)){
    cmd({k:'launch',f:ui.sel,to,pct:ui.pct,st:ui.stance|0});
    return;
  }
  ui.sel=to;TU.clk=1;dirty=true;
  renderPanel(true);
});

function campVal(o){
  const p=players[ME];if(!p||!p.x)return 0;
  if(o.k==='isl'){let n=0;for(const t of terrs)if(t.owner===ME)n++;return n;}
  if(o.k==='rv')return players.filter(q=>q.id!==ME&&(!q.alive||vas[q.id]===ME)).length;
  if(o.k==='te')return Object.keys(p.techs).length;
  return (p.x.st&&p.x.st[o.k])|0;
}

  const C=CAMPS[ci];if(!C||!campOpen(ci))return null;
  const p=players[ME];let her=0;
  for(let j=0;j<ci;j++)her+=(PROFILE.camp[CAMPS[j].id]|0);
  const gold=Math.round((C.gold+40*her)*PK/6);
  for(const id of C.tech)if(TECH[id])p.techs[id]=1;
  p.gold+=gold;recalc(p);
  addLog('Campagne — '+C.sub+' : « '+C.n+' ». '+C.tx,'#f2c75c',ME);
  if(gold>0||C.tech.length)addLog('Acquis de départ : '+(gold>0?gold+' ฿':'')+(gold>0&&C.tech.length?' et ':'')+(C.tech.length?C.tech.map(id=>TECH[id].n).join(', '):'')+(her?' (dont '+Math.round(40*her*PK/6)+' ฿ d’héritage : '+her+' étoile'+(her>1?'s':'')+').':'.'),'#f2c75c',ME);

  return '<div class="card"><h3>'+esc(C.n)+' · '+starStr(CAMP.stars)+'</h3>'+campObjRows(CAMP.res)
    +'<p class="note">'+(win?'Chapitre réussi : '+CAMP.stars+' étoile'+(CAMP.stars>1?'s':'')+'.':'Chapitre manqué : aucune étoile.')+' Meilleur résultat : '+starStr(PROFILE.camp[C.id]|0)+'.</p></div>';
}

function rulesHTML(){
  const pc=x=>Math.round(x*100)+' %';
  const ur=Object.keys(UNITS).map(k=>{const u=UNITS[k];return '<tr><td><b>'+u.n+'</b></td><td>'+u.atk+'</td><td>'+u.def+'</td><td>×'+u.spd+'</td><td>'+u.cost+' ฿ pour '+u.batch+'</td><td>'+(u.tech?TECH[u.tech].n:'—')+'</td></tr>';}).join('');
  const bl=Object.values(BUILDINGS).map(b=>'<li><b>'+b.n+'</b> ('+b.cost+' ฿, '+b.time+' s) : '+b.d+(b.tech?' Requiert '+TECH[b.tech].n+'.':'')+'</li>').join('');
  const wl=WONDERS.map(w=>'<li><b>'+w.n+'</b> ('+w.cost+' ฿, '+w.time+' s) : '+w.d+' Un seul exemplaire dans le monde. Requiert '+TECH[w.tech].n+'.</li>').join('');
  const rl=RELS.map(r=>'<li><b>'+r.ic+' '+r.n+'</b> : '+r.d+'</li>').join('');
  const fl=FRUIT_KEYS.map(k=>'<li><b>'+FRUITS[k].n+'</b> : '+FRUITS[k].d+'</li>').join('');
  const sec=(t,b,o)=>'<details'+(o?' open':'')+'><summary>'+t+'</summary><div class="rb">'+b+'</div></details>';
  return '<div class="rl">'
  +sec('Le but du jeu',
    '<p>Quatre camps (Marine, Pirates, Révolutionnaires, Chasseurs de prime) se disputent les îles. Deux modes au choix : <b>tours simultanés</b> (par défaut) ou <b>temps réel</b>, où tout avance en continu (pause possible en solo ; en ligne, seul l\'hôte la règle).</p>'
    +'<p>La partie suit les règles de <b>Civilization VII</b>, adaptées à la Grand Line : <b>trois âges</b> calés sur les grandes sagas de One Piece (East Blue, Sommet, Nouveau Monde). Chacun a ses technologies, ses voies d\'Héritage et sa crise, et chaque transition vous laisse changer de camp. On gagne <b>au Nouveau Monde</b> en achevant un projet de victoire (après avoir accompli une voie d\'Héritage), ou, si personne n\'y parvient avant la fin du Nouveau Monde, <b>aux points</b>.</p>'
    +'<p>Autres fins : être le dernier camp en vie, ou que tous les camps survivants soient alliés (victoire commune). Un camp est éliminé quand il n\'a plus de territoire ni d\'armée en route ; en ligne, il peut alors observer la carte. La partie est perdue quand plus aucun humain n\'est en vie.</p>',true)
  +sec('Les trois âges',
    '<p>Chaque âge a une <b>jauge de progression</b> (en haut : ⌛). Elle avance avec le temps, les conquêtes, les éliminations et les jalons des joueurs. À 100 %, l\'âge s\'achève : '+AGES.map((a,i)=>'<b>'+ROMAN[i]+' · '+a.n+'</b> ('+a.sub+')').join(', ')+'. Durée visée par âge au rythme choisi : '+AGES.map(a=>fmtDur(a.eff*PK)).join(', ')+' (mesurée en simulation entre IA ; les humains qui réfléchissent rallongent la partie, et un projet de victoire ou une élimination l\'abrège).</p>'
    +'<p>Les technologies sont rangées par âge : celles de l\'âge suivant restent verrouillées. À la différence de Civilization VII, vos technologies <b>ne sont pas réinitialisées</b> à la transition (cela supprimerait vos unités).</p>')
  +sec('Combat arcade (prototype)',
    '<p>Depuis l\'écran d\'accueil, <b>Combat arcade</b> ouvre un mode d\'action en temps réel, séparé du jeu de stratégie : un équipage de trois (<b>Luffy, Zoro, Sanji</b>) prend d\'assaut la base de Shells Town : quatre vagues de Marines, puis le capitaine <b>Morgan</b> en deux phases.</p>'
    +'<p><b>Commandes</b> : clic droit ou flèches pour se déplacer, clic gauche pour attaquer (enchaînement de 3 coups), <b>Q, W, E, R</b> pour les compétences (A et Z marchent aussi sur un clavier AZERTY), <b>Espace</b> pour esquiver, <b>1, 2, 3</b> ou <b>Tab</b> pour changer de personnage, <b>F</b> et <b>G</b> pour les assistances, <b>T</b> pour l\'attaque combinée. Au tactile : touchez le sol ou un ennemi, et utilisez les boutons du bas.</p>'
    +'<p><b>Règles</b> : les zones rouges annoncent les attaques. Esquiver un coup au bon moment donne une esquive parfaite. Les coups enchaînés font monter un compteur de combo (dégâts +1 % par coup, 30 % au plus) qui retombe à zéro si vous êtes touché. L\'équipage gagne des niveaux pendant la mission ; les ultimes (Gear 5, Ashura, Diable Jambe) se débloquent au niveau 3. Chaque personnage a son passif et son rôle ; un personnage au repos récupère ses PV et peut intervenir en assistance ; la jauge de duo, remplie par les coups portés et les esquives parfaites, permet une attaque combinée. Les synergies dépendent de qui est dans l\'équipe. Si le personnage actif tombe, le suivant entre en scène ; les K.O. se relèvent entre deux vagues. La fin de mission donne un rang C, B, A ou S.</p>'
    +'<p>C\'est la première étape d\'une refonte en plusieurs phases : trois personnages et une seule mission pour l\'instant. Les personnages sont des pions (couleur et initiale), pas des dessins. Tous les chiffres sont mes choix d\'équilibrage.</p>')
  +sec('Mode Campagne',
    '<p>Depuis l\'écran d\'accueil, <b>Campagne</b> propose trois chapitres en solo : '+CAMPS.map(c=>'<b>'+c.n+'</b> ('+DIFF[c.dk].n.toLowerCase()+')').join(', ')+'. Chaque chapitre a sa carte fixe, un temps maximum et des objectifs.</p>'
    +'<p><b>Objectifs principaux</b> : il faut tous les remplir avant la fin du temps imparti ; le chapitre s\'achève aussitôt, par une victoire. Toute victoire de la partie (dernier camp en mer, projet achevé, domination…) vaut aussi réussite, même sans les objectifs. Temps écoulé ou camp tombé : échec. <b>Étoiles</b> : 1 pour la réussite, +1 par objectif bonus rempli (dont un objectif de rapidité), 3 au maximum. Le chapitre suivant se débloque dès une étoile.</p>'
    +'<p><b>Acquis de départ et héritage</b> : les chapitres II et III démarrent avec des Berrys et des technologies de base, plus 40 ฿ par étoile déjà gagnée dans les chapitres précédents. Les durées sont données au rythme Standard et s\'adaptent au rythme choisi.</p>'
    +'<p>Seuls les noms de chapitres reprennent les sagas de l\'œuvre ; difficulté, seuils, durées et acquis de départ sont mes choix d\'équilibrage. Le mode Campagne est solo uniquement ; votre progression et le journal de campagne sont stockés dans ce navigateur.</p>')
  +sec('Rythme de la partie',
    '<p>Le <b>Rythme</b> (menu de départ) étire toute la partie, un peu comme les vitesses de partie et les longueurs d\'âge de Civilization VII, mais sur un facteur unique : il divise les revenus (Berrys, Savoir, Volonté, Influence), les recrues naturelles et l\'avancée de la jauge d\'âge, et il allonge d\'autant les minuteurs (Buster Call, trêves, ambassades, projets de victoire). Les coûts et la vitesse des armées ne changent pas. Rythme actuel : <b>×'+PK+'</b>, soit une partie entre IA d\'environ '+fmtDur(PACE_MIN()*PK*60)+'. Choix : '+PACES.map(z=>'<b>'+z.n+'</b> ×'+z.k).join(', ')+'.</p>'
    +'<p>Civilization VII compte plus d\'une centaine de tours par âge (les sources divergent : 75 à 125 tours à vitesse standard selon le wiki, 150 à 200 selon le journal de développement de lancement). Ici, en tours simultanés, un tour dure '+TURN_LEN+' s de jeu : au rythme Standard, un âge fait environ '+Math.round(AGES[0].eff*PK/TURN_LEN)+' tours.</p>')
  +sec('Voies d\'Héritage',
    '<p>Quatre voies par âge : '+PATHS.map(P=>'<b>'+P.ic+' '+P.n+'</b> ('+P.m+')').join(', ')+'. Chacune a <b>3 jalons</b> (seuils croissants d\'âge en âge), qui rapportent des Berrys, un peu de progression d\'âge et des <b>points d\'Héritage</b> : 1 point de la voie par jalon, un point d\'Attribut au 2e, un point joker au 3e.</p>'
    +'<p>Les 3 jalons d\'une voie ouvrent une option d\'<b>Âge d\'or</b> pour l\'âge suivant (un seul choix) ; zéro jalon ouvre une option d\'<b>Âge sombre</b> (un bonus payé d\'un malus). Les voies repartent de zéro à chaque âge.</p>')
  +sec('Crise',
    '<p>Aux âges I et II, une crise éclate à '+CRI_AT[0]+' % de la jauge ('+AGES[0].cr+', puis '+AGES[1].cr+'). Trois emplacements de <b>politiques de crise</b> s\'ouvrent à '+CRI_AT.join(' %, ')+' % : chaque camp adopte l\'un de deux inconvénients (délai de 30 s, puis choix au hasard). Quand la jauge est pleine, un événement frappe tous les camps : leurs 3 plus grosses garnisons hors capitale perdent '+Math.round(CRI_EVENT[0].loss*100)+' % (âge I) ou '+Math.round(CRI_EVENT[1].loss*100)+' % (âge II) de leurs troupes ; la Marine y perd moitié moins. La crise donne aussi un point d\'Attribut. Il n\'y en a pas au Nouveau Monde.</p>')
  +sec('Transition d\'âge',
    '<p>Le jeu s\'arrête pour tous. Chaque joueur choisit : <b>1.</b> son <b>camp</b> pour l\'âge suivant (changement de civilisation ; en cas de conflit, le meilleur score l\'emporte ; il n\'y a pas de chaîne de déblocage comme dans Civilization VII) ; <b>2.</b> ses <b>options d\'Héritage</b> : Âge d\'or, Âge sombre, ou options ordinaires payées en points. Les options durent un âge. Un point d\'Attribut est offert. Temps limité à 90 s ; l\'IA décide tout de suite.</p>')
  +sec('Influence, îles indépendantes, soutien de guerre',
    '<p><b>⚜ Influence</b> : une ressource qui s\'accumule (0,22/s, plus le commerce et les Attributs). Elle paie les accords diplomatiques (paix '+DEAL_COST.peace+', commerce '+DEAL_COST.trade+', alliance '+DEAL_COST.alliance+') et les <b>ambassades</b> : une île neutre qui touche vos terres (hors légendes, Fruits et Poneglyphes) peut rejoindre votre camp sans combat, pour 8 + 0,9 par soldat de garnison (une ambassade toutes les '+fmtDur(25*PK)+'). C\'est l\'équivalent des puissances indépendantes de Civilization VII.</p>'
    +'<p><b>Soutien de guerre</b> : 50 au départ. Déclarer la guerre à un camp qui ne vous est pas hostile vous fait perdre 12 points et lui en donne 12 ; une conquête vous en rapporte 3 et lui en retire 3 ; la paix le ramène vers 50. Sous 35, la <b>lassitude de guerre</b> réduit votre attaque et vos Berrys (jusqu\'à −20 % et −10 %). L\'Influence achète du soutien (+12 pour '+WS_COST+' ⚜).</p>')
  +sec('Attributs, Maîtrise, villages',
    '<p><b>Attributs</b> (6 familles, 5 rangs) : le dirigeant progresse toute la partie avec les points gagnés à chaque âge, à la crise et aux 2es jalons. <b>Maîtrise</b> : une technologie découverte peut être approfondie (coût ×1,5) pour +50 % de ses effets.</p>'

  +sec('Victoires du Nouveau Monde',
    '<p>À l\'âge III, accomplir une voie d\'Héritage (3 jalons) débloque son <b>projet</b> : '+PROJ.map(P=>'<b>'+P.ic+' '+P.n+'</b> (voie '+PATHS[P.pi].n+' ; condition : '+P.reqT+')').join(' ; ')+'. Il coûte des ressources, dure '+fmtDur(PROJ_LEN*PK)+' (−6 % par point d\'Héritage de la voie, jusqu\'à −50 %), et s\'effondre si vous perdez votre capitale. <b>Le premier projet achevé gagne.</b> Si aucun ne l\'est quand l\'âge III arrive à 100 %, le meilleur <b>score</b> l\'emporte. Dernier camp en vie et alliance générale restent des fins possibles ; la domination à 55 % et les 4 Poneglyphes de l\'ancienne version n\'existent plus (les Poneglyphes servent à l\'Expédition à Laugh Tale).</p>')
  +sec('Ce qui n\'est pas repris de Civilization VII',
    '<p>Commandants et armées empilées, sièges par quartier, ressources à assigner, célébrations et bonheur, événements narratifs, légendes et mementos hors partie, tables de diplomatie détaillées, et l\'arbre de technologies qui se réinitialise. Les âges sont aussi bien plus courts que dans Civilization VII.</p>')
  +sec('Tours simultanés',
    '<p>Chaque tour a deux temps. <b>Phase d\'ordres</b> : le temps est arrêté, tout le monde joue en même temps. Achetez, construisez, étudiez, négociez, et ordonnez des mouvements de troupes (glissez d\'un de vos territoires vers un voisin, ou cliquez-le puis cliquez la cible). Un mouvement n\'est qu\'un <i>ordre</i> : il apparaît en flèche pointillée et part à la fin de la phase. Vous pouvez l\'annuler.</p>'
    +'<p>Cliquez <b>Fin de tour</b> quand vous êtes prêt ; la résolution démarre quand tous les joueurs humains le sont (ou quand le minuteur choisi par l\'hôte tombe). <b>Résolution</b> : '+TURN_LEN+' secondes de jeu où armées, combats, revenus et IA avancent ; vous ne pouvez plus donner d\'ordres (sauf répondre aux propositions de traité). Les armées en route continuent au tour suivant.</p>'
    +'<p>Les revenus s\'affichent par tour. Les ordres de plusieurs joueurs partent « en même temps », mais leur ordre d\'exécution tourne d\'un tour à l\'autre pour ne favoriser personne. <b>L\'IA joue pendant la résolution</b>, comme en temps réel : elle ne planifie pas avec vous.</p>')
  +sec('Régions et zoom',
    '<p>La carte est un monde de One Piece simplifié, identique à chaque partie : la <b>Red Line</b> le traverse au milieu, la <b>Grand Line</b> le coupe en deux (Paradise à droite, le Nouveau Monde à gauche), et les quatre Blues occupent les coins (East et North Blue en haut, South et West Blue en bas). Les îles sont reliées par des <b>routes maritimes</b> (pointillés blancs) : on ne peut envoyer des troupes, rallier ou convertir qu\'entre îles reliées. Les pointillés orange sont des traversées de la Calm Belt ; l\'autre passage entre une Blue et la Grand Line est le Cap des Jumeaux, au pied de Reverse Mountain (depuis East et North Blue). La carte compte '+regs.length+' régions. <b>Tenir toutes les îles d\'une région</b> donne son bonus tant que vous les gardez. Le bonus indiqué est celui d\'une région de 8 îles ; il est proportionnel à la taille réelle de la région (de ×0,5 à ×1,4), visible dans l\'onglet Armée :</p><ul>'+REGIONS.map(R=>'<li><b>'+R.n+'</b> : '+fxText(R.fx)+'. <i>'+R.w+'</i></li>').join('')+'</ul>'
    +'<p>Chaque camp part de sa capitale : la Marine à '+MAP_CAPS.marine+', les Pirates à '+MAP_CAPS.pirate+', les Révolutionnaires à '+MAP_CAPS.revo+', les Chasseurs de prime à '+MAP_CAPS.chasseur+'. Chaque île est placée dans sa mer d\'après l\'œuvre (les Blues comptent donc peu d\'îles, Paradise et le Nouveau Monde beaucoup) ; quand l\'œuvre ne dit pas où se trouve une île (God Valley), sa mer est une interprétation, et la place exacte des îles dans leur mer l\'est toujours. Une partie sauvegardée avant ce changement se recharge sur l\'ancienne carte. Le numéro de carte ne change que la garnison de départ des îles et l\'emplacement des Fruits du Démon. L\'IA cherche à compléter les régions.</p>'
    +'<p><b>Zoom</b> : molette de la souris, pincement à deux doigts, ou boutons + / − sur la carte ; ⌂ revient à la vue d\'ensemble. Pour déplacer la carte, glissez depuis la mer ou depuis un territoire qui n\'est pas à vous (depuis un de vos territoires, un glissement envoie des troupes).</p>')
  +sec('Lire l\'écran',
    '<p><b>En haut</b> : vos ressources avec leur revenu (par tour ou par seconde), le nombre de territoires et sa progression vers la victoire, vos troupes et vos Poneglyphes. Passez la souris sur une icône pour son nom. <b>Dessous</b> : le tableau des camps, avec territoires, troupes, et votre relation avec chacun.</p>'

  +sec('Carte et territoires',

    +'<ul><li><b>Plage</b> : la plus riche en Berrys, défense ×'+TYPES.plaine.def+'.</li><li><b>Jungle</b> : un peu de Volonté, défense ×'+TYPES.foret.def+'.</li><li><b>Volcan</b> : le plus riche en Savoir, défense ×'+TYPES.montagne.def+'.</li></ul>'
    +'<p>Chaque territoire reçoit des renforts tout seul (des Recrues, +0,05 par seconde, +0,15 de plus sur la capitale) jusqu\'à une garnison de 30. Votre capitale est plus riche et mieux défendue (×1,25).</p>')
  +sec('Envoyer des troupes et combattre',
    '<ul><li>Glissez d\'un de vos territoires vers un voisin, ou sélectionnez-le puis cliquez sur le voisin. Les boutons 25 / 50 / 75 / 100 % choisissent la part de la garnison envoyée (il en reste toujours au moins une).</li>'
    +'<li>L\'armée voyage, puis combat à l\'arrivée. Elle va à la vitesse de son unité la plus lente.</li>'

function showRules(){
  let el=document.getElementById('rulesov');
  if(!el){el=document.createElement('div');el.id='rulesov';el.className='rulesov';document.body.appendChild(el);}
  el.hidden=false;
  el.innerHTML='<div class="rulesbox" role="dialog" aria-label="Règles du jeu"><h2>Règles du jeu</h2><p class="note">Touchez un titre pour le déplier. La partie continue pendant que vous lisez.</p>'+rulesHTML()+'<button class="btn primary" id="rules-close">Fermer</button></div>';
  document.getElementById('rules-close').addEventListener('click',()=>{el.hidden=true;});
  el.addEventListener('click',e=>{if(e.target===el)el.hidden=true;});
}

/* Principe : chaque joueur ne reçoit que SA vue (techs, ressources, composition des armées des autres masquées).
   Les messages de la room sont lus par tout le monde : chaque vue est donc chiffrée (ECDH P-256 + AES-GCM)

async function genKeys(){
  const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  return {priv:kp.privateKey,pub:b64(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)))};

async function deriveKey(priv,pubB64){
  const pk=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);
  return crypto.subtle.deriveKey({name:'ECDH',public:pk},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

async function pack(key,obj){
  let bytes=enc8.encode(JSON.stringify(obj)),flag=0;
  if(typeof CompressionStream==='function'){
    try{bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());flag=1;}catch(_){}
  }
  const plain=new Uint8Array(bytes.length+1);plain[0]=flag;plain.set(bytes,1);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);

async function unpack(key,str){
  const all=unb64(str);
  const data=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:all.subarray(0,12)},key,all.subarray(12)));
  let body=data.subarray(1);
  if(data[0]===1)body=new Uint8Array(await new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(dec8.decode(body));
}
