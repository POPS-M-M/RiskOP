  if(Array.isArray(v.BS))v.BS.forEach((e,i)=>{if(BS[i]&&Array.isArray(e)){BS[i].hp=Math.max(0,+e[0]||0);BS[i].dead=!!e[1];BS[i].by=(e[2]|0)>=0&&(e[2]|0)<4?e[2]|0:-1;}});
  if(Array.isArray(v.BR)){
    for(const e of v.BR){
      if(!e||typeof e.id!=='number'||BATTLES.some(x=>x.id===e.id)||!terrs[e.to])continue;
      const r={id:e.id,t:+e.t||0,to:e.to|0,tn:String(e.tn||'').slice(0,40),from:e.from|0,att:e.att|0,def:(e.def|0)>=0&&(e.def|0)<4?e.def|0:-1,win:!!e.win,ty:String(e.ty||''),
        city:!!e.city,wall:!!e.wall,cap:!!e.cap,au:e.au,du:e.du,au2:e.au2,du2:e.du2,A:+e.A||0,D:+e.D||0,ab:+e.ab||0,am:+e.am||1,an:+e.an||1,lat:+e.lat||0,hunt:+e.hunt||0,
        sa:Math.max(0,Math.min(2,e.sa|0)),ast:+e.ast||1,fo:+e.fo||1,db:+e.db||0,dm:+e.dm||1,tt:+e.tt||1,df:+e.df||1,dn:+e.dn||1,cut:+e.cut||0,ldd:+e.ldd||0,la:String(e.la||'').slice(0,24),ld:String(e.ld||'').slice(0,24)};
      if(e.bs&&typeof e.bs==='object'&&BOSSES[e.bs.i|0]){const z=e.bs;r.bs={i:z.i|0,h0:+z.h0||0,h1:+z.h1||0,mx:+z.mx||1,p0:Math.max(0,Math.min(2,z.p0|0)),p1:Math.max(0,Math.min(2,z.p1|0)),end:String(z.end||'dead').slice(0,5),
        rounds:(Array.isArray(z.rounds)?z.rounds:[]).slice(0,12).map(x=>[Math.max(0,Math.min(2,x[0]|0)),+x[1]||0,+x[2]||0])};}
      BATTLES.push(r);if(BATTLES.length>60)BATTLES.shift();
      brShow(r);
    }
  }
  if(Array.isArray(v.tm)){
    TM.on=true;TM.phase=v.tm[0]?'res':'plan';TM.n=v.tm[1]|0;TM.res=+v.tm[2]||0;TM.planMax=v.tm[3]>=0?1:0;TM.planLeft=+v.tm[3];
    TM.ready=[0,1,2,3].map(i=>!!(v.tm[4]&&v.tm[4][i]));
    TM.queue=(Array.isArray(v.Q)?v.Q:[]).filter(o=>Array.isArray(o)&&terrs[o[0]]&&terrs[o[1]]).map(o=>({s:ME,f:o[0],to:o[1],pct:+o[2]||.5,st:Math.max(0,Math.min(2,o[3]|0))}));
  }else{TM.on=false;TM.queue=[];}
  for(let a=0;a<4;a++)for(let b=0;b<4;b++)rel[a][b]=a===b?'peace':(ABBR[v.R[a][b]]||'peace');
  for(let q=0;q<4;q++){tradeM[ME][q]=tradeM[q][ME]=!!v.X[q];truce[ME][q]=v.TC[q]||0;opin[q][ME]=v.O[q]||0;}
  armies=v.A.map(a=>{const u=emptyU();if(Array.isArray(a[3]))UK.forEach((k,j)=>{u[k]=+a[3][j]||0;});else u.guerrier=+a[3]||0;return {owner:a[0],from:a[1],to:a[2],u,t:a[4],dur:a[5],s:Math.max(0,Math.min(2,a[6]|0)),id:a[7]|0,rt:a[8]?1:0};});
  if(Array.isArray(v.VS))vas=v.VS.map(n=>(n|0)>=0&&(n|0)<4?n|0:-1);
  proposals=v.P.map(x=>({from:x[0],to:ME,kind:x[1],t:x[2]}));
  logs=v.L.map(l=>({text:String(l[0]).slice(0,160),color:l[1]}));logDirty=true;
  for(const l of logs){if(!JOURNAL.slice(-30).some(j=>j.text===l.text)){JOURNAL.push({t:time,text:l.text,color:l.color});if(NET.bnOK)try{worldEvent(l.text,l.color);}catch(_){}}}
  NET.bnOK=true;
  if(JOURNAL.length>300)JOURNAL.splice(0,JOURNAL.length-300);
  for(const n of v.ak)NET.pending.delete(n);
  try{achCheck();}catch(_){}
  for(const [n,err] of v.rs){if(!NET.shown.has(n)){NET.shown.add(n);if(err)toast(err);}}
  NET.lastView=v;dirty=true;
  agModalSync();
  if(!started){started=true;overlay.hidden=true;NET.state='play';MODE='client';ui.sel=terrs.findIndex(t=>t.owner===ME&&t.capital);lastPanel='';updateHint();renderPanel(true);}
  if(v.ov&&!over){over={winners:v.ov.w,text:String(v.ov.x).slice(0,200)};showEnd();}
}
function clientAdvance(dt){
  if(TM.on&&TM.phase==='plan'&&TM.planLeft>0)TM.planLeft=Math.max(0,TM.planLeft-dt);
  if(!NET.lastView||NET.lastView.pz||over)return;
  const k=dt*(NET.sp||1);
  if(TM.on&&TM.phase==='res')TM.res=Math.max(0,TM.res-k);
  time+=k;
  for(const a of armies)a.t=Math.min(a.dur,a.t+k*evSpd());
  const p=players[ME];
  if(p&&p.rate){p.gold=Math.max(0,p.gold+p.rate.g*k);p.sci+=p.rate.s*k;p.faith+=p.rate.f*k;if(p.x)p.x.inf+=(p.rate.i||0)*k;}
}

/* ---- connexion ---- */
function mpMsg(t){const e=$('#o-mpmsg');if(e)e.textContent=t;}
async function mpEnter(role){
  let name=cleanName($('#n-name').value,'');
  if(!name){mpMsg('Choisissez un pseudo.');return;}
  let code=String($('#o-code').value||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6);
  if(role==='host'){const A='abcdefghjkmnpqrstuvwxyz23456789';code='';for(let i=0;i<5;i++)code+=A[Math.floor(Math.random()*A.length)];}
  else if(code.length<4){mpMsg('Saisissez le code de la partie (4 à 6 caractères).');return;}
  if(!NET.api){mpMsg(NET.why||'Multijoueur indisponible.');return;}
  try{localStorage.setItem('gl-name',name);}catch(_){}
  mpMsg('Connexion…');
  try{
    const kp=await genKeys();NET.priv=kp.priv;NET.pub=kp.pub;NET.name=name;NET.code=code;
    NET.room=await NET.api.join('gl-'+code);
  }catch(e){mpMsg('Connexion impossible ('+((e&&e.code)||'erreur')+').');NET.room=null;return;}
  NET.host=role==='host';NET.state='lobby';NET.phase='lobby';NET.hostGoneAt=performance.now();
  NET.seats=[null,null,null,null];NET.keys=[null,null,null,null];NET.lobbyKey='';NET.seatsKey='';
  NET.unsub.push(NET.room.onPeers(netPeers));
  NET.unsub.push(NET.room.on('snap',onSnap));
  NET.unsub.push(NET.room.on('cmd',onCmd));
  if(NET.host){
    NET.seedIn=String(Math.floor(Math.random()*90000)+1000);
    NET.room.presence({role:'host',name,pub:NET.pub,code,phase:'lobby',seats:[],seed:0,df:NET.diff,v:1}).catch(()=>{});
  }else NET.room.presence({role:'player',name,pub:NET.pub,v:1}).catch(()=>{});
  renderLobby();
}
function leaveNet(){
  try{NET.unsub.forEach(u=>u&&u());}catch(_){}
  NET.unsub=[];
  if(NET.room){try{NET.room.leave().catch(()=>{});}catch(_){}}
  NET.room=null;NET.state='off';NET.host=false;NET.phase='lobby';NET.seats=[null,null,null,null];NET.keys=[null,null,null,null];
  NET.hp=null;NET.hostKey=null;NET.hostKeyPub='';NET.pending.clear();NET.asm=null;NET.lastId=-1;NET.worldOK=false;NET.hostGoneAt=0;
  NET.lastView=null;NET.shown.clear();NET.cmdN=0;NET.endShown=false;NET.done=[new Set(),new Set(),new Set(),new Set()];NET.ack=[[],[],[],[]];NET.res=[[],[],[],[]];
  if(MODE!=='solo'){MODE='solo';ME=0;}
}
function netLost(text){leaveNet();showIntro();mpMsg(text);}
function netPeers(){
  const ps=NET.room?NET.room.peers():[];
  const me=ps.find(p=>p.isMe&&p.sameTab);if(me)NET.myPeer=me.peer;
  if(NET.host)hostSync(ps);else clientSync(ps);
  renderLobby();
}
function seatsPublic(){return NET.seats.map(x=>x?[x.peer,x.name]:0);}
function hostSync(ps){
  const here=new Set(ps.map(p=>p.peer));
  if(NET.myPeer&&!NET.seats[0])NET.seats[0]={peer:NET.myPeer,name:NET.name,pub:NET.pub};
  for(let s=1;s<4;s++){
    const st=NET.seats[s];
    if(st&&!here.has(st.peer)){
      if(NET.phase==='lobby')NET.seats[s]=null;
      else if(!st.gone){st.gone=true;takeover(s);}
    }
  }
  if(NET.phase==='lobby'){
    for(const p of ps){
      if(p.isMe||p.kind!=='viewer')continue;
      const pr=p.presence||{};
      if(pr.role!=='player'||typeof pr.pub!=='string'||pr.pub.length>200||typeof pr.name!=='string')continue;
      if(NET.seats.some(x=>x&&x.peer===p.peer))continue;
      const free=NET.seats.findIndex((x,i)=>i>0&&!x);
      if(free<0)continue;
      let nm=cleanName(pr.name,'Joueur'+free);
      while(NET.seats.some(x=>x&&x.name.toLowerCase()===nm.toLowerCase()))nm=nm.slice(0,12)+' '+(free+1);
      NET.seats[free]={peer:p.peer,name:nm,pub:pr.pub};
    }
  }
  const key=JSON.stringify(seatsPublic())+NET.phase;
  if(key!==NET.seatsKey&&NET.room){NET.seatsKey=key;NET.room.presence({seats:seatsPublic(),phase:NET.phase}).catch(()=>{});}
}
function takeover(s){
  const p=players[s];if(!p||!p.human)return;
  p.human=false;addLog(p.name+' est déconnecté : l\'IA prend le relais.','#9aa');
}
function clientSync(ps){
  const hp=ps.filter(p=>p.kind==='viewer'&&!p.isMe&&p.presence&&p.presence.role==='host').sort((a,b)=>a.updatedAt-b.updatedAt)[0]||null;
  NET.hp=hp;
  if(hp){
    NET.hostGoneAt=0;
    const pub=hp.presence.pub;
    if(typeof pub==='string'&&pub!==NET.hostKeyPub){
      NET.hostKeyPub=pub;
      deriveKey(NET.priv,pub).then(k=>{if(NET.hostKeyPub===pub)NET.hostKey=k;}).catch(()=>{});
    }
    if(hp.presence.phase==='play'&&NET.state==='lobby'){
      const seats=Array.isArray(hp.presence.seats)?hp.presence.seats:[];
      if(!seats.some(x=>x&&x[0]===NET.myPeer))netLost('La partie a déjà commencé ou la salle est complète.');
    }
  }else if(!NET.hostGoneAt)NET.hostGoneAt=performance.now();
}
function netWatch(now){
  if(NET.state==='off'||NET.host||!NET.hostGoneAt)return;
  if(now-NET.hostGoneAt>(NET.state==='play'?6000:7000))netLost(NET.state==='play'?'L\'hôte a quitté la partie.':'Aucune partie trouvée avec ce code.');
}

/* ---- lobby ---- */
function renderLobby(){
  if(NET.state!=='lobby')return;
  const seats=NET.host?seatsPublic():((NET.hp&&Array.isArray(NET.hp.presence.seats))?NET.hp.presence.seats:[]);
  const key=JSON.stringify(seats)+NET.host+(NET.hp?'h':'-');
  if(key===NET.lobbyKey&&overlay.querySelector('.lobby'))return;
  NET.lobbyKey=key;
  const rows=[0,1,2,3].map(i=>{
    const st=seats[i];
    return '<div class="seat"><span class="sw" style="background:'+COLORS[i]+'"></span><b>'+(st?esc(cleanName(st[1],'Joueur')):'<span class="muted">IA (place libre)</span>')+'</b><small class="muted">'+CREWS[i].n+'</small>'
      +(i===0?'<span class="tag">Hôte</span>':'')+(st&&st[0]===NET.myPeer?'<span class="tag">Vous</span>':'')+'</div>';
  }).join('');
  const n=seats.filter(Boolean).length;
  let ctl;
  if(NET.host){
    ctl='<div class="row"><label for="l-diff">IA<select id="l-diff">'+Object.keys(DIFF).map(k=>'<option value="'+k+'"'+(k===NET.diff?' selected':'')+'>'+DIFF[k].n+'</option>').join('')+'</select></label>'
      +'<label for="l-seed">Fruits n°<input id="l-seed" type="number" min="1" max="999999" value="'+esc(NET.seedIn)+'"></label>'
      +'<label for="l-mode">Mode<select id="l-mode"><option value="turn"'+(NET.mode==='turn'?' selected':'')+'>Tours simultanés</option><option value="real"'+(NET.mode==='real'?' selected':'')+'>Temps réel</option></select></label>'
      +'<label for="l-pace">Rythme<select id="l-pace">'+PACES.map(z=>'<option value="'+z.k+'"'+(+NET.pace===z.k?' selected':'')+'>'+z.n+' (≈ '+fmtDur(PACE_MIN()*z.k*60)+')</option>').join('')+'</select></label>'
      +'<label for="l-plan">Minuteur d\'ordres<select id="l-plan">'+[[0,'Aucun'],[60,'60 s'],[90,'90 s'],[120,'120 s']].map(x=>'<option value="'+x[0]+'"'+(+NET.plan===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></label></div>'
      +'<button class="btn primary" id="l-start">Lancer la partie ('+n+' joueur'+(n>1?'s':'')+')</button> ';
  }else ctl='<p class="note">'+(NET.hp?'En attente du lancement par l\'hôte…':'Recherche de la partie…')+'</p>';
  overlay.innerHTML='<div class="intro lobby"><h2>Salle d\'attente</h2>'
    +'<p class="lead">Code de la partie</p><div class="code" id="l-code">'+esc(NET.code)+'</div>'
    +'<p class="note" style="margin:6px 0 12px">'+(NET.host?'Donnez ce code aux autres joueurs : ils le saisissent dans « Rejoindre ». Les places libres seront tenues par l\'IA.':'Vous êtes connecté. L\'hôte choisit le moment de lancer.')+'</p>'
    +'<div class="seats">'+rows+'</div>'+ctl+'<button class="btn" id="l-quit" style="margin-top:10px">Quitter</button></div>';
  $('#l-quit').addEventListener('click',()=>{leaveNet();showIntro();});
  if(NET.host){
    $('#l-diff').addEventListener('change',e=>{NET.diff=e.target.value;});
    $('#l-seed').addEventListener('input',e=>{NET.seedIn=e.target.value;});
    $('#l-mode').addEventListener('change',e=>{NET.mode=e.target.value;});
    $('#l-plan').addEventListener('change',e=>{NET.plan=+e.target.value;});
    $('#l-pace').addEventListener('change',e=>{NET.pace=+e.target.value;});
    $('#l-start').addEventListener('click',hostStart);
  }
}
async function hostStart(){
  if(!NET.host||NET.phase!=='lobby')return;
  NET.phase='play';
  try{
    for(let s=1;s<4;s++)if(NET.seats[s])NET.keys[s]=await deriveKey(NET.priv,NET.seats[s].pub);
  }catch(_){NET.phase='lobby';return;}
  const used=new Set(NET.seats.filter(Boolean).map(x=>x.name.toLowerCase()));
  let ai=0;
  const names=[0,1,2,3].map(i=>{
    if(NET.seats[i])return NET.seats[i].name;
    let n=CREWS[i].cap;if(used.has(n.toLowerCase()))n+=' (IA)';
    used.add(n.toLowerCase());return n;
  });
  const humans=[0,1,2,3].map(i=>!!NET.seats[i]);
  const sd=Math.min(999999,Math.max(1,parseInt(NET.seedIn,10)||Math.floor(Math.random()*90000)+1000));
  ME=0;
  newGame(sd,NET.diff,{names,humans,turn:NET.mode!=='real',planMax:NET.mode!=='real'?(+NET.plan||0):0,pk:PACES.some(z=>z.k===+NET.pace)?+NET.pace:6});
  MODE='host';NET.state='play';elimShown=false;
  NET.last=[0,0,0,0];NET.urgent=[0,0,0,0];
  started=true;speed=TM.on?2:1;overlay.hidden=true;updateHint();renderPanel(true);
  NET.seatsKey='';
  NET.room.presence({phase:'play',seed:sd,df:NET.diff,seats:seatsPublic()}).catch(()=>{});
}

/* ---- hôte : envoi des vues et réception des commandes ---- */
async function sendSnap(s){
  const st=NET.seats[s];
  if(!st||st.gone||!NET.keys[s]||NET.busy[s]||!NET.room)return;
  NET.busy[s]=true;
  try{
    const str=await pack(NET.keys[s],buildView(s));
    const id=++NET.seq[s],CH=3000,n=Math.ceil(str.length/CH);
    for(let i=0;i<n;i++)NET.room.emit('snap',{t:st.peer,id,i,n,d:str.slice(i*CH,(i+1)*CH)}).catch(()=>{});
  }catch(_){}
  NET.busy[s]=false;
}
function netTick(){
  if(!NET.host||NET.phase!=='play'||!NET.room)return;
  const now=performance.now(),gap=over?1000:400;
  for(let s=1;s<4;s++){
    const st=NET.seats[s];if(!st||st.gone)continue;
    if(now-NET.last[s]>=gap||(NET.urgent[s]&&now-NET.last[s]>=120)){NET.last[s]=now;NET.urgent[s]=0;sendSnap(s);}
  }
}
async function onCmd(msg){
  if(!NET.host||msg.isMe||NET.phase!=='play')return;
  const s=NET.seats.findIndex((x,i)=>i>0&&x&&x.peer===msg.peer);
  if(s<1||!NET.keys[s]||!msg.data||typeof msg.data.d!=='string')return;
  let o;
  try{o=await unpack(NET.keys[s],msg.data.d);}catch(_){return;}
  if(!o||!Number.isInteger(o.n)||o.n<1)return;
  const done=NET.done[s];
  if(!done.has(o.n)){
    done.add(o.n);if(done.size>200)done.delete(done.values().next().value);
    let err='Camp éliminé ou remplacé par l\'IA.';
    if(players[s]&&players[s].human&&players[s].alive&&!over)err=exec(s,o.c);
    if(err){NET.res[s].push([o.n,err]);if(NET.res[s].length>10)NET.res[s].shift();}
  }
  NET.ack[s].push(o.n);if(NET.ack[s].length>60)NET.ack[s].shift();
  NET.urgent[s]=1;
}

/* ---- client : réception des vues et envoi des commandes ---- */
async function onSnap(msg){
  if(NET.host||msg.isMe||!NET.hostKey||!NET.hp||msg.peer!==NET.hp.peer)return;
  const d=msg.data;
  if(!d||d.t!==NET.myPeer||!Number.isInteger(d.id)||d.id<NET.lastId||typeof d.d!=='string'||!Number.isInteger(d.n)||!Number.isInteger(d.i)||d.n<1||d.n>12||d.i<0||d.i>=d.n)return;
  let a=NET.asm;
  if(!a||a.id!==d.id){if(a&&d.id<a.id)return;a={id:d.id,n:d.n,p:[],c:0};NET.asm=a;}
  if(a.p[d.i]===undefined){a.p[d.i]=d.d;a.c++;}
  if(a.c<a.n)return;
  NET.asm=null;
  try{const v=await unpack(NET.hostKey,a.p.join(''));if(a.id<NET.lastId)return;NET.lastId=a.id;applyView(v);}catch(_){}
}
function netSend(c){
  if(!NET.hostKey||!NET.room)return;
  const n=++NET.cmdN;NET.pending.set(n,{c,tries:0,at:0});
  pushCmds();
}
async function pushCmds(){
  if(!NET.room||!NET.hostKey)return;
  const now=performance.now();
  for(const [n,o] of NET.pending){
    if(now-o.at<500)continue;
    if(o.tries>=8){NET.pending.delete(n);continue;}
    o.at=now;o.tries++;
    try{const d=await pack(NET.hostKey,{n,c:o.c});NET.room.emit('cmd',{d}).catch(()=>{});}catch(_){}
  }
}

/* ---- élimination d'un joueur pendant que la partie continue ---- */
function checkElim(){
  if(over||MODE==='solo'||elimShown||!started||!players[ME]||players[ME].alive)return;
  elimShown=true;overlay.hidden=false;
  overlay.innerHTML='<div class="intro"><h2 style="color:var(--bad)">Éliminé</h2><p class="lead">Votre camp est tombé. La partie continue sans vous : vous pouvez observer la carte.</p><button class="btn primary" id="o-watch">Observer</button></div>';
  $('#o-watch').addEventListener('click',()=>{overlay.hidden=true;});
}

/* ================= Boucle principale ================= */
let last=performance.now(),acc=0,panelT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(MODE==='client')clientAdvance(dt);
  else if(started&&!over&&speed>0){
    acc+=dt*speed;
    let k=0;
    while(acc>=.05&&k<12&&!over){step(.05);acc-=.05;k++;}
    if(k>=12)acc=0;
  }
  tmTick(dt);agTick(dt);
  if(MODE==='host')netTick();
  if(MODE==='client'&&NET.pending.size&&now-NET.pushAt>250){NET.pushAt=now;pushCmds();}
  netWatch(now);checkElim();
  draw();updateTop();renderLog();
  if(++mTick%6===0)drawMini();
  panelT+=dt;
  if(AG.trn&&MODE==='client')AG.left=Math.max(0,AG.left-dt);
  if(panelT>.3){panelT=0;renderPanel(false);renderTModal();}
  else if(AG.trn){const tl=$('#tm-left');if(tl)tl.textContent=Math.ceil(AG.left);}
  requestAnimationFrame(frame);
}
new ResizeObserver(resize).observe($('#mapwrap'));
window.addEventListener('resize',resize);
seed=Math.floor(Math.random()*90000)+1000;
newGame(seed,'normal');
resize();
showIntro();
netInit();
renderPanel(true);
requestAnimationFrame(frame);
})();
</script>
<style>
/* ---- Combat arcade : apparence propre et fixe (sombre), indépendante du thème du jeu de stratégie ---- */
#arc{position:fixed;inset:0;z-index:1000;background:#0b1626;color:#eef3fb;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

const ROSTER=['luffy','zoro','sanji'];
/* synergies d'équipage : bonus permanents selon les personnages présents */

function stepHero(dt){
  const h=S.h,D=HEROES[h.k],U=ultOf(h);
  h.inv=Math.max(0,h.inv-dt);h.flash=Math.max(0,h.flash-dt);h.chainT=Math.max(0,h.chainT-dt);h.atkT=Math.max(0,h.atkT-dt);
  h.buff.counter=Math.max(0,h.buff.counter-dt);
  h.x+=h.kx*dt;h.y+=h.ky*dt;h.kx*=Math.max(0,1-8*dt);h.ky*=Math.max(0,1-8*dt);
  if(h.stun>0){h.stun-=dt;bound(h);return;}
  if(h.dash){
    const d=h.dash;h.x+=Math.cos(d.a)*d.spd*dt;h.y+=Math.sin(d.a)*d.spd*dt;d.t-=dt;d.trail-=dt;
    if(d.trail<=0){d.trail=.03;S.fx.push({k:'ghost',x:h.x,y:h.y,r:h.r,col:U?U.col:D.col,t:0,dur:.22});}
    if(d.hit)for(const f of S.foes)if(!f.dead&&!d.hit.has(f.id)&&dist(h,f)<=h.r+f.r+(d.slash?26:16)){d.hit.add(f.id);hitFoe(f,hAtk(h)*d.dmg,{a:d.a,kb:d.kb,stun:d.stun,heavy:true,en:3});}
    if(d.t<=0){h.dash=null;bound(h);if(d.end)d.end(h);}
    bound(h);return;
  }
  if(h.chan){const c=h.chan;c.t-=dt;c.tick-=dt;h.face=aimAngle();if(c.tick<=0&&c.n<c.max){c.tick+=c.every;c.n++;c.fn(h,c);}if(c.t<=0)h.chan=null;}
  /* déplacement : touches fléchées, sinon poursuite de la cible (attaque automatique), sinon point de destination */
  let mx=(IN.keys.right?1:0)-(IN.keys.left?1:0),my=(IN.keys.down?1:0)-(IN.keys.up?1:0);
  const spd=D.spd*(U?U.spd:1)*(h.chan?h.chan.mv:1)*(h.atkT>0?.55:1);
  const t=foeById(h.tgt);
  if(mx||my){const l=Math.hypot(mx,my);h.x+=mx/l*spd*dt;h.y+=my/l*spd*dt;if(!h.chan&&h.atkT<=0)h.face=Math.atan2(my,mx);h.dest=null;h.auto=false;}
  else if(h.auto&&t){
    const R=aaRange(h)*.8,d=dist(h,t),a=ang(h,t);
    if(d>R+t.r){h.x+=Math.cos(a)*spd*dt;h.y+=Math.sin(a)*spd*dt;if(h.atkT<=0)h.face=a;}
    else if(!h.chan)heroAttack(a);
  }else if(h.dest){
    const d=dist(h,h.dest);if(d<6)h.dest=null;else{const a=ang(h,h.dest),s=Math.min(d,spd*dt);h.x+=Math.cos(a)*s;h.y+=Math.sin(a)*s;if(!h.chan&&h.atkT<=0)h.face=a;}
  }
  if(IN.atk&&!h.chan)heroAttack(aimAngle());
  bound(h);
}
function bound(e){e.x=clamp(e.x,e.r+8,W-e.r-8);e.y=clamp(e.y,e.r+8,H-e.r-8);}

/* ---------- 5. ÉQUIPAGE : recharges de tous, changement, assistance, attaque combinée ---------- */
function stepTeam(dt){
  S.swapCd=Math.max(0,S.swapCd-dt);
  for(const h of S.team){
    const D=HEROES[h.k],U=ultOf(h);
    for(const k in h.cd)if(h.cd[k]>0)h.cd[k]=Math.max(0,h.cd[k]-dt*(U&&U.cdK>1&&(k==='q'||k==='w'||k==='e')?U.cdK:1));
    h.asCd=Math.max(0,h.asCd-dt);
    if(h.buff.ult>0){h.buff.ult-=dt;if(h.buff.ult<=0){h.buff.ult=0;if(h===S.h)addTxt(h.x,h.y-50,'Fin : '+D.ult.label,'#cfd8e6',1);}}
    if(h.ko)continue;
    h.en=Math.min(h.enM,h.en+D.enR*S.syn.enR*dt);
    if(h!==S.h)h.hp=Math.min(h.hpM,h.hp+h.hpM*.01*dt);   /* au repos : +1 % de PV par seconde */
  }
}
function swapWhy(i,forced){

}

}

  else{areaCone(h,h,a,380,.7,5.5*base,{kb:150});S.fx.push({k:'slash',x:h.x,y:h.y,a,r:380,half:.7,t:0,dur:.35,col:'#fff2c9'});}

/* ---------- 6. ENNEMIS ---------- */
function spawn(k,x,y,elite){
  const D=FOES[k],m=elite?2:1;
  const f={id:S.id++,k,x,y,r:D.r*(elite?1.15:1),hp:D.hp*m,hpM:D.hp*m,spd:D.spd,dmg:D.dmg*(elite?1.3:1),cd:.8+Math.random()*1.2,st:'move',wt:0,wtM:1,aimA:0,stun:0,flash:0,kx:0,ky:0,elite:!!elite,boss:!!D.boss,ph:1,invul:0,born:.45,dead:false,pat:'',burn:0,burnD:0,burnT:0};
  bound(f);S.foes.push(f);S.fx.push({k:'ring',x:f.x,y:f.y,r0:f.r*2.4,r1:f.r,t:0,dur:.45,col:'#ff5a4e'});
  return f;
}
function stepFoes(dt){
  const h=S.h;
  for(const f of S.foes){
    if(f.dead)continue;
    f.flash=Math.max(0,f.flash-dt);f.invul=Math.max(0,f.invul-dt);
    f.x+=f.kx*dt;f.y+=f.ky*dt;f.kx*=Math.max(0,1-7*dt);f.ky*=Math.max(0,1-7*dt);
    if(f.burn>0){f.burn-=dt;f.burnT-=dt;if(f.burnT<=0){f.burnT+=.5;if(f.invul<=0){const d=Math.max(1,Math.round(f.burnD*.5));f.hp-=d;S.dmgDone+=d;addTxt(f.x,f.y-f.r-6,String(d),'#ff9a4e',.85);if(f.hp<=0){killFoe(f);continue;}}}}
    if(f.born>0){f.born-=dt;continue;}
    if(f.stun>0){f.stun-=dt;bound(f);continue;}
    const D=FOES[f.k],d=dist(f,h),a=ang(f,h);
    if(D.ai==='boss')aiBoss(f,dt,d,a);
    else if(f.st==='wind'){
      f.wt-=dt;
      if(f.wt<=0){
        if(D.ai==='melee'){if(inCone(f,f.aimA,72,.75,h))hurtHero(f.dmg,D.ty,f);}
        else if(D.ai==='gunner'){S.shots.push({x:f.x+Math.cos(f.aimA)*f.r,y:f.y+Math.sin(f.aimA)*f.r,vx:Math.cos(f.aimA)*540,vy:Math.sin(f.aimA)*540,dmg:f.dmg,ty:'bullet',team:1,from:f.id,life:1.5,r:5});beep(700,.03,'square',.15);}
        else if(D.ai==='brute'){S.fx.push({k:'ring',x:f.x,y:f.y,r0:20,r1:110,t:0,dur:.25,col:'#ff8a5e'});if(!REDUCE)S.shake=Math.max(S.shake,.15);if(inCircle(f,108,h))hurtHero(f.dmg,D.ty,f);}
        f.st='move';f.cd=D.ai==='melee'?1.1+Math.random()*.4:D.ai==='gunner'?2.2+Math.random()*.8:2.8;
      }
    }else{
      f.cd-=dt;
      if(D.ai==='melee'){
        if(d>40+h.r){f.x+=Math.cos(a)*f.spd*dt;f.y+=Math.sin(a)*f.spd*dt;}
        if(f.cd<=0&&d<62+h.r)wind(f,.42,a);
      }else if(D.ai==='gunner'){
        const m=d<250?-1:d>420?1:0,sa=a+Math.PI/2*(f.id%2?1:-1);
        if(m){f.x+=Math.cos(a)*f.spd*m*dt;f.y+=Math.sin(a)*f.spd*m*dt;}else{f.x+=Math.cos(sa)*f.spd*.35*dt;f.y+=Math.sin(sa)*f.spd*.35*dt;}
        if(f.cd<=0&&d<500)wind(f,.7,a);
      }else if(D.ai==='brute'){
        if(d>70+h.r){f.x+=Math.cos(a)*f.spd*dt;f.y+=Math.sin(a)*f.spd*dt;}
        if(f.cd<=0&&d<95+h.r)wind(f,.8,a);
      }
    }
    bound(f);
  }
  /* les ennemis ne se superposent pas */
  for(let i=0;i<S.foes.length;i++){const p=S.foes[i];if(p.dead)continue;for(let j=i+1;j<S.foes.length;j++){const q=S.foes[j];if(q.dead)continue;const d=dist(p,q),m=p.r+q.r;if(d<m&&d>.01){const o=(m-d)/2,ux=(q.x-p.x)/d,uy=(q.y-p.y)/d,wp=p.boss?0:q.boss?2:1,wq=q.boss?0:p.boss?2:1;p.x-=ux*o*wp;p.y-=uy*o*wp;q.x+=ux*o*wq;q.y+=uy*o*wq;}}}
  if(S.foes.some(f=>f.dead))S.foes=S.foes.filter(f=>!f.dead);
}
function wind(f,t,a){f.st='wind';f.wt=t;f.wtM=t;f.aimA=a;}

/* ---------- 7. BOSS : Morgan, 2 phases ---------- */
function aiBoss(f,dt,d,a){
  const h=S.h,D=FOES[f.k];
  if(f.ph===1&&f.hp<=f.hpM*.5){
    f.ph=2;f.st='roar';f.wt=.9;f.wtM=.9;f.invul=.9;f.spd*=1.25;
    addTxt(f.x,f.y-80,'PHASE 2 — Morgan enrage','#ff6b5e',1.5);beep(70,.5,'sawtooth',.6);
    for(let i=0;i<4;i++){const q=TAU*i/4+Math.random();spawn('soldat',f.x+Math.cos(q)*150,f.y+Math.sin(q)*150);}
    return;
  }
  if(f.st==='roar'){f.wt-=dt;if(f.wt<=0){S.fx.push({k:'ring',x:f.x,y:f.y,r0:40,r1:240,t:0,dur:.35,col:'#ff5a4e'});S.shake=.4;if(inCircle(f,230,h))hurtHero(10,'blunt',f);f.st='move';f.cd=.8;}return;}
  if(f.st==='wind'){
    f.wt-=dt;
    if(f.wt<=0){
      if(f.pat==='cleave'){S.fx.push({k:'slash',x:f.x,y:f.y,a:f.aimA,r:195,half:1,t:0,dur:.22,col:'#ff8a5e'});S.shake=.25;if(inCone(f,f.aimA,195,1,h))hurtHero(f.dmg,'slash',f);f.st='rec';f.wt=f.wtM=1.15;}
      else if(f.pat==='charge'){f.st='dash';f.wt=.3;f.hitDone=false;}
      else{const n=3;for(let i=0;i<n;i++)S.later.push({at:S.t+i*.45,fn:()=>{if(!S.over)S.zones.push({x:S.h.x,y:S.h.y,r:105,t:.9,dur:.9,dmg:50,ty:'blunt'});}});f.st='rec';f.wt=f.wtM=.9;}
    }
    return;
  }
  if(f.st==='dash'){
    f.x+=Math.cos(f.aimA)*1500*dt;f.y+=Math.sin(f.aimA)*1500*dt;f.wt-=dt;
    S.fx.push({k:'ghost',x:f.x,y:f.y,r:f.r,col:D.col,t:0,dur:.2});
    if(!f.hitDone&&dist(f,h)<=f.r+h.r+12){f.hitDone=true;hurtHero(45,'slash',f);}
    if(f.wt<=0){f.st='rec';f.wt=f.wtM=1.15;}
    return;
  }
  if(f.st==='rec'){f.wt-=dt;if(f.wt<=0){f.st='move';f.cd=f.ph===2?.45:.8;}return;}
  if(d>120+h.r){f.x+=Math.cos(a)*f.spd*dt;f.y+=Math.sin(a)*f.spd*dt;}
  f.cd-=dt;
  if(f.cd<=0){
    const rnd=Math.random();
    if(f.ph===2&&rnd<.35){f.pat='quake';wind(f,.6,a);}
    else if(d>270){f.pat='charge';wind(f,.75,a);}
    else{f.pat='cleave';wind(f,f.ph===2?.7:.85,a);}
  }
}

/* ---------- 8. PROGRESSION (propre à la mission) : l'expérience est partagée, tout l'équipage monte de niveau ensemble ---------- */
function gainXp(n){
  for(const h of S.team){
    const D=HEROES[h.k];h.xp+=n;
    while(h.lv<MAXLV&&h.xp>=xpNeed(h.lv)){
      h.xp-=xpNeed(h.lv);h.lv++;
      const nm=Math.round(D.hp*(1+.08*(h.lv-1)));if(!h.ko)h.hp=Math.min(nm,h.hp+(nm-h.hpM)+nm*.1);h.hpM=nm;
      if(h===S.h){
        const un=Object.keys(D.sk).filter(k=>D.sk[k].lv===h.lv).length;
        addTxt(h.x,h.y-70,'NIVEAU '+h.lv+(un?' — ultime débloqué':''),'#8dff9a',1.4);
        S.fx.push({k:'ring',x:h.x,y:h.y,r0:20,r1:120,t:0,dur:.5,col:'#8dff9a'});beep(520,.1,'triangle',.4);beep(780,.16,'triangle',.4);
      }

/* ---------- 9. MISSION : vagues, fin, rang ---------- */
function startWave(){
  const M=MISSIONS[S.mid],w=M.waves[S.wave],h=S.h;
  for(const g of w)for(let i=0;i<g[1];i++){
    let x,y,n=0;do{const a=Math.random()*TAU,r=430+Math.random()*260;x=clamp(h.x+Math.cos(a)*r,60,W-60);y=clamp(h.y+Math.sin(a)*r,60,H-60);n++;}while(Math.hypot(x-h.x,y-h.y)<330&&n<30);
    if(FOES[g[0]].boss){x=clamp(h.x+(h.x<W/2?520:-520),120,W-120);y=clamp(h.y,150,H-150);}
    spawn(g[0],x,y,g[2]);
  }
  S.wave++;S.waveT=-1;
  const boss=S.foes.find(f=>f.boss);
  addTxt(h.x,h.y-110,boss?'BOSS — '+FOES[boss.k].n:'VAGUE '+S.wave+' / '+M.waves.length,boss?'#ff6b5e':'#ffffff',1.7);
  beep(boss?80:392,.25,boss?'sawtooth':'triangle',.5);
}
function stepMission(dt){
  const M=MISSIONS[S.mid];
  if(S.waveT>=0){S.waveT-=dt;if(S.waveT<=0)startWave();return;}
  if(!S.foes.length){
    if(S.wave>=M.waves.length){finish(true);return;}
    /* entre deux vagues : soin de 8 %, et les personnages K.O. se relèvent avec 30 % de leurs PV */
    let up=[];for(const h of S.team){if(h.ko){h.ko=false;h.hp=Math.round(h.hpM*.3);up.push(HEROES[h.k].s);}else h.hp=Math.min(h.hpM,h.hp+Math.round(h.hpM*.08));}
    addTxt(S.h.x,S.h.y-80,'Vague terminée · soin'+(up.length?' · '+up.join(' et ')+' se relève'+(up.length>1?'nt':''):''),'#8dff9a',1.2);S.waveT=2.2;
  }
}
/* Rang : 4 critères, 1500 points au plus. S ≥ 1200, A ≥ 900, B ≥ 600, sinon C (mission terminée). */
function rankOf(){
  const M=MISSIONS[S.mid];
  const parts=[
    ['Rapidité',Math.round(400*clamp((M.par*2-S.t)/M.par,0,1)),fmtT(S.t)+' (référence '+fmtT(M.par)+')'],
    ['Combo maximal',Math.min(400,S.maxCombo*8),S.maxCombo+' coups'],
    ['Esquives parfaites',Math.min(300,S.perfect*50),String(S.perfect)],
    ['Dégâts subis',Math.round(400*clamp(1-S.dmgTaken/S.hpRef,0,1)),S.dmgTaken+' PV perdus']
  ];
  const score=parts.reduce((a,p)=>a+p[1],0);
  return {score,parts,r:score>=1200?'S':score>=900?'A':score>=600?'B':'C'};
}
function finish(win){
  if(S.over)return;
  const R=win?rankOf():null;
  S.over={win,rank:R?R.r:'',score:R?R.score:0,parts:R?R.parts:[],best:false};
  STORE.runs++;
  if(win){const b=STORE.best[S.mid];if(!b||R.score>b.s){STORE.best[S.mid]={r:R.r,s:R.score,t:Math.round(S.t)};S.over.best=true;}}
  save();IN.atk=false;IN.aimK=null;
  if(win){beep(523,.15,'triangle',.5);beep(659,.15,'triangle',.5);beep(784,.3,'triangle',.5);}else beep(110,.5,'sawtooth',.5);
  showEnd();
}
function step(dt){
  if(!S||S.over||S.paused)return;
  dt=Math.min(dt,.05);S.t+=dt;
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
  S.shake=Math.max(0,S.shake-dt);
  if(S.later.length){const due=S.later.filter(e=>e.at<=S.t);if(due.length){S.later=S.later.filter(e=>e.at>S.t);for(const e of due)e.fn();}}
  stepTeam(dt);stepHero(dt);if(S.over)return;
  stepFoes(dt);if(S.over)return;
  /* projectiles : les balles rebondissent sur les héros dont le passif le prévoit (Luffy) */
  for(const b of S.shots){
    const h=S.h;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.team===1){
      if(dist(b,h)<=b.r+h.r){
        if(h.inv>0){hurtHero(b.dmg,b.ty,null);b.life=0;}
        else if(HEROES[h.k].pas.bounce&&b.ty==='bullet'){const src=foeById(b.from),a=src?ang(b,src):Math.atan2(-b.vy,-b.vx);b.team=0;b.vx=Math.cos(a)*620;b.vy=Math.sin(a)*620;b.dmg=Math.round(b.dmg*2.5);b.life=1.2;addTxt(h.x,h.y-40,'Renvoyé !','#ffd95a',1);beep(900,.04,'square',.2);}
        else{hurtHero(b.dmg,b.ty,null);b.life=0;}
      }
    }else for(const f of S.foes)if(!f.dead&&dist(b,f)<=b.r+f.r){hitFoe(f,b.dmg,{a:Math.atan2(b.vy,b.vx),kb:30});b.life=0;break;}
    if(b.x<0||b.y<0||b.x>W||b.y>H)b.life=0;
    if(S.over)return;
  }
  S.shots=S.shots.filter(b=>b.life>0);
  for(const z of S.zones){z.t-=dt;if(z.t<=0){S.fx.push({k:'ring',x:z.x,y:z.y,r0:20,r1:z.r,t:0,dur:.25,col:'#ff8a5e'});if(!REDUCE)S.shake=Math.max(S.shake,.2);if(inCircle(z,z.r,S.h))hurtHero(z.dmg,z.ty,z);}}
  S.zones=S.zones.filter(z=>z.t>0);
  if(S.over)return;
  stepMission(dt);
  for(const e of S.fx){e.t+=dt;if(e.k==='spark'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=.92;e.vy*=.92;}}
  S.fx=S.fx.filter(e=>e.t<e.dur);if(S.fx.length>260)S.fx.splice(0,S.fx.length-260);
  for(const e of S.txt){e.t+=dt;e.y-=34*dt;}
  S.txt=S.txt.filter(e=>e.t<e.dur);
  const h=S.h;S.cam.x+=(clamp(h.x,0,W)-S.cam.x)*Math.min(1,8*dt);S.cam.y+=(clamp(h.y,0,H)-S.cam.y)*Math.min(1,8*dt);
}

/* ---------- 10. EFFETS ---------- */
function addTxt(x,y,s,col,k){S.txt.push({x:x+(Math.random()-.5)*14,y,s,col,k:k||1,t:0,dur:k>1.2?1.3:.8});if(S.txt.length>40)S.txt.shift();}
function sparks(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=90+Math.random()*260;S.fx.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,dur:.25+Math.random()*.25,col,s:2+Math.random()*3});}}
let AC=null;
function beep(f,d,type,vol){
  if(manual)return;
  try{
    let on=true,v=.35;try{const o=JSON.parse(localStorage.getItem('gl-snd')||'null');if(o){on=o.on!==false;if(+o.vol>0&&+o.vol<=1)v=+o.vol;}}catch(_){}
    if(!on||!AC)return;

    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,(vol||.4)*v*.5),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(_){}
}
function audioOn(){if(AC||manual)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}catch(_){}}

/* ---------- 11. RENDU ---------- */
let shx=0,shy=0;
const wx=x=>(x-S.cam.x)*sc+cw/2+shx,wy=y=>(y-S.cam.y)*sc+ch/2+shy;
function resize(){
  if(!cv)return;const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  cw=Math.max(200,r.width);ch=Math.max(200,r.height);cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);cx.setTransform(dpr,0,0,dpr,0,0);
  sc=clamp(Math.min(cw/980,ch/600),.58,1.5);
}
function token(x,y,r,col,letter,face,o){

  cx.fillStyle='rgba(10,20,40,.28)';cx.beginPath();cx.ellipse(X+3*sc,Y+R*.75,R*1.02,R*.42,0,0,TAU);cx.fill();
  if(o.ring){cx.strokeStyle=o.ring;cx.lineWidth=3*sc;cx.beginPath();cx.arc(X,Y,R+5*sc,0,TAU);cx.stroke();}
  cx.fillStyle=o.flash?'#ffffff':col;cx.beginPath();cx.arc(X,Y,R,0,TAU);cx.fill();
  cx.strokeStyle=o.out||'#14213b';cx.lineWidth=2.5*sc;cx.stroke();
  if(face!==null){cx.fillStyle=o.out||'#14213b';cx.beginPath();cx.moveTo(X+Math.cos(face)*(R+9*sc),Y+Math.sin(face)*(R+9*sc));cx.lineTo(X+Math.cos(face+.5)*R,Y+Math.sin(face+.5)*R);cx.lineTo(X+Math.cos(face-.5)*R,Y+Math.sin(face-.5)*R);cx.closePath();cx.fill();}
  cx.fillStyle=o.txt||'#ffffff';cx.font='700 '+Math.round(R*1.05)+'px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(letter,X,Y+1);
}
function cone(x,y,a,r,half,fill,stroke){const X=wx(x),Y=wy(y);cx.beginPath();cx.moveTo(X,Y);cx.arc(X,Y,r*sc,a-half,a+half);cx.closePath();if(fill){cx.fillStyle=fill;cx.fill();}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=2;cx.stroke();}}
function lineShape(x,y,a,len,w,fill,stroke){cx.save();cx.translate(wx(x),wy(y));cx.rotate(a);if(fill){cx.fillStyle=fill;cx.fillRect(0,-w*sc/2,len*sc,w*sc);}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=2;cx.strokeRect(0,-w*sc/2,len*sc,w*sc);}cx.restore();}
function circ(x,y,r,fill,stroke){cx.beginPath();cx.arc(wx(x),wy(y),r*sc,0,TAU);if(fill){cx.fillStyle=fill;cx.fill();}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=2;cx.stroke();}}
function render(){
  if(!S||!cx)return;
  const h=S.h,D=HEROES[h.k],U=ultOf(h);
  shx=shy=0;if(S.shake>0&&!REDUCE){shx=(Math.random()-.5)*18*S.shake;shy=(Math.random()-.5)*18*S.shake;}

  cx.strokeStyle='rgba(255,255,255,.10)';cx.lineWidth=2;
  for(let i=-2;i<14;i++){const yy=((i*90-S.cam.y*.3+S.t*14)%1100+1100)%1100-60;cx.beginPath();for(let x=0;x<=cw;x+=40)cx.lineTo(x,yy*ch/900+Math.sin(x*.02+i+S.t)*5);cx.stroke();}

      +'<table class="arc-tab"><tbody>'+o.parts.map(p=>'<tr><td>'+p[0]+'</td><td>'+esc(p[2])+'</td><td>'+p[1]+'</td></tr>').join('')+'</tbody></table>'
      +'<p class="m">Rang S à partir de 1200 points, A à 900, B à 600, C en dessous.</p>'
      :'<p class="lead">Tout l\'équipage est K.O. à la vague '+S.wave+' sur '+MISSIONS[S.mid].waves.length+'. '+S.kills+' ennemis vaincus en '+fmtT(S.t)+'.</p>')
    +'<p class="m">Niveau atteint : '+S.h.lv+' · combo maximal : '+S.maxCombo+' · esquives parfaites : '+S.perfect+' · dégâts infligés : '+S.dmgDone+' · changements : '+S.swaps+' · assistances : '+S.assists+' · duos : '+S.duos+'.</p>'
    +'<div class="arc-row"><button type="button" class="arc-btn pri" id="arc-again">Rejouer</button><button type="button" class="arc-btn" id="arc-quit">Retour au menu</button></div></div>';
  $('#arc-again').addEventListener('click',()=>start(S.mid));
  $('#arc-quit').addEventListener('click',close);
}
function pause(v){
  if(!S||S.over||S.brief)return;S.paused=v;IN.atk=false;IN.aimK=null;
  const ov=$('#arc-ov');ov.hidden=!v;
  if(v){ov.innerHTML='<div class="arc-card"><h2>Pause</h2><h3>'+esc(HEROES[S.h.k].n)+'</h3>'+kitHTML(S.h.k)+'<h3>Équipage</h3>'+teamHTML(S.team.map(h=>h.k))+'<div class="arc-row"><button type="button" class="arc-btn pri" id="arc-res">Reprendre</button><button type="button" class="arc-btn" id="arc-quit">Abandonner</button></div></div>';
    $('#arc-res').addEventListener('click',()=>pause(false));$('#arc-quit').addEventListener('click',close);}
}
function say(why){if(why&&S&&!S.over)addTxt(S.h.x,S.h.y-46,why,'#cfd8e6',.9);return why;}

/* ---------- 13. ENTRÉES ---------- */
const KEYMAP={q:'q',a:'q',w:'w',z:'w',e:'e',r:'r'};
const ARROWS={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right'};
const DIGIT={'1':0,'2':1,'3':2,'&':0,'é':1,'"':2};
const mates=()=>S.team.map((m,i)=>i).filter(i=>S.team[i]!==S.h);
function onKey(e,down){
  if(!open)return;
  const k=(e.key||'').toLowerCase();
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const run=S&&!S.over&&!S.brief&&!S.paused;
  if(k!=='enter'&&(k!=='tab'||run))e.stopPropagation();
  if(!run){if(down&&k==='escape'&&S&&S.paused&&!S.brief)pause(false);return;}
  let used=true;
  if(ARROWS[k])IN.keys[ARROWS[k]]=down;
  else if(KEYMAP[k]){const s=KEYMAP[k];if(down){if(!e.repeat)IN.aimK=s;}else if(IN.aimK===s){IN.aimK=null;cast(s);}}
  else if(k===' '||k==='spacebar'){if(down&&!e.repeat){const mx=(IN.keys.right?1:0)-(IN.keys.left?1:0),my=(IN.keys.down?1:0)-(IN.keys.up?1:0);heroDodge(mx||my?Math.atan2(my,mx):IN.mouse?aimAngle():S.h.face);}}
  else if(k in DIGIT){if(down&&!e.repeat&&DIGIT[k]!==S.ai)say(swapTo(DIGIT[k]));}
  else if(k==='tab'){if(down&&!e.repeat){const n=S.team.length;for(let j=1;j<n;j++){const i=(S.ai+j)%n;if(!S.team[i].ko){say(swapTo(i));break;}}}}
  else if(k==='f'||k==='g'){if(down&&!e.repeat){const i=mates()[k==='f'?0:1];if(i!==undefined)say(assist(i));}}
  else if(k==='t'){if(down&&!e.repeat)say(duo());}
  else if(k==='escape'||k==='p'){if(down)pause(true);}
  else used=false;
  if(used)e.preventDefault();
}
function toWorld(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-cw/2)/sc+S.cam.x,y:(e.clientY-r.top-ch/2)/sc+S.cam.y};}
function foeAt(p){let b=null,bd=1e9;for(const f of S.foes){if(f.dead)continue;const d=dist(p,f);if(d<=f.r+14&&d<bd){bd=d;b=f;}}return b;}
function moveOrder(p){const h=S.h,f=foeAt(p);if(f){h.tgt=f.id;h.auto=true;h.dest=null;}else{h.dest={x:clamp(p.x,30,W-30),y:clamp(p.y,30,H-30)};h.auto=false;}}
/* une action lancée depuis un bouton vise la cible ou l'ennemi le plus proche, pas le curseur (qui est sur le bouton) */
function noMouse(fn){const m=IN.mouse;IN.mouse=false;const r=fn();IN.mouse=m;return r;}
function bindInput(){
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{
    if(!S||S.over||S.paused)return;audioOn();const p=toWorld(e);
    if(e.pointerType==='mouse'){IN.mouse=true;IN.mx=p.x;IN.my=p.y;if(e.button===0){IN.atk=true;}else if(e.button===2)moveOrder(p);}
    else{IN.mouse=false;moveOrder(p);}
    e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{if(!S||e.pointerType!=='mouse')return;IN.mouse=true;const p=toWorld(e);IN.mx=p.x;IN.my=p.y;});
  window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'&&e.button===0)IN.atk=false;});
  window.addEventListener('keydown',e=>onKey(e,true),true);
  window.addEventListener('keyup',e=>onKey(e,false),true);
  window.addEventListener('blur',()=>{IN.keys={};IN.atk=false;IN.aimK=null;});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&open&&S&&!S.over&&!S.paused)pause(true);});
  const sks=$('#arc-sks');
  sks.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.arc-sk');if(!b||!S||S.over||S.paused)return;audioOn();const k=b.dataset.k;
    if(e.pointerType!=='mouse')IN.mouse=false;
    if(k==='atk'){IN.atk=true;const up=()=>{IN.atk=false;window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);};window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);}
    else if(k==='dodge'){const mx=(IN.keys.right?1:0)-(IN.keys.left?1:0),my=(IN.keys.down?1:0)-(IN.keys.up?1:0);heroDodge(mx||my?Math.atan2(my,mx):S.h.face+Math.PI);}
    else if(k==='duo')say(noMouse(duo));
    else say(noMouse(()=>cast(k)));
    e.preventDefault();
  });
  sks.addEventListener('pointerover',e=>{const b=e.target.closest('.arc-sk');if(b&&S&&'qwer'.includes(b.dataset.k)&&e.pointerType==='mouse'){IN.aimK=b.dataset.k;IN.hov=true;}});
  sks.addEventListener('pointerout',()=>{if(IN.hov){IN.aimK=null;IN.hov=false;}});
  $('#arc-mates').addEventListener('pointerdown',e=>{
    const b=e.target.closest('button');if(!b||!S||S.over||S.paused)return;audioOn();const i=+b.dataset.i;
    if(e.pointerType!=='mouse')IN.mouse=false;
    if(b.dataset.act==='swap')say(swapTo(i));else say(noMouse(()=>assist(i)));
    e.preventDefault();
  });
  $('#arc-pause').addEventListener('click',()=>pause(true));
  window.addEventListener('resize',resize);
}

/* ---------- 14. API ---------- */
function frame(ts){
  raf=open?requestAnimationFrame(frame):0;
  const real=Math.min(.05,Math.max(0,(ts-lastT)/1000));lastT=ts;
  if(!S||manual)return;
  if(!S.over&&!S.paused){
    if(S.stop>0)S.stop-=real;
    else{let k=1;if(S.slow>0){S.slow-=real;k=.35;}step(real*k);}
  }
  render();hud();
}
function start(mid,team){
  S=newState(mid||'shells',team);IN.keys={};IN.atk=false;IN.aimK=null;IN.mouse=false;
  if(cv){const ov=$('#arc-ov');if(ov)ov.hidden=true;buildHud();resize();hud();render();}
  return S;
}
function ensureDom(){
  let el=$('#arc');
  if(!el){el=document.createElement('div');el.id='arc';el.hidden=true;document.body.appendChild(el);}
  if(!cv){el.innerHTML=HTML;cv=$('#arc-cv');cx=cv.getContext('2d');bindInput();}
  return el;
}
function openArc(mid){
  const el=ensureDom();el.hidden=false;open=true;briefSel=0;S=newState(mid||'shells');S.paused=true;S.brief=true;buildHud();resize();render();hud();showBrief(mid||'shells');
  if(!raf){lastT=performance.now();raf=requestAnimationFrame(frame);}
}
function close(){open=false;S=null;IN.keys={};IN.atk=false;const el=$('#arc');if(el)el.hidden=true;if(raf){cancelAnimationFrame(raf);raf=0;}}
window.ARC={open:openArc,close,start,step,render,hud,cast,attack:heroAttack,dodge:heroDodge,spawn,castWhy,rankOf,pause,swap:swapTo,swapWhy,assist,assistWhy,duo,duoWhy,synOf,
  S:()=>S,IN,HEROES,FOES,MISSIONS,SYN,DUOS,ROSTER,STORE:()=>STORE,isOpen:()=>open,setManual:v=>{manual=!!v;},hurt:hurtHero,hit:hitFoe,W,H,xpNeed,gainXp,atkOf:h=>hAtk(h)};
})();
</script>
